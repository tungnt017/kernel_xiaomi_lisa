name: Build SukiSU-Ultra builtin (lisa) - JackA1ltman + compat v15

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: "Kernel branch (lisa)"
        required: true
        default: "thirteen"
      defconfig:
        description: "Defconfig name"
        required: true
        default: "lisa_defconfig"
      sukisu_mode:
        description: "setup.sh mode"
        required: true
        default: "builtin"
        type: choice
        options:
          - builtin
      sukisu_ref:
        description: "SukiSU-Ultra git ref"
        required: true
        default: "v4.1.3"
      jack_repo:
        description: "JackA1ltman patches repo"
        required: true
        default: "https://github.com/JackA1ltman/NonGKI_Kernel_Build_2nd.git"
      jack_branch:
        description: "JackA1ltman branch"
        required: true
        default: "mainline"

permissions:
  contents: read

env:
  KERNEL_REPO:  tungnt017/kernel_xiaomi_lisa
  KERNEL_DIR:   kernel_xiaomi_lisa
  ARCH:         arm64
  SUBARCH:      arm64
  DEFCONFIG:    ${{ github.event.inputs.defconfig     || 'lisa_defconfig' }}
  SUKISU_MODE:  ${{ github.event.inputs.sukisu_mode   || 'builtin' }}
  SUKISU_REF:   ${{ github.event.inputs.sukisu_ref    || 'v4.1.3' }}
  KBRANCH:      ${{ github.event.inputs.kernel_branch || 'thirteen' }}
  JACK_REPO:    ${{ github.event.inputs.jack_repo     || 'https://github.com/JackA1ltman/NonGKI_Kernel_Build_2nd.git' }}
  JACK_BRANCH:  ${{ github.event.inputs.jack_branch   || 'mainline' }}

jobs:
  build:
    name: Build kernel
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout workflow repo scripts
        uses: actions/checkout@v4
        with:
          path: workflow-repo

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.KERNEL_REPO }}
          ref: ${{ env.KBRANCH }}
          path: ${{ env.KERNEL_DIR }}
          fetch-depth: 1

      - name: Copy scripts into kernel tree
        run: |
          set -euo pipefail
          mkdir -p "$KERNEL_DIR/.github/scripts"
          cp -v workflow-repo/.github/scripts/fix_show_smap_return.py    "$KERNEL_DIR/.github/scripts/"
          cp -v workflow-repo/.github/scripts/fix_sukisu_5_4_compat.py   "$KERNEL_DIR/.github/scripts/"
          cp -v workflow-repo/.github/scripts/fix_stat_struct_mount.py   "$KERNEL_DIR/.github/scripts/"
          cp -v workflow-repo/.github/scripts/fix_selinux_hide_build.py  "$KERNEL_DIR/.github/scripts/"
          cp -v workflow-repo/.github/scripts/fix_devpts_hook.py         "$KERNEL_DIR/.github/scripts/"

      - name: Install minimal build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bc bison build-essential ccache curl flex git libssl-dev libelf-dev zip unzip python3 python3-pip cpio rsync kmod patch python2

      - name: Integrate SukiSU-Ultra builtin (pinned via setup.sh URL)
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -euo pipefail
          REF=$(echo "$SUKISU_REF" | xargs)
          echo "==> Running setup.sh from SukiSU-Ultra@$REF"
          curl -fLSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/${REF}/kernel/setup.sh" | bash -s "$SUKISU_MODE"

          KSU_DIR=""
          if [ -d "KernelSU" ]; then
            KSU_DIR="KernelSU"
          elif [ -d "drivers/kernelsu" ]; then
            KSU_DIR="drivers/kernelsu"
          else
            echo "::error::setup.sh did not produce KernelSU/ or drivers/kernelsu/"
            exit 1
          fi

          echo "==> KSU_DIR contents:"
          ls -la "$KSU_DIR"

          KCFG_FILES=$(find "$KSU_DIR" -maxdepth 4 -name "Kconfig" 2>/dev/null)
          if [ -z "$KCFG_FILES" ]; then
            echo "::error::No Kconfig found in $KSU_DIR"
            exit 1
          fi
          echo "==> Kconfig files found:"
          echo "$KCFG_FILES"

          KCFG_COUNT=$(grep -RnE "^[[:space:]]*config[[:space:]]+KSU_SUSFS" "$KSU_DIR" 2>/dev/null | wc -l)
          echo "==> SUSFS Kconfig entries: $KCFG_COUNT"
          if [ "$KCFG_COUNT" -lt 5 ]; then
            echo "::error::Not enough SUSFS Kconfig entries"
            grep -RnE "^[[:space:]]*config[[:space:]]+" "$KSU_DIR" 2>/dev/null | head -50
            exit 1
          fi

          echo "KSU_DIR=$KSU_DIR" >> "$GITHUB_ENV"

      - name: Verify SukiSU module-side has SUSFS callers
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -euo pipefail
          KCFG=$(grep -RnE "^[[:space:]]*config[[:space:]]+KSU_SUSFS" "$KSU_DIR" 2>/dev/null | wc -l || echo 0)
          REF=$(grep -RnE "CONFIG_KSU_SUSFS|susfs_" "$KSU_DIR" --include="*.c" --include="*.h" 2>/dev/null | wc -l || echo 0)
          echo "Kconfig SUSFS options: $KCFG"
          echo "Module SUSFS references: $REF"
          if [ "$KCFG" -lt 5 ] || [ "$REF" -lt 50 ]; then
            echo "::error::SukiSU module-side SUSFS thieu"
            exit 1
          fi
          echo "OK - SukiSU module-side caller xac nhan."

      - name: Clone JackA1ltman NonGKI patches
        run: |
          set -euo pipefail
          rm -rf /tmp/jack
          git clone --depth=1 -b "$JACK_BRANCH" "$JACK_REPO" /tmp/jack
          echo "==> Patches available:"
          ls -la /tmp/jack/Patches/Patch/
          echo "==> Scripts available:"
          ls -la /tmp/jack/Patches/*.sh

      - name: Apply SUSFS patch for kernel 5.4
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -euo pipefail
          PATCH=/tmp/jack/Patches/Patch/susfs_patch_to_5.4.patch
          if [ ! -f "$PATCH" ]; then
            echo "::error::Missing $PATCH"
            exit 1
          fi
          echo "==> Patch info:"
          head -5 "$PATCH"
          echo "==> Lines in patch: $(wc -l < $PATCH)"

          echo "==> Dry-run apply..."
          if ! patch -p1 --dry-run -i "$PATCH" >/tmp/susfs_dryrun.log 2>&1; then
            echo "::warning::Dry-run reported some hunks"
            tail -30 /tmp/susfs_dryrun.log
          fi

          echo "==> Real apply (--forward)..."
          patch -p1 --forward -i "$PATCH" 2>&1 | tee /tmp/susfs_apply.log || true

          REJ=$(find . -name "*.rej" -type f 2>/dev/null || true)
          if [ -n "$REJ" ]; then
            echo "::warning::.rej files present:"
            echo "$REJ"
            for f in $REJ; do
              echo "--- $f ---"
              cat "$f"
            done
          fi

          FAIL=0
          for f in fs/susfs.c include/linux/susfs.h include/linux/susfs_def.h; do
            if [ -f "$f" ]; then
              echo "OK  $f ($(wc -l < "$f") lines)"
            else
              echo "::error::Missing $f after patch"
              FAIL=1
            fi
          done
          if [ "$FAIL" -ne 0 ]; then
            exit 1
          fi

      - name: Apply SUSFS inline hook patches (JackA1ltman script)
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -euo pipefail
          SCRIPT=/tmp/jack/Patches/susfs_inline_hook_patches.sh
          if [ ! -f "$SCRIPT" ]; then
            echo "::error::Missing $SCRIPT"
            exit 1
          fi
          chmod +x "$SCRIPT"
          echo "==> Running inline hook script..."
          bash "$SCRIPT" 2>&1 | tee /tmp/jack_inline_hooks.log

          OK_COUNT=$(grep -c "\[+\].*Patched" /tmp/jack_inline_hooks.log || echo 0)
          FAIL_COUNT=$(grep -c "\[-\].*patch failed" /tmp/jack_inline_hooks.log || echo 0)
          SKIP_COUNT=$(grep -c "\[-\] Warning:.*contains KernelSU" /tmp/jack_inline_hooks.log || echo 0)
          echo "==> Inline hooks: OK=$OK_COUNT, FAIL=$FAIL_COUNT, SKIP_already=$SKIP_COUNT"
          if [ "$FAIL_COUNT" -gt 0 ]; then
            echo "::error::$FAIL_COUNT inline hook patch failed"
            exit 1
          fi

      - name: Verify essential hooks present
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -euo pipefail
          FAIL=0
          for pair in \
            "fs/exec.c:ksu_handle_execveat" \
            "fs/open.c:ksu_handle_faccessat" \
            "fs/stat.c:ksu_handle_stat" \
            "kernel/reboot.c:ksu_handle_sys_reboot" \
            "fs/susfs.c:susfs_" \
            "include/linux/susfs.h:SUSFS_VERSION"; do
            f="${pair%%:*}"
            sym="${pair##*:}"
            if grep -q "$sym" "$f" 2>/dev/null; then
              echo "OK  $f has $sym"
            else
              echo "::error::$f missing $sym"
              FAIL=1
            fi
          done
          if [ "$FAIL" -ne 0 ]; then
            exit 1
          fi
          echo "ALL essential hooks verified."

      - name: Apply show_smap return-type compat fix
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -euo pipefail
          chmod +x .github/scripts/fix_show_smap_return.py
          python3 .github/scripts/fix_show_smap_return.py | tee /tmp/fix_smap.log
          if grep -qE "^\[ERROR\]|Traceback" /tmp/fix_smap.log; then
            echo "::error::show_smap fix reported errors"
            exit 1
          fi

      - name: Apply SukiSU 5.4 compat shims
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -euo pipefail
          chmod +x .github/scripts/fix_sukisu_5_4_compat.py
          python3 .github/scripts/fix_sukisu_5_4_compat.py | tee /tmp/fix_sukisu_compat.log
          if grep -qE "^\[ERROR\]|Traceback" /tmp/fix_sukisu_compat.log; then
            echo "::error::SukiSU 5.4 compat fix reported errors"
            exit 1
          fi

      - name: Apply struct mount forward decl in fs/stat.c
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -euo pipefail
          chmod +x .github/scripts/fix_stat_struct_mount.py
          python3 .github/scripts/fix_stat_struct_mount.py | tee /tmp/fix_stat_mount.log
          if grep -qE "^\[ERROR\]|Traceback" /tmp/fix_stat_mount.log; then
            echo "::error::stat.c struct mount fix reported errors"
            exit 1
          fi

      - name: Apply devpts hook (official KSU manual hook)
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -euo pipefail
          chmod +x .github/scripts/fix_devpts_hook.py
          python3 .github/scripts/fix_devpts_hook.py | tee /tmp/fix_devpts.log
          if grep -qE "^\[ERROR\]|Traceback" /tmp/fix_devpts.log; then
            echo "::error::devpts hook fix reported errors"
            exit 1
          fi

      - name: Fix selinux_hide (version-aware compat v3)
        working-directory: ${{ env.KERNEL_DIR }}
        env:
          SUKISU_REF: ${{ env.SUKISU_REF }}
        run: |
          set -euo pipefail
          chmod +x .github/scripts/fix_selinux_hide_build.py
          python3 .github/scripts/fix_selinux_hide_build.py | tee /tmp/fix_selinux_hide.log
          if grep -qE "^\[ERROR\]|Traceback" /tmp/fix_selinux_hide.log; then
            echo "::error::selinux_hide compat fix reported errors"
            exit 1
          fi

      - name: Verify all compat fixes applied
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -euo pipefail
          FAIL=0

          if ! grep -q "SUSFS_SHOW_SMAP_RETURN_FIX" fs/proc/task_mmu.c; then
            echo "::error::show_smap fix marker missing"
            FAIL=1
          else
            echo "OK  show_smap fix applied"
          fi

          STRNCPY=$(find "$KSU_DIR" -name "kernel_compat.h" -exec grep -l "SUSFS_5_4_STRNCPY_COMPAT" {} \; 2>/dev/null | head -1)
          if [ -z "$STRNCPY" ]; then
            echo "::error::strncpy compat shim missing in kernel_compat.h"
            FAIL=1
          else
            echo "OK  strncpy compat shim in $STRNCPY"
          fi

          KSUD=$(find "$KSU_DIR" -name "ksud.c" -exec grep -l "SUSFS_5_4_SELINUX_HIDE_DECL" {} \; 2>/dev/null | head -1)
          if [ -z "$KSUD" ]; then
            echo "::error::selinux_hide extern decls missing"
            FAIL=1
          else
            echo "OK  selinux_hide decls in $KSUD"
          fi

          if ! grep -q "SUSFS_STRUCT_MOUNT_FWD_DECL" fs/stat.c; then
            echo "::error::struct mount fwd decl missing in fs/stat.c"
            FAIL=1
          else
            echo "OK  struct mount fwd decl in fs/stat.c"
          fi

          if ! grep -q "ksu_handle_devpts" fs/devpts/inode.c; then
            echo "::error::devpts hook missing in fs/devpts/inode.c"
            FAIL=1
          else
            echo "OK  devpts hook in fs/devpts/inode.c"
          fi

          KSUD_FILE=$(find "$KSU_DIR" -name "ksud.c" | head -1)
          if [ -z "$KSUD_FILE" ]; then
            echo "::error::ksud.c not found"
            FAIL=1
          else
            KVER=$(head -3 Makefile | grep -E "^(VERSION|PATCHLEVEL)" | awk '{print $3}' | paste -sd '.')
            MAJOR=$(echo "$KVER" | cut -d. -f1)
            MINOR=$(echo "$KVER" | cut -d. -f2)
            echo "Kernel version detected: $MAJOR.$MINOR"

            if [ "$MAJOR" -lt 6 ] || { [ "$MAJOR" -eq 6 ] && [ "$MINOR" -lt 6 ]; }; then
              if ! grep -q "SUSFS_5_4_SELINUX_HIDE_GUARD" "$KSUD_FILE"; then
                echo "::error::Expected guard markers in $KSUD_FILE for kernel < 6.6"
                FAIL=1
              else
                GUARD_COUNT=$(grep -c "SUSFS_5_4_SELINUX_HIDE_GUARD" "$KSUD_FILE")
                echo "OK  ksud.c has $GUARD_COUNT guard markers for selinux_hide calls"
              fi

              BAD=$(find "$KSU_DIR" \( -name "Kbuild" -o -name "Makefile" \) -exec grep -l "SUSFS_5_4_SELINUX_HIDE_BUILD" {} \; 2>/dev/null | head -1)
              if [ -n "$BAD" ]; then
                echo "::warning::Build wiring still present in $BAD (should be removed for kernel < 6.6)"
              else
                echo "OK  No selinux_hide.o build wiring (correct for kernel < 6.6)"
              fi
            else
              KBUILD_FIX=$(find "$KSU_DIR" \( -name "Kbuild" -o -name "Makefile" \) -exec grep -l "SUSFS_5_4_SELINUX_HIDE_BUILD" {} \; 2>/dev/null | head -1)
              if [ -z "$KBUILD_FIX" ]; then
                echo "::error::Expected build wiring for kernel >= 6.6"
                FAIL=1
              else
                echo "OK  selinux_hide.o wired in $KBUILD_FIX"
              fi
            fi
          fi

          BAD_INCL=$(find "$KSU_DIR" -name "kernel_includes.h" -exec grep -l "SUSFS_5_4_STRNCPY_COMPAT" {} \; 2>/dev/null | head -1)
          if [ -n "$BAD_INCL" ]; then
            echo "::warning::misplaced strncpy shim still in $BAD_INCL"
          fi

          if [ "$FAIL" -ne 0 ]; then
            exit 1
          fi
          echo "ALL compat fixes verified."

      - name: Enable SUSFS configs in defconfig
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -euo pipefail
          DC=""
          for cand in "arch/arm64/configs/$DEFCONFIG" "arch/arm64/configs/vendor/$DEFCONFIG"; do
            if [ -f "$cand" ]; then
              DC="$cand"
              break
            fi
          done
          if [ -z "$DC" ]; then
            echo "::error::Khong tim thay defconfig: $DEFCONFIG"
            exit 1
          fi
          echo "Defconfig: $DC"

          AVAILABLE_CFGS=$(grep -RhE "^[[:space:]]*config[[:space:]]+KSU" "$KSU_DIR" 2>/dev/null | awk '{print $2}' | sort -u)
          echo "==> Available KSU* Kconfig symbols:"
          echo "$AVAILABLE_CFGS"
          TOTAL=$(echo "$AVAILABLE_CFGS" | grep -c . || echo 0)
          echo "==> Total: $TOTAL"

          WANTED=(
            CONFIG_KSU
            CONFIG_KSU_MANUAL_HOOK
            CONFIG_KSU_SUSFS
            CONFIG_KSU_SUSFS_SUS_PATH
            CONFIG_KSU_SUSFS_SUS_MOUNT
            CONFIG_KSU_SUSFS_SUS_KSTAT
            CONFIG_KSU_SUSFS_SUS_MAP
            CONFIG_KSU_SUSFS_TRY_UMOUNT
            CONFIG_KSU_SUSFS_SPOOF_UNAME
            CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
            CONFIG_KSU_SUSFS_OPEN_REDIRECT
            CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
            CONFIG_KSU_SUSFS_ENABLE_LOG
          )
          ADDED=0
          SKIP=0
          for cfg in "${WANTED[@]}"; do
            sym="${cfg#CONFIG_}"
            if echo "$AVAILABLE_CFGS" | grep -qx "$sym"; then
              sed -i -E "/^# ?${cfg}( is not set)?$/d;/^${cfg}=.*/d" "$DC"
              echo "${cfg}=y" >> "$DC"
              echo "OK    $cfg=y"
              ADDED=$((ADDED+1))
            else
              echo "Skip  $cfg (not in Kconfig)"
              SKIP=$((SKIP+1))
            fi
          done
          echo "Added=$ADDED Skipped=$SKIP"
          if [ "$ADDED" -lt 5 ]; then
            echo "::error::Qua it config enable"
            exit 1
          fi
          tail -n 40 "$DC"

      - name: Cache AOSP Clang toolchain
        uses: actions/cache@v4
        with:
          path: ~/tc/clang-r450784d
          key: aosp-clang-r450784d-android13-v1

      - name: Setup AOSP Clang r450784d
        run: |
          set -euo pipefail
          TC_DIR="$HOME/tc/clang-r450784d"
          if [ -x "$TC_DIR/bin/clang" ] && [ -x "$TC_DIR/bin/ld.lld" ]; then
            echo "==> Toolchain present (cache hit)"
            "$TC_DIR/bin/clang" --version
            exit 0
          fi
          mkdir -p "$HOME/tc"
          cd /tmp
          rm -rf aosp-clang
          BRANCH="android13-release"
          REPO="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86"
          TARBALL_URL="${REPO}/+archive/refs/heads/${BRANCH}/clang-r450784d.tar.gz"
          echo "==> Tarball download..."
          if curl -fSL --retry 3 --retry-delay 5 -o clang.tar.gz "$TARBALL_URL"; then
            echo "==> Downloaded $(du -h clang.tar.gz | cut -f1)"
            mkdir -p "$TC_DIR"
            tar -xzf clang.tar.gz -C "$TC_DIR"
            rm -f clang.tar.gz
          else
            git clone --branch "$BRANCH" --depth=1 --filter=blob:none --sparse "$REPO" aosp-clang
            cd aosp-clang
            git sparse-checkout set clang-r450784d
            git checkout
            mkdir -p "$TC_DIR"
            cp -a clang-r450784d/. "$TC_DIR/"
            cd /tmp && rm -rf aosp-clang
          fi
          if [ ! -x "$TC_DIR/bin/clang" ] || [ ! -x "$TC_DIR/bin/ld.lld" ]; then
            FOUND=$(find "$TC_DIR" -maxdepth 4 -name clang -type f -executable 2>/dev/null | head -n 1 || true)
            if [ -n "$FOUND" ]; then
              REAL_DIR=$(dirname "$(dirname "$FOUND")")
              tmpdir=$(mktemp -d)
              cp -a "$REAL_DIR"/. "$tmpdir/"
              rm -rf "$TC_DIR"
              mv "$tmpdir" "$TC_DIR"
            fi
          fi
          if [ ! -x "$TC_DIR/bin/clang" ] || [ ! -x "$TC_DIR/bin/ld.lld" ]; then
            echo "::error::Toolchain incomplete"
            exit 1
          fi
          "$TC_DIR/bin/clang" --version
          "$TC_DIR/bin/ld.lld" --version
          echo "==> Toolchain ready at $TC_DIR"

      - name: Build kernel via build.sh
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -euo pipefail
          if [ ! -f "./build.sh" ]; then
            echo "::error::Khong tim thay ./build.sh"
            ls -la
            exit 1
          fi
          chmod +x ./build.sh
          echo "==> Running ./build.sh ..."
          ./build.sh 2>&1 | tee /tmp/build.log

      - name: Upload all logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            /tmp/build.log
            /tmp/susfs_dryrun.log
            /tmp/susfs_apply.log
            /tmp/jack_inline_hooks.log
            /tmp/fix_smap.log
            /tmp/fix_sukisu_compat.log
            /tmp/fix_stat_mount.log
            /tmp/fix_devpts.log
            /tmp/fix_selinux_hide.log
          if-no-files-found: warn
          retention-days: 14

      - name: Collect .rej files (if any)
        if: always()
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/rejs
          find . -name "*.rej" -type f -exec cp --parents {} /tmp/rejs/ \; 2>/dev/null || true
          if [ -n "$(ls -A /tmp/rejs 2>/dev/null)" ]; then
            echo "==> .rej files collected"
          else
            echo "==> No .rej files"
          fi

      - name: Upload .rej files (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patch-rejects
          path: /tmp/rejs/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload kernel artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image
          path: |
            ${{ env.KERNEL_DIR }}/*.zip
            ${{ env.KERNEL_DIR }}/out/arch/arm64/boot/Image
            ${{ env.KERNEL_DIR }}/out/arch/arm64/boot/Image.gz
            ${{ env.KERNEL_DIR }}/out/arch/arm64/boot/dts/vendor/qcom/yupik.dtb
            ${{ env.KERNEL_DIR }}/out/arch/arm64/boot/dts/vendor/qcom/lisa-sm7325-overlay.dtbo
          if-no-files-found: warn
          retention-days: 14
