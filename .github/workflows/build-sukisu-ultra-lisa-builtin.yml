name: Build SukiSU-Ultra builtin (lisa)

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: "Kernel branch (lisa)"
        required: true
        default: "thirteen"
      defconfig:
        description: "Defconfig name"
        required: true
        default: "lisa_defconfig"
      sukisu_mode:
        description: "setup.sh mode"
        required: true
        default: "builtin"
        type: choice
        options:
          - builtin
      susfs_branch:
        description: "ShirkNeko/susfs4ksu branch"
        required: true
        default: "kernel-5.4"

permissions:
  contents: read

env:
  KERNEL_REPO:  tungnt017/kernel_xiaomi_lisa
  KERNEL_DIR:   kernel_xiaomi_lisa
  ARCH:         arm64
  SUBARCH:      arm64
  DEFCONFIG:    ${{ github.event.inputs.defconfig     || 'lisa_defconfig' }}
  SUKISU_MODE:  ${{ github.event.inputs.sukisu_mode   || 'builtin' }}
  KBRANCH:      ${{ github.event.inputs.kernel_branch || 'thirteen' }}
  SUSFS_BRANCH: ${{ github.event.inputs.susfs_branch  || 'kernel-5.4' }}

jobs:
  build:
    name: Build kernel
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout workflow repo scripts
        uses: actions/checkout@v4
        with:
          path: workflow-repo

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.KERNEL_REPO }}
          ref: ${{ env.KBRANCH }}
          path: ${{ env.KERNEL_DIR }}
          fetch-depth: 1

      - name: Copy scripts into kernel tree
        run: |
          set -euo pipefail
          mkdir -p "$KERNEL_DIR/.github/scripts"
          cp -v workflow-repo/.github/scripts/apply_resukisu_manual_hooks_1_fixed.py "$KERNEL_DIR/.github/scripts/"
          cp -v workflow-repo/.github/scripts/apply_susfs_backport_lisa.py "$KERNEL_DIR/.github/scripts/"

      - name: Install minimal build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bc bison build-essential ccache curl flex git libssl-dev libelf-dev zip unzip python3 python3-pip cpio rsync kmod patch python2

      - name: Integrate SukiSU-Ultra builtin
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -euo pipefail
          echo "==> setup.sh '$SUKISU_MODE'"
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s "$SUKISU_MODE"
          if [ -d "KernelSU" ]; then
            echo "KSU_DIR=KernelSU" >> "$GITHUB_ENV"
          elif [ -d "drivers/kernelsu" ]; then
            echo "KSU_DIR=drivers/kernelsu" >> "$GITHUB_ENV"
          else
            echo "::error::setup.sh did not produce KernelSU/ or drivers/kernelsu/"
            exit 1
          fi

      - name: Verify SukiSU module-side has SUSFS callers
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -euo pipefail
          KCFG=$(grep -RnE "^[[:space:]]*config[[:space:]]+KSU_SUSFS" "$KSU_DIR" | wc -l || echo 0)
          REF=$(grep -RnE "CONFIG_KSU_SUSFS|susfs_" "$KSU_DIR" --include="*.c" --include="*.h" 2>/dev/null | wc -l || echo 0)
          echo "Kconfig SUSFS options: $KCFG"
          echo "Module SUSFS references: $REF"
          if [ "$KCFG" -lt 5 ] || [ "$REF" -lt 50 ]; then
            echo "::error::SukiSU module-side SUSFS thieu (KCFG=$KCFG, REF=$REF)"
            exit 1
          fi
          echo "OK - SukiSU module-side caller xac nhan."

      - name: Clone ShirkNeko susfs4ksu
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -euo pipefail
          rm -rf /tmp/susfs4ksu
          git clone --depth=1 -b "$SUSFS_BRANCH" https://github.com/ShirkNeko/susfs4ksu.git /tmp/susfs4ksu
          ls -la /tmp/susfs4ksu/kernel_patches/fs 2>/dev/null || true
          ls -la /tmp/susfs4ksu/kernel_patches/include/linux 2>/dev/null || true

      - name: Copy SUSFS source files into kernel tree
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -euo pipefail
          SRC=/tmp/susfs4ksu/kernel_patches
          if [ ! -f "$SRC/fs/susfs.c" ]; then
            echo "::error::Missing $SRC/fs/susfs.c"
            exit 1
          fi
          if [ ! -f "$SRC/include/linux/susfs.h" ]; then
            echo "::error::Missing $SRC/include/linux/susfs.h"
            exit 1
          fi
          cp -v "$SRC/fs/susfs.c" fs/
          cp -v "$SRC/include/linux/susfs.h" include/linux/
          if [ -f "$SRC/include/linux/susfs_def.h" ]; then
            cp -v "$SRC/include/linux/susfs_def.h" include/linux/
          fi
          if ! grep -qE 'susfs\.o' fs/Makefile; then
            echo 'obj-$(CONFIG_KSU_SUSFS) += susfs.o' >> fs/Makefile
            echo "==> Added susfs.o to fs/Makefile"
          fi

      - name: Apply SUSFS anchor-based backport (lisa)
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -euo pipefail
          chmod +x .github/scripts/apply_susfs_backport_lisa.py
          python3 .github/scripts/apply_susfs_backport_lisa.py | tee /tmp/susfs_backport.log
          if grep -qE "\[ERROR\]|Traceback" /tmp/susfs_backport.log; then
            echo "::error::SUSFS anchor backport failed"
            exit 1
          fi

      - name: Verify SUSFS backport hooks present
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -euo pipefail
          FAIL=0
          if ! grep -q "linux/susfs_def.h" fs/namei.c; then
            echo "::error::fs/namei.c missing susfs_def.h include"
            FAIL=1
          fi
          if ! grep -q "susfs_is_current_ksu_domain" fs/namespace.c; then
            echo "::error::fs/namespace.c missing susfs extern"
            FAIL=1
          fi
          if ! grep -q "susfs_sus_ino_for_filldir64" fs/readdir.c; then
            echo "::error::fs/readdir.c missing filldir hook"
            FAIL=1
          fi
          MARKS=0
          if grep -qE "SUSFS_FILLDIR(64)?_HOOK_MARK" fs/readdir.c; then
            MARKS=$(grep -cE "SUSFS_FILLDIR(64)?_HOOK_MARK" fs/readdir.c)
          fi
          echo "Filldir hook markers in readdir.c: $MARKS"
          if [ "$MARKS" -lt 2 ]; then
            echo "::error::Quá ít filldir hooks ($MARKS < 2)"
            FAIL=1
          fi
          if [ "$FAIL" -ne 0 ]; then
            exit 1
          fi
          echo "ALL SUSFS backport hooks verified."

      - name: Enable SUSFS configs in defconfig
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -euo pipefail
          DC=""
          for cand in "arch/arm64/configs/$DEFCONFIG" "arch/arm64/configs/vendor/$DEFCONFIG"; do
            if [ -f "$cand" ]; then
              DC="$cand"
              break
            fi
          done
          if [ -z "$DC" ]; then
            echo "::error::Khong tim thay defconfig: $DEFCONFIG"
            exit 1
          fi
          echo "Defconfig: $DC"

          WANTED=(
            CONFIG_KSU
            CONFIG_KSU_SUSFS
            CONFIG_KSU_SUSFS_SUS_PATH
            CONFIG_KSU_SUSFS_SUS_MOUNT
            CONFIG_KSU_SUSFS_SUS_KSTAT
            CONFIG_KSU_SUSFS_SUS_MAP
            CONFIG_KSU_SUSFS_SPOOF_UNAME
            CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
            CONFIG_KSU_SUSFS_OPEN_REDIRECT
            CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
            CONFIG_KSU_SUSFS_ENABLE_LOG
            CONFIG_KSU_MANUAL_HOOK
          )
          ADDED=0
          SKIP=0
          for cfg in "${WANTED[@]}"; do
            sym="${cfg#CONFIG_}"
            if grep -RqE "^[[:space:]]*config[[:space:]]+${sym}\b" "$KSU_DIR"; then
              sed -i -E "/^# ?${cfg}( is not set)?$/d;/^${cfg}=.*/d" "$DC"
              echo "${cfg}=y" >> "$DC"
              ADDED=$((ADDED+1))
            else
              echo "::notice::Skip $cfg"
              SKIP=$((SKIP+1))
            fi
          done
          echo "Added=$ADDED Skipped=$SKIP"
          if [ "$ADDED" -lt 5 ]; then
            echo "::error::Qua it config enable ($ADDED < 5)"
            exit 1
          fi
          tail -n 40 "$DC"

      - name: Apply manual hooks
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -euo pipefail
          chmod +x .github/scripts/apply_resukisu_manual_hooks_1_fixed.py
          python3 .github/scripts/apply_resukisu_manual_hooks_1_fixed.py "$DEFCONFIG" | tee /tmp/apply_hooks.log
          if grep -qE "\[ERROR\]|RuntimeError|Traceback" /tmp/apply_hooks.log; then
            echo "::error::apply_resukisu_manual_hooks_1_fixed.py reported errors"
            exit 1
          fi

      - name: Verify manual hooks were applied
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -euo pipefail
          FAIL=0
          for pair in "fs/exec.c:ksu_handle_execveat" "fs/open.c:ksu_handle_faccessat" "fs/stat.c:ksu_handle_stat" "kernel/reboot.c:ksu_handle_sys_reboot"; do
            f="${pair%%:*}"
            sym="${pair##*:}"
            if grep -q "$sym" "$f"; then
              echo "OK  $f  has $sym"
            else
              echo "::error::$f thieu $sym"
              FAIL=1
            fi
          done
          MH=$(grep -RnE "CONFIG_KSU_MANUAL_HOOK" fs/exec.c fs/open.c fs/stat.c kernel/reboot.c 2>/dev/null | wc -l || echo 0)
          echo "CONFIG_KSU_MANUAL_HOOK markers: $MH"
          if [ "$MH" -lt 4 ]; then
            echo "::error::Quá ít CONFIG_KSU_MANUAL_HOOK markers ($MH < 4)"
            FAIL=1
          fi
          if [ "$FAIL" -ne 0 ]; then
            exit 1
          fi
          echo "ALL manual hooks verified."

      - name: Upload manual hook backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manual-hook-backup
          path: ${{ env.KERNEL_DIR }}/.resukisu_backup
          if-no-files-found: warn
          retention-days: 7

      - name: Upload susfs backport backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: susfs-backport-backup
          path: |
            ${{ env.KERNEL_DIR }}/fs/namei.c.bak_susfs
            ${{ env.KERNEL_DIR }}/fs/namespace.c.bak_susfs
            ${{ env.KERNEL_DIR }}/fs/readdir.c.bak_susfs
          if-no-files-found: warn
          retention-days: 7

      - name: Setup AOSP Clang r450784d
        run: |
          set -euo pipefail
          TC_DIR="$HOME/tc/clang-r450784d"
          if [ -x "$TC_DIR/bin/clang" ] && [ -x "$TC_DIR/bin/ld.lld" ]; then
            echo "==> Toolchain already present"
            "$TC_DIR/bin/clang" --version
            "$TC_DIR/bin/ld.lld" --version
            exit 0
          fi

          mkdir -p "$HOME/tc"
          cd /tmp
          rm -rf aosp-clang

          BRANCH="android13-release"
          REPO="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86"

          # Method 1: gitiles tarball (fast)
          echo "==> Trying gitiles tarball for clang-r450784d on $BRANCH ..."
          TARBALL_URL="${REPO}/+archive/refs/heads/${BRANCH}/clang-r450784d.tar.gz"
          if curl -fSL --retry 3 --retry-delay 5 -o clang.tar.gz "$TARBALL_URL"; then
            echo "==> Downloaded $(du -h clang.tar.gz | cut -f1)"
            mkdir -p "$TC_DIR"
            tar -xzf clang.tar.gz -C "$TC_DIR"
            rm -f clang.tar.gz
          else
            echo "==> Gitiles tarball failed, falling back to sparse clone on $BRANCH ..."
            git clone --branch "$BRANCH" --depth=1 --filter=blob:none --sparse "$REPO" aosp-clang
            cd aosp-clang
            git sparse-checkout set clang-r450784d
            git checkout
            if [ ! -d clang-r450784d ]; then
              echo "::error::clang-r450784d not found on branch $BRANCH"
              echo "Top-level entries:"
              ls -la
              exit 1
            fi
            mkdir -p "$TC_DIR"
            cp -a clang-r450784d/. "$TC_DIR/"
            cd /tmp && rm -rf aosp-clang
          fi

          if [ ! -x "$TC_DIR/bin/clang" ] || [ ! -x "$TC_DIR/bin/ld.lld" ]; then
            FOUND=$(find "$TC_DIR" -maxdepth 4 -name clang -type f -executable 2>/dev/null | head -n 1 || true)
            if [ -n "$FOUND" ]; then
              REAL_DIR=$(dirname "$(dirname "$FOUND")")
              echo "==> Found clang at $FOUND, restructuring to $TC_DIR ..."
              tmpdir=$(mktemp -d)
              cp -a "$REAL_DIR"/. "$tmpdir/"
              rm -rf "$TC_DIR"
              mv "$tmpdir" "$TC_DIR"
            fi
          fi

          if [ ! -x "$TC_DIR/bin/clang" ]; then
            echo "::error::clang missing after setup"
            find "$TC_DIR" -maxdepth 3 -type d | head -n 30
            exit 1
          fi
          if [ ! -x "$TC_DIR/bin/ld.lld" ]; then
            echo "::error::ld.lld missing after setup"
            ls -la "$TC_DIR/bin" | head -n 50
            exit 1
          fi

          "$TC_DIR/bin/clang" --version
          "$TC_DIR/bin/ld.lld" --version
          echo "==> Toolchain ready at $TC_DIR"


      - name: Build kernel via build.sh
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -euo pipefail
          if [ ! -f "./build.sh" ]; then
            echo "::error::Khong tim thay ./build.sh"
            ls -la
            exit 1
          fi
          chmod +x ./build.sh
          echo "==> Running ./build.sh ..."
          ./build.sh 2>&1 | tee /tmp/build.log

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            /tmp/build.log
            /tmp/apply_hooks.log
            /tmp/susfs_backport.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload kernel artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image
          path: |
            ${{ env.KERNEL_DIR }}/*.zip
            ${{ env.KERNEL_DIR }}/out/arch/arm64/boot/Image
            ${{ env.KERNEL_DIR }}/out/arch/arm64/boot/Image.gz
            ${{ env.KERNEL_DIR }}/out/arch/arm64/boot/dts/vendor/qcom/yupik.dtb
            ${{ env.KERNEL_DIR }}/out/arch/arm64/boot/dts/vendor/qcom/lisa-sm7325-overlay.dtbo
          if-no-files-found: warn
          retention-days: 14
