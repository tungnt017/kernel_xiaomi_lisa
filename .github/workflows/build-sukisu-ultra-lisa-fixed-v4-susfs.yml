name: Build Lisa SukiSU-Ultra Fixed V4 SUSFS

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: "Kernel defconfig"
        required: true
        default: "lisa_defconfig"
      sukisu_mode:
        description: "SukiSU-Ultra setup mode. Use builtin for non-GKI/built-in kernels like lisa."
        required: true
        type: choice
        default: "builtin"
        options:
          - builtin
          - main
      sukisu_ref:
        description: "Optional SukiSU-Ultra commit/tag/branch after setup. Empty = keep setup branch"
        required: false
        default: ""
      apply_susfs_kernel:
        description: "Clone susfs4ksu and apply kernel-side SUSFS implementation only"
        required: false
        type: boolean
        default: true
      susfs_repo:
        description: "SUSFS source repository"
        required: true
        default: "https://gitlab.com/simonpunk/susfs4ksu.git"
      susfs_branch:
        description: "SUSFS branch for kernel 5.4"
        required: true
        default: "kernel-5.4"
      susfs_ref:
        description: "Optional SUSFS commit/tag/relative ref after clone. Empty = branch HEAD"
        required: false
        default: ""
      stop_after_susfs:
        description: "Fast test mode: stop after SukiSU + SUSFS kernel-side apply"
        required: false
        type: boolean
        default: false
      stop_after_setup:
        description: "Fast test mode: stop after SukiSU setup/layout/logs"
        required: false
        type: boolean
        default: false
      run_manual_hooks:
        description: "Run existing manual hook script if present"
        required: false
        type: boolean
        default: true
      jobs:
        description: "Parallel build jobs. Leave as $(nproc) for auto."
        required: true
        default: "$(nproc)"
      upload_full_out:
        description: "Upload out/ directory on failure for debugging"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  ARCH: arm64
  SUBARCH: arm64
  OUT_DIR: out
  DEFCONFIG: ${{ github.event.inputs.defconfig }}
  SUKISU_MODE: ${{ github.event.inputs.sukisu_mode }}
  SUKISU_REF: ${{ github.event.inputs.sukisu_ref }}
  APPLY_SUSFS_KERNEL: ${{ github.event.inputs.apply_susfs_kernel }}
  SUSFS_REPO: ${{ github.event.inputs.susfs_repo }}
  SUSFS_BRANCH: ${{ github.event.inputs.susfs_branch }}
  SUSFS_REF: ${{ github.event.inputs.susfs_ref }}
  CROSS_COMPILE: aarch64-linux-gnu-
  CLANG_TRIPLE: aarch64-linux-gnu-

jobs:
  build:
    name: Lisa SukiSU-Ultra ${{ github.event.inputs.sukisu_mode }} SUSFS-kernel
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Prepare build dependencies
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex git git-lfs gnupg \
            libelf-dev libssl-dev lld llvm make openssl python3 python3-pip \
            rsync unzip wget zip zstd \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
          mkdir -p logs artifacts

      - name: Capture initial environment
        run: |
          set -e
          {
            echo "DATE_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "RUNNER_OS=${RUNNER_OS}"
            echo "ARCH=${ARCH}"
            echo "SUBARCH=${SUBARCH}"
            echo "OUT_DIR=${OUT_DIR}"
            echo "DEFCONFIG=${DEFCONFIG}"
            echo "SUKISU_MODE=${SUKISU_MODE}"
            echo "SUKISU_REF=${SUKISU_REF}"
            echo "APPLY_SUSFS_KERNEL=${APPLY_SUSFS_KERNEL}"
            echo "SUSFS_REPO=${SUSFS_REPO}"
            echo "SUSFS_BRANCH=${SUSFS_BRANCH}"
            echo "SUSFS_REF=${SUSFS_REF}"
            echo "CROSS_COMPILE=${CROSS_COMPILE}"
            echo "CLANG_TRIPLE=${CLANG_TRIPLE}"
            echo "STOP_AFTER_SETUP=${{ github.event.inputs.stop_after_setup }}"
            echo "STOP_AFTER_SUSFS=${{ github.event.inputs.stop_after_susfs }}"
            echo "RUN_MANUAL_HOOKS=${{ github.event.inputs.run_manual_hooks }}"
            git rev-parse HEAD || true
            git log -1 --oneline || true
            clang --version || true
            aarch64-linux-gnu-gcc --version | head -1 || true
          } | tee logs/build-env.log

      - name: Add SukiSU-Ultra source
        run: |
          set -e
          set -o pipefail
          mkdir -p logs

          if [ "${SUKISU_MODE}" = "builtin" ]; then
            SETUP_ARG="builtin"
          elif [ "${SUKISU_MODE}" = "main" ]; then
            SETUP_ARG="main"
          else
            echo "ERROR: unsupported SUKISU_MODE=${SUKISU_MODE}. This workflow supports only builtin/main." | tee logs/sukisu-setup.log
            exit 1
          fi

          echo "Running SukiSU-Ultra setup with arg: ${SETUP_ARG}" | tee logs/sukisu-setup.log
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" \
            | bash -s "${SETUP_ARG}" 2>&1 | tee -a logs/sukisu-setup.log

          if grep -qE "pathspec .* did not match|Checkout default branch" logs/sukisu-setup.log; then
            echo "ERROR: SukiSU setup reported checkout fallback/pathspec failure. Refusing to continue." | tee -a logs/sukisu-setup.log
            exit 1
          fi

          KSU_DIR=""
          if [ -d KernelSU/.git ] || [ -d KernelSU ]; then
            KSU_DIR="KernelSU"
          elif [ -d drivers/kernelsu/.git ] || [ -d drivers/kernelsu ]; then
            KSU_DIR="drivers/kernelsu"
          else
            echo "ERROR: SukiSU/KernelSU directory not found" | tee logs/sukisu-commit.log
            find . -maxdepth 4 -type d \( -name "KernelSU" -o -name "kernelsu" \) | tee -a logs/sukisu-commit.log || true
            exit 1
          fi

          echo "SukiSU directory: ${KSU_DIR}" | tee logs/sukisu-commit.log
          echo "KSU_DIR=${KSU_DIR}" >> "$GITHUB_ENV"

          if [ -d "${KSU_DIR}/.git" ]; then
            git -C "${KSU_DIR}" fetch --unshallow 2>/dev/null || true
            git -C "${KSU_DIR}" fetch --all --tags --force || true
            if [ -n "${SUKISU_REF}" ]; then
              echo "Checking out SukiSU ref: ${SUKISU_REF}" | tee -a logs/sukisu-commit.log
              git -C "${KSU_DIR}" checkout "${SUKISU_REF}"
            fi
            git -C "${KSU_DIR}" rev-parse HEAD | tee -a logs/sukisu-commit.log || true
            git -C "${KSU_DIR}" log -1 --oneline | tee -a logs/sukisu-commit.log || true
            git -C "${KSU_DIR}" status --short | tee -a logs/sukisu-commit.log || true
          else
            echo "WARN: ${KSU_DIR} is not a git repository after setup" | tee -a logs/sukisu-commit.log
          fi

      - name: Clone SUSFS source
        if: github.event.inputs.apply_susfs_kernel == 'true'
        run: |
          set -e
          set -o pipefail
          rm -rf susfs-src
          git clone --depth 1 --branch "${SUSFS_BRANCH}" "${SUSFS_REPO}" susfs-src 2>&1 | tee logs/susfs-clone.log
          if [ -n "${SUSFS_REF}" ]; then
            git -C susfs-src fetch --unshallow 2>/dev/null || true
            git -C susfs-src fetch --all --tags --force || true
            echo "Checking out SUSFS ref: ${SUSFS_REF}" | tee logs/susfs-commit.log
            git -C susfs-src checkout "${SUSFS_REF}"
          else
            : > logs/susfs-commit.log
          fi
          echo "SUSFS git info:" | tee -a logs/susfs-commit.log
          git -C susfs-src rev-parse HEAD | tee -a logs/susfs-commit.log
          git -C susfs-src log -1 --oneline | tee -a logs/susfs-commit.log
          echo "SUSFS kernel_patches tree:" | tee logs/susfs-tree.log
          find susfs-src/kernel_patches -maxdepth 3 -type f | sort | tee -a logs/susfs-tree.log

      - name: Apply SUSFS kernel-side implementation only
        if: github.event.inputs.apply_susfs_kernel == 'true'
        run: |
          set -e
          set -o pipefail
          python3 - <<'PY' 2>&1 | tee logs/apply-susfs-kernel-only.log
          from pathlib import Path
          import shutil, subprocess, sys, re

          ROOT = Path.cwd()
          SUS = ROOT / 'susfs-src' / 'kernel_patches'
          DEFCONFIG = ROOT / 'arch' / 'arm64' / 'configs' / '${{ github.event.inputs.defconfig }}'

          def log(msg): print(msg, flush=True)
          def run(cmd, check=False):
              log(f'[RUN] {cmd}')
              return subprocess.run(cmd, shell=True, cwd=ROOT).returncode

          if not SUS.exists():
              raise SystemExit(f'[ERROR] missing {SUS}')

          # 1) Copy SUSFS implementation files.
          copy_pairs = []
          for sub in ['fs', 'include/linux']:
              src_dir = SUS / sub
              dst_dir = ROOT / sub
              if not src_dir.exists():
                  log(f'[WARN] missing {src_dir}')
                  continue
              for src in src_dir.iterdir():
                  if src.is_file():
                      dst_dir.mkdir(parents=True, exist_ok=True)
                      dst = dst_dir / src.name
                      shutil.copy2(src, dst)
                      copy_pairs.append((src, dst))
                      log(f'[OK] copied {src} -> {dst}')

          # 2) Ensure Kconfig symbols needed by SukiSU/SUSFS remain enabled.
          def set_config(path: Path, key: str, val='y'):
              if not path.exists():
                  log(f'[WARN] defconfig missing: {path}')
                  return
              text = path.read_text(errors='ignore')
              lines = text.splitlines()
              out = []
              seen = False
              for line in lines:
                  if line.startswith(key + '=') or line.startswith('# ' + key + ' is not set'):
                      if not seen:
                          out.append(f'{key}={val}')
                          seen = True
                      continue
                  out.append(line)
              if not seen:
                  out.append(f'{key}={val}')
              path.write_text('\n'.join(out) + '\n')

          for key in [
              'CONFIG_KSU', 'CONFIG_KSU_MANUAL_HOOK',
              'CONFIG_KSU_SUSFS', 'CONFIG_KSU_SUSFS_SUS_PATH', 'CONFIG_KSU_SUSFS_SUS_MOUNT',
              'CONFIG_KSU_SUSFS_SUS_KSTAT', 'CONFIG_KSU_SUSFS_SPOOF_UNAME',
              'CONFIG_KSU_SUSFS_ENABLE_LOG', 'CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS',
              'CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG', 'CONFIG_KSU_SUSFS_OPEN_REDIRECT',
              'CONFIG_KSU_SUSFS_SUS_MAP'
          ]:
              set_config(DEFCONFIG, key, 'y')
          log(f'[OK] ensured KSU/SUSFS config symbols in {DEFCONFIG}')

          # 3) Apply kernel 5.4 patch. Do not apply KernelSU/10_enable_susfs_for_ksu.patch;
          # SukiSU builtin already owns the KernelSU side. We only need kernel-side SUSFS.
          patches = sorted(SUS.glob('50_add_susfs_in_kernel-5.4*.patch'))
          if not patches:
              patches = sorted(SUS.glob('*susfs*kernel*5.4*.patch'))
          if not patches:
              raise SystemExit('[ERROR] cannot find SUSFS kernel 5.4 patch under susfs-src/kernel_patches')
          patch = patches[0]
          log(f'[OK] selected kernel patch: {patch}')

          rc = run(f"patch -p1 --forward --batch < '{patch.resolve()}'", check=False)
          if rc == 0:
              log('[OK] SUSFS kernel patch applied cleanly')
          else:
              log('[WARN] SUSFS kernel patch returned non-zero; checking rejects and continuing with known lisa handling')

          # 4) Known lisa 5.4 handling: SUS_SU fs/open.c rejects are safe if SUS_SU is disabled.
          # Keep rejects in artifacts for debugging, but do not fail just because fs/open.c.rej exists.
          rejs = sorted(ROOT.rglob('*.rej'))
          for r in rejs:
              log(f'[REJ] {r.relative_to(ROOT)}')

          # 5) Verify critical kernel-side files exist.
          critical = [
              ROOT / 'fs' / 'susfs.c',
              ROOT / 'include' / 'linux' / 'susfs.h',
          ]
          missing = [str(p.relative_to(ROOT)) for p in critical if not p.exists()]
          if missing:
              raise SystemExit('[ERROR] missing critical SUSFS files after copy/apply: ' + ', '.join(missing))
          log('[OK] critical SUSFS files exist')

          # 6) Emit a compact status summary.
          for p in [ROOT/'fs'/'Makefile', ROOT/'fs'/'Kconfig', ROOT/'include'/'linux'/'susfs.h', ROOT/'fs'/'susfs.c']:
              log(f'[CHECK] {p.relative_to(ROOT)} exists={p.exists()}')
          PY

      - name: Fix SUSFS lisa 5.4 rejects
        if: github.event.inputs.apply_susfs_kernel == 'true'
        run: |
          set -e
          set -o pipefail
          python3 .github/scripts/fix_susfs_lisa_5_4_rejects.py 2>&1 | tee logs/fix-susfs-rejects.log

      - name: Export SUSFS debug source files
        if: always()
        run: |
          mkdir -p logs/susfs-debug

          cp drivers/kernelsu/supercall/dispatch.c logs/susfs-debug/dispatch.c.txt || true
          cp include/linux/susfs.h logs/susfs-debug/susfs.h.txt || true
          cp include/linux/susfs_def.h logs/susfs-debug/susfs_def.h.txt || true
          cp fs/proc/fd.c logs/susfs-debug/fd.c.txt || true
          cp fs/proc/fd.c.rej logs/susfs-debug/fd.c.rej.txt || true

          echo "===== exported files =====" | tee logs/susfs-debug/exported-files.log
          ls -la logs/susfs-debug | tee -a logs/susfs-debug/exported-files.log

      - name: Dump SukiSU and SUSFS layout
        run: |
          set +e
          {
            echo "===== SukiSU/KernelSU file layout ====="
            if [ -n "${KSU_DIR}" ] && [ -d "${KSU_DIR}" ]; then
              find "${KSU_DIR}" -maxdepth 4 -type f | sort | grep -E 'allowlist|apk_sign|arch.h|core_hook|kernel_compat|ksu.c|ksud|manager|selinux|sepolicy|sucompat|throne|Kconfig|Makefile|susfs|kpm' || true
            else
              echo "KSU_DIR missing"
            fi
            echo
            echo "===== Kernel-side SUSFS files ====="
            find fs include/linux -maxdepth 2 -type f | sort | grep -E 'susfs|sus_su' || true
            echo
            echo "===== Kernel source KSU/SukiSU/SUSFS config refs ====="
            grep -R "CONFIG_KSU\|CONFIG_KPM\|CONFIG_KSU_SUSFS\|SukiSU\|KernelSU" -n arch/arm64/configs/${DEFCONFIG} .config 2>/dev/null || true
          } | tee logs/sukisu-layout.log

      - name: Stop after SukiSU/SUSFS fast test
        if: github.event.inputs.stop_after_setup == 'true' || github.event.inputs.stop_after_susfs == 'true'
        run: |
          echo "Fast test mode enabled. Skipping manual hooks/configure/build."
          echo "stop_after_setup=${{ github.event.inputs.stop_after_setup }}"
          echo "stop_after_susfs=${{ github.event.inputs.stop_after_susfs }}"

      - name: Apply existing manual hooks if requested
        if: github.event.inputs.run_manual_hooks == 'true' && github.event.inputs.stop_after_setup != 'true' && github.event.inputs.stop_after_susfs != 'true'
        run: |
          set -e
          set -o pipefail
          if [ -f .github/scripts/apply_sukisu_manual_hooks.py ]; then
            python3 .github/scripts/apply_sukisu_manual_hooks.py 2>&1 | tee logs/apply-sukisu-manual-hooks.log
          elif [ -f .github/scripts/apply_resukisu_manual_hooks.py ]; then
            echo "Using existing apply_resukisu_manual_hooks.py as generic KSU manual hook script"
            python3 .github/scripts/apply_resukisu_manual_hooks.py 2>&1 | tee logs/apply-sukisu-manual-hooks.log
          else
            echo "skip: no manual hook script found" | tee logs/apply-sukisu-manual-hooks.log
          fi

      - name: Configure kernel
        if: github.event.inputs.stop_after_setup != 'true' && github.event.inputs.stop_after_susfs != 'true'
        run: |
          set -e
          set -o pipefail
          make O="${OUT_DIR}" ARCH="${ARCH}" \
            CROSS_COMPILE="${CROSS_COMPILE}" \
            CLANG_TRIPLE="${CLANG_TRIPLE}" \
            "${DEFCONFIG}" 2>&1 | tee logs/configure.log
          make O="${OUT_DIR}" ARCH="${ARCH}" \
            CROSS_COMPILE="${CROSS_COMPILE}" \
            CLANG_TRIPLE="${CLANG_TRIPLE}" \
            olddefconfig 2>&1 | tee -a logs/configure.log
          {
            echo "===== Effective KSU/SukiSU/KPM/SUSFS config ====="
            grep -E 'CONFIG_KSU|CONFIG_KPM|CONFIG_KSU_SUSFS|CONFIG_KPROBES|CONFIG_KSU_MANUAL_HOOK|CONFIG_KSU_TRACEPOINT_HOOK' "${OUT_DIR}/.config" || true
          } | tee logs/kernel-config-ksu.log

      - name: Build kernel
        if: github.event.inputs.stop_after_setup != 'true' && github.event.inputs.stop_after_susfs != 'true'
        run: |
          set -e
          set -o pipefail
          mkdir -p logs
          : > logs/build.log
          JOBS_INPUT='${{ github.event.inputs.jobs }}'
          if [ "${JOBS_INPUT}" = '$(nproc)' ] || [ -z "${JOBS_INPUT}" ]; then
            JOBS="$(nproc)"
          else
            JOBS="${JOBS_INPUT}"
          fi
          {
            echo "Starting compilation with -j${JOBS}..."
            echo "ARCH=${ARCH}"
            echo "CROSS_COMPILE=${CROSS_COMPILE}"
            echo "CLANG_TRIPLE=${CLANG_TRIPLE}"
            echo "LLVM=1 LLVM_IAS=1"
          } | tee -a logs/build.log
          make -j"${JOBS}" O="${OUT_DIR}" ARCH="${ARCH}" \
            LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE="${CROSS_COMPILE}" \
            CLANG_TRIPLE="${CLANG_TRIPLE}" \
            2>&1 | tee -a logs/build.log

      - name: Extract build error tail
        if: always()
        run: |
          mkdir -p logs
          echo "===== build.log tail 300 =====" > logs/build-tail.log
          tail -300 logs/build.log >> logs/build-tail.log 2>/dev/null || true
          echo "===== errors/warnings grep =====" > logs/build-errors.log
          grep -nEi "error:|undefined reference|No rule to make target|fatal error|ld.lld|make\\[[0-9]+\\]: \\*\\*\\*" logs/build.log \
            >> logs/build-errors.log 2>/dev/null || true

      - name: Collect outputs
        if: always()
        run: |
          set +e
          mkdir -p artifacts logs
          {
            echo "===== OUTPUT FILES ====="
            find "${OUT_DIR}" -type f \( \
              -name 'Image' -o -name 'Image.gz' -o -name 'Image.gz-dtb' -o \
              -name '*.dtb' -o -name '*.dtbo' -o -name '*.ko' -o -name 'vmlinux' \
            \) -print | sort
            echo
            echo "===== SUKISU COMMIT ====="
            cat logs/sukisu-commit.log 2>/dev/null || true
            echo
            echo "===== SUSFS COMMIT ====="
            cat logs/susfs-commit.log 2>/dev/null || true
            echo
            echo "===== EFFECTIVE KSU CONFIG ====="
            cat logs/kernel-config-ksu.log 2>/dev/null || true
          } | tee logs/output-files.log
          cp "${OUT_DIR}/arch/arm64/boot/Image" artifacts/ 2>/dev/null || true
          cp "${OUT_DIR}/arch/arm64/boot/Image.gz" artifacts/ 2>/dev/null || true
          cp "${OUT_DIR}/arch/arm64/boot/Image.gz-dtb" artifacts/ 2>/dev/null || true
          find "${OUT_DIR}/arch/arm64/boot/dts" -type f \( -name '*.dtb' -o -name '*.dtbo' \) -exec cp -t artifacts {} + 2>/dev/null || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-sukisu-ultra-fixed-v4-susfs-${{ github.run_number }}
          path: |
            logs/**
            **/*.rej
          if-no-files-found: warn

      - name: Upload kernel artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-artifacts-sukisu-ultra-fixed-v4-susfs-${{ github.run_number }}
          path: artifacts/**
          if-no-files-found: warn

      - name: Upload full out directory on failure
        if: failure() && github.event.inputs.upload_full_out == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: out-debug-sukisu-ultra-fixed-v4-susfs-${{ github.run_number }}
          path: out/**
          if-no-files-found: warn
