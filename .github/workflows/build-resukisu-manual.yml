name: Build Lisa Kernel With ReSukiSU Manual Hooks

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: "Defconfig name"
        required: true
        default: "lisa_defconfig"
      jobs:
        description: "Build jobs"
        required: true
        default: "auto"
      release_tag:
        description: "GitHub Release tag name, empty = auto run number"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    name: Build ReSukiSU kernel
    runs-on: ubuntu-22.04

    env:
      ARCH: arm64
      SUBARCH: arm64
      OUT_DIR: out
      DEFCONFIG: ${{ github.event.inputs.defconfig }}

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          set -e

          sudo apt update
          sudo apt install -y \
            git curl wget zip unzip \
            build-essential bc bison flex \
            libssl-dev libelf-dev libyaml-dev \
            python3 python-is-python3 \
            clang lld llvm \
            gcc-aarch64-linux-gnu \
            cpio rsync file gzip

      - name: Add ReSukiSU source
        run: |
          set -e

          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash

      - name: Apply ReSukiSU manual hooks
        run: |
          set -e

          python3 .github/scripts/apply_resukisu_manual_hooks.py "${DEFCONFIG}"

      - name: Show ReSukiSU config
        run: |
          set -e

          DEFCONFIG_PATH=""

          if [ -f "arch/arm64/configs/${DEFCONFIG}" ]; then
            DEFCONFIG_PATH="arch/arm64/configs/${DEFCONFIG}"
          elif [ -f "arch/arm64/configs/vendor/${DEFCONFIG}" ]; then
            DEFCONFIG_PATH="arch/arm64/configs/vendor/${DEFCONFIG}"
          else
            echo "ERROR: defconfig not found: ${DEFCONFIG}"
            find arch/arm64/configs -name "*defconfig" | sort
            exit 1
          fi

          echo "DEFCONFIG_PATH=${DEFCONFIG_PATH}"
          grep -n "CONFIG_KSU" "${DEFCONFIG_PATH}" || true

      - name: Build kernel using build.sh
        run: |
          set -e

          chmod +x build.sh

          if [ "${{ github.event.inputs.jobs }}" = "auto" ]; then
            export JOBS="$(nproc --all)"
          else
            export JOBS="${{ github.event.inputs.jobs }}"
          fi

          export ARCH=arm64
          export SUBARCH=arm64
          export OUT_DIR="${OUT_DIR}"
          export DEFCONFIG="${DEFCONFIG}"

          echo "ARCH=${ARCH}"
          echo "SUBARCH=${SUBARCH}"
          echo "OUT_DIR=${OUT_DIR}"
          echo "DEFCONFIG=${DEFCONFIG}"
          echo "JOBS=${JOBS}"

          bash build.sh

      - name: Collect flashable zip
        run: |
          set -e

          mkdir -p artifacts/zips

          echo "Searching for flashable zip from build.sh..."

          mapfile -t ZIP_FILES < <(
            find . -type f -name "*.zip" \
              ! -path "./.git/*" \
              ! -path "./artifacts/*" \
              ! -path "./KernelSU-Next/*" \
              ! -path "./ReSukiSU/*" \
              | sort
          )

          if [ "${#ZIP_FILES[@]}" -eq 0 ]; then
            echo "ERROR: No zip found!"
            echo "Available zip files:"
            find . -type f -name "*.zip" || true
            exit 1
          fi

          echo "Found zip(s):"
          printf '%s\n' "${ZIP_FILES[@]}"

          for zipfile in "${ZIP_FILES[@]}"; do
            cp -v "${zipfile}" artifacts/zips/
          done

          echo "Artifacts ready:"
          find artifacts -type f -print

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lisa-kernel-resukisu-manual
          path: artifacts/**
          if-no-files-found: error

      - name: Upload zip to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          set -e

          if [ -z "${INPUT_RELEASE_TAG}" ]; then
            RELEASE_TAG="resukisu-lisa-${{ github.run_number }}"
          else
            RELEASE_TAG="${INPUT_RELEASE_TAG}"
          fi

          RELEASE_NAME="Lisa Kernel ReSukiSU Manual - ${RELEASE_TAG}"

          echo "Release tag: ${RELEASE_TAG}"

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Release exists"
          else
            echo "Creating release..."
            gh release create "${RELEASE_TAG}" \
              --title "${RELEASE_NAME}" \
              --notes "ReSukiSU manual hook AnyKernel3 build for Xiaomi lisa."
          fi

          echo "Finding zip..."
          ZIPS="$(find artifacts/zips -type f -name "*.zip" | sort)"

          if [ -z "${ZIPS}" ]; then
            echo "ERROR: no zip found to upload"
            exit 1
          fi

          echo "Uploading:"
          echo "${ZIPS}"

          gh release upload "${RELEASE_TAG}" ${ZIPS} --clobber
