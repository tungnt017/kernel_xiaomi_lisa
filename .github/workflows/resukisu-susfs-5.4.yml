name: ReSukiSU SUSFS 5.4 - Strict Build ShowSmap Fix

on:
  workflow_dispatch:
    inputs:
      kernel_dir:
        description: "Kernel source directory"
        required: false
        default: "."
      defconfig:
        description: "Defconfig path. Empty = auto-detect arch/arm64/configs/lisa_defconfig"
        required: false
        default: ""
      manual_hook_script:
        description: "Manual hook script path"
        required: false
        default: ".github/scripts/apply_resukisu_manual_hooks_1_fixed.py"
      run_resukisu_setup:
        description: "Run ReSukiSU setup.sh? true/false"
        required: false
        default: "true"
      build_script:
        description: "Build script inside kernel source"
        required: false
        default: "build.sh"
      build_args:
        description: "Optional args passed to build script"
        required: false
        default: ""
      run_build:
        description: "Run build.sh after verification? true/false"
        required: false
        default: "true"
      auto_fix_defconfig:
        description: "Auto add missing KSU/SUSFS configs? true/false"
        required: false
        default: "true"

permissions:
  contents: read

jobs:
  strict-full-build:
    name: Strict full build - no bypass, no weak, no stub
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      JACK_REPO: "https://github.com/JackA1ltman/NonGKI_Kernel_Build_2nd.git"
      JACK_BRANCH: "mainline"
      JACK_PATCH_REL: "Patches/Patch/susfs_patch_to_5.4.patch"
      PATCH_LOCAL: "/tmp/susfs_patch_to_5.4.patch"
      DEBUG_DIR: "/tmp/resukisu-susfs-debug"
      DEBUG_SUMMARY: "/tmp/resukisu-susfs-debug/debug-summary.txt"
      DEBUG_DIFF: "/tmp/resukisu-susfs-debug/source-diff.patch"
      DEBUG_BUILD_LOG: "/tmp/resukisu-susfs-debug/build.log"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install deps
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex git libelf-dev libssl-dev \
            make patch python3 rsync unzip xz-utils ca-certificates clang lld llvm
          command -v clang
          command -v ld.lld

      - name: Init variables and exactly 3 debug files
        shell: bash
        run: |
          set -euo pipefail
          echo "KERNEL_DIR=${{ github.event.inputs.kernel_dir }}" >> "$GITHUB_ENV"
          echo "INPUT_DEFCONFIG=${{ github.event.inputs.defconfig }}" >> "$GITHUB_ENV"
          echo "MANUAL_HOOK_SCRIPT=${{ github.event.inputs.manual_hook_script }}" >> "$GITHUB_ENV"
          echo "RUN_RESUKISU_SETUP=${{ github.event.inputs.run_resukisu_setup }}" >> "$GITHUB_ENV"
          echo "BUILD_SCRIPT=${{ github.event.inputs.build_script }}" >> "$GITHUB_ENV"
          echo "BUILD_ARGS=${{ github.event.inputs.build_args }}" >> "$GITHUB_ENV"
          echo "RUN_BUILD=${{ github.event.inputs.run_build }}" >> "$GITHUB_ENV"
          echo "AUTO_FIX_DEFCONFIG=${{ github.event.inputs.auto_fix_defconfig }}" >> "$GITHUB_ENV"
          rm -rf "$DEBUG_DIR" && mkdir -p "$DEBUG_DIR"
          : > "$DEBUG_SUMMARY"; : > "$DEBUG_DIFF"; : > "$DEBUG_BUILD_LOG"
          {
            echo "=== Inputs ==="
            echo "kernel_dir=${{ github.event.inputs.kernel_dir }}"
            echo "defconfig=${{ github.event.inputs.defconfig }}"
            echo "manual_hook_script=${{ github.event.inputs.manual_hook_script }}"
            echo "run_resukisu_setup=${{ github.event.inputs.run_resukisu_setup }}"
            echo "build_script=${{ github.event.inputs.build_script }}"
            echo "build_args=${{ github.event.inputs.build_args }}"
            echo "run_build=${{ github.event.inputs.run_build }}"
            echo "auto_fix_defconfig=${{ github.event.inputs.auto_fix_defconfig }}"
            echo
            echo "=== Toolchain ==="
            command -v clang || true
            command -v ld.lld || true
            clang --version | sed -n '1,2p' || true
            ld.lld --version || true
            echo
          } > "$DEBUG_SUMMARY"

      - name: Detect kernel and defconfig
        shell: bash
        run: |
          set -euo pipefail
          cd "$KERNEL_DIR"
          test -f Makefile && test -d fs && test -d include && test -d arch
          VERSION=$(awk '/^VERSION =/{print $3}' Makefile)
          PATCHLEVEL=$(awk '/^PATCHLEVEL =/{print $3}' Makefile)
          SUBLEVEL=$(awk '/^SUBLEVEL =/{print $3}' Makefile)
          [ "$VERSION" = "5" ] && [ "$PATCHLEVEL" = "4" ] || { echo "[ERROR] Need kernel 5.4, got ${VERSION}.${PATCHLEVEL}.${SUBLEVEL}"; exit 1; }
          DEFCONFIG="$INPUT_DEFCONFIG"
          if [ -z "$DEFCONFIG" ]; then
            if [ -f arch/arm64/configs/lisa_defconfig ]; then DEFCONFIG="arch/arm64/configs/lisa_defconfig"; else DEFCONFIG=$(find arch/arm64/configs -maxdepth 2 -type f -name "*defconfig" | sed -n '1p'); fi
          fi
          test -f "$DEFCONFIG" || { echo "[ERROR] Defconfig not found: $DEFCONFIG"; exit 1; }
          echo "DEFCONFIG=$DEFCONFIG" >> "$GITHUB_ENV"
          { echo "=== Kernel ==="; echo "version=${VERSION}.${PATCHLEVEL}.${SUBLEVEL}"; echo "defconfig=$DEFCONFIG"; echo; } >> "$DEBUG_SUMMARY"

      - name: Fetch Jack SUSFS patch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/NonGKI_Kernel_Build_2nd
          git clone --depth=1 --branch "$JACK_BRANCH" "$JACK_REPO" /tmp/NonGKI_Kernel_Build_2nd
          cp "/tmp/NonGKI_Kernel_Build_2nd/$JACK_PATCH_REL" "$PATCH_LOCAL"
          grep -q 'diff --git a/fs/susfs\.c b/fs/susfs\.c' "$PATCH_LOCAL"
          grep -q 'diff --git a/include/linux/susfs\.h b/include/linux/susfs\.h' "$PATCH_LOCAL"
          grep -q 'diff --git a/include/linux/susfs_def\.h b/include/linux/susfs_def\.h' "$PATCH_LOCAL"
          { echo "=== SUSFS Patch ==="; sha256sum "$PATCH_LOCAL"; grep -n '^diff --git' "$PATCH_LOCAL" | sed -n '1,240p' || true; echo; } >> "$DEBUG_SUMMARY"

      - name: ReSukiSU setup
        if: ${{ github.event.inputs.run_resukisu_setup == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$KERNEL_DIR"
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash

      - name: Apply existing manual hook script
        shell: bash
        run: |
          set -euo pipefail
          cd "$KERNEL_DIR"
          if [ -f "$MANUAL_HOOK_SCRIPT" ]; then python3 "$MANUAL_HOOK_SCRIPT"; else echo "[WARN] Manual hook script not found: $MANUAL_HOOK_SCRIPT"; fi

      - name: Strict real ReSukiSU hook fixes
        shell: bash
        run: |
          set -euo pipefail
          cd "$KERNEL_DIR"
          python3 - <<'PY'
          from pathlib import Path
          import re

          def find_func(s, markers):
              marker = next((m for m in markers if m in s), None)
              if marker is None:
                  raise SystemExit('[ERROR] cannot find function marker: ' + str(markers))
              start = s.find(marker); brace = s.find('{', start)
              depth = 0; end = None
              for i in range(brace, len(s)):
                  if s[i] == '{': depth += 1
                  elif s[i] == '}':
                      depth -= 1
                      if depth == 0: end = i + 1; break
              if end is None: raise SystemExit('[ERROR] cannot parse function body')
              return marker, start, brace, end, s[brace:end]

          # setresuid real call
          p = Path('kernel/sys.c'); s = p.read_text(); marker = 'SYSCALL_DEFINE3(setresuid'
          if marker not in s: raise SystemExit('[ERROR] Cannot find setresuid')
          if 'extern int ksu_handle_setresuid' not in s:
              idx = s.find(marker)
              s = s[:idx] + '#ifdef CONFIG_KSU_MANUAL_HOOK\n__attribute__((hot))\nextern int ksu_handle_setresuid(uid_t ruid, uid_t euid, uid_t suid);\n#endif\n\n' + s[idx:]
          _,_,brace,end,body = find_func(s, [marker])
          if 'ksu_handle_setresuid(ruid, euid, suid);' not in body:
              hook = '#ifdef CONFIG_KSU_MANUAL_HOOK\n\tksu_handle_setresuid(ruid, euid, suid);\n#endif\n\t'
              if 'return commit_creds(new);' in body: body = body.replace('return commit_creds(new);', hook+'return commit_creds(new);', 1)
              elif 'commit_creds(new);' in body: body = body.replace('commit_creds(new);', hook+'commit_creds(new);', 1)
              else:
                  returns = list(re.finditer(r'(?m)^[ \t]*return\b[^;]*;', body))
                  if not returns: raise SystemExit('[ERROR] No return in setresuid')
                  r = returns[-1]; body = body[:r.start()] + '\t' + hook + body[r.start():]
              s = s[:brace] + body + s[end:]
          p.write_text(s)

          # sys_read real call
          p = Path('fs/read_write.c'); s = p.read_text(); marker = 'SYSCALL_DEFINE3(read'
          if marker not in s: raise SystemExit('[ERROR] Cannot find read syscall')
          if 'ksu_handle_vfs_read' in s: raise SystemExit('[ERROR] ksu_handle_vfs_read found; ReSukiSU inline expects ksu_handle_sys_read')
          if 'extern int ksu_handle_sys_read' not in s:
              idx = s.find(marker)
              s = s[:idx] + '#ifdef CONFIG_KSU_MANUAL_HOOK\n__attribute__((hot))\nextern int ksu_handle_sys_read(unsigned int fd, char __user **buf_ptr, size_t *count_ptr);\n#endif\n\n' + s[idx:]
          _,_,brace,end,body = find_func(s, [marker])
          if 'ksu_handle_sys_read(fd, &buf, &count);' not in body:
              hook = '#ifdef CONFIG_KSU_MANUAL_HOOK\n\tksu_handle_sys_read(fd, &buf, &count);\n#endif\n\t'
              if 'return ksys_read(fd, buf, count);' in body: body = body.replace('return ksys_read(fd, buf, count);', hook+'return ksys_read(fd, buf, count);', 1)
              else:
                  returns = list(re.finditer(r'(?m)^[ \t]*return\b[^;]*;', body))
                  if not returns: raise SystemExit('[ERROR] No return in read syscall')
                  r = returns[-1]; body = body[:r.start()] + '\t' + hook + body[r.start():]
              s = s[:brace] + body + s[end:]
          p.write_text(s)

          # input direct real call, no ksu_input_hook
          p = Path('drivers/input/input.c'); s = p.read_text()
          s = s.replace('extern bool ksu_input_hook __read_mostly;\n', '')
          s = s.replace('\tif (unlikely(ksu_input_hook))\n\t\tksu_handle_input_handle_event(&type, &code, &value);\n', '')
          markers = ['static void input_handle_event(struct input_dev *dev,','static void input_handle_event (struct input_dev *dev,','void input_handle_event(struct input_dev *dev,','void input_handle_event (struct input_dev *dev,']
          marker,_,_,_,_ = find_func(s, markers)
          if 'extern int ksu_handle_input_handle_event' not in s:
              idx = s.find(marker)
              s = s[:idx] + '#ifdef CONFIG_KSU_MANUAL_HOOK\n__attribute__((hot))\nextern int ksu_handle_input_handle_event(unsigned int *type, unsigned int *code, int *value);\n#endif\n\n' + s[idx:]
          marker,_,brace,end,body = find_func(s, markers)
          if 'ksu_handle_input_handle_event(&type, &code, &value);' not in body:
              hook = '#ifdef CONFIG_KSU_MANUAL_HOOK\n\tksu_handle_input_handle_event(&type, &code, &value);\n#endif\n'
              anchors = ['disposition = input_get_disposition(dev, type, code, &value);','disposition = input_get_disposition (dev, type, code, &value);']
              anchor = next((a for a in anchors if a in body), None)
              if anchor is None: raise SystemExit('[ERROR] Cannot find input_get_disposition anchor')
              body = body.replace(anchor, anchor+'\n'+hook, 1)
              s = s[:brace] + body + s[end:]
          if 'ksu_input_hook' in s: raise SystemExit('[ERROR] ksu_input_hook remains in input.c')
          p.write_text(s)
          print('[OK] real hooks applied')
          PY
          {
            echo "=== setresuid hook ==="; grep -n "ksu_handle_setresuid" kernel/sys.c || true; echo
            echo "=== sys_read hook ==="; grep -n "ksu_handle_sys_read" fs/read_write.c || true; echo
            echo "=== input hook ==="; grep -n "ksu_handle_input_handle_event\|ksu_input_hook" drivers/input/input.c || true; echo
          } >> "$DEBUG_SUMMARY"

      - name: Check no weak/no-op KSU hook stubs and required hooks
        shell: bash
        run: |
          set -euo pipefail
          cd "$KERNEL_DIR"
          if grep -RInE '(__weak|weak).*ksu_handle_|ksu_handle_.*(__weak|weak)' fs kernel mm security drivers 2>/dev/null; then echo "[ERROR] Weak ksu_handle shim detected"; exit 1; fi
          if grep -RInE 'ksu_handle_[a-zA-Z0-9_]+\([^;]*\)[[:space:]]*\{[[:space:]]*return[[:space:]]+0;[[:space:]]*\}' fs kernel mm security drivers 2>/dev/null; then echo "[ERROR] No-op ksu_handle stub detected"; exit 1; fi
          if grep -RIn 'ksu_input_hook' drivers/input/input.c 2>/dev/null; then echo "[ERROR] ksu_input_hook incompatible hook detected"; exit 1; fi
          fail=0
          check() { grep -q "$2" "$1" && echo "[OK] $1 -> $2" || { echo "[ERROR] missing $1 -> $2"; fail=1; }; }
          check kernel/sys.c ksu_handle_setresuid
          check fs/exec.c ksu_handle_execveat
          check fs/open.c ksu_handle_faccessat
          check fs/read_write.c ksu_handle_sys_read
          check fs/stat.c ksu_handle_stat
          check drivers/input/input.c ksu_handle_input_handle_event
          { echo "=== KSU hooks ==="; grep -Rsn "ksu_handle_" fs/exec.c fs/open.c fs/read_write.c fs/stat.c kernel/sys.c kernel/reboot.c drivers/input/input.c 2>/dev/null | sed -n '1,460p' || true; echo; } >> "$DEBUG_SUMMARY"
          [ "$fail" -eq 0 ] || exit 1

      - name: Apply SUSFS patch strictly - no bypass
        shell: bash
        run: |
          set -euo pipefail
          cd "$KERNEL_DIR"
          if git apply --check "$PATCH_LOCAL"; then git apply "$PATCH_LOCAL"; elif patch -p1 --dry-run < "$PATCH_LOCAL"; then patch -p1 < "$PATCH_LOCAL"; else echo "[ERROR] SUSFS patch failed. Not bypassing."; exit 1; fi
          rej=$(find . -name "*.rej" -print)
          [ -z "$rej" ] || { echo "[ERROR] Reject files:"; echo "$rej"; exit 1; }
          find . -name "*.orig" -print -delete || true

      - name: Fix defconfig KSU/SUSFS
        shell: bash
        run: |
          set -euo pipefail
          cd "$KERNEL_DIR"
          ensure_y() { cfg="$1"; if grep -qE "^${cfg}=y$" "$DEFCONFIG"; then return 0; fi; [ "$AUTO_FIX_DEFCONFIG" = "true" ] || { echo "[ERROR] Missing $cfg=y"; exit 1; }; sed -i "/^# ${cfg} is not set$/d;/^${cfg}=/d" "$DEFCONFIG"; printf '\n%s=y\n' "$cfg" >> "$DEFCONFIG"; }
          unset_cfg() { cfg="$1"; sed -i "/^${cfg}=y$/d;/^${cfg}=/d" "$DEFCONFIG"; grep -qE "^# ${cfg} is not set$" "$DEFCONFIG" || printf '# %s is not set\n' "$cfg" >> "$DEFCONFIG"; }
          ensure_y CONFIG_KSU
          ensure_y CONFIG_KSU_MANUAL_HOOK
          ensure_y CONFIG_KSU_SUSFS
          ensure_y CONFIG_KALLSYMS
          unset_cfg CONFIG_KSU_KPROBE_HOOKS
          unset_cfg CONFIG_KSU_KPROBES_HOOK
          unset_cfg CONFIG_KSU_KPROBES_HOOKS
          unset_cfg CONFIG_KSU_WITH_KPROBES
          { echo "=== Defconfig ==="; grep -nE "CONFIG_KSU|CONFIG_KALLSYMS" "$DEFCONFIG" || true; echo; } >> "$DEBUG_SUMMARY"

      - name: Real compile fix for SUSFS show_smap return type
        shell: bash
        run: |
          set -euo pipefail
          cd "$KERNEL_DIR"
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('fs/proc/task_mmu.c')
          s = p.read_text()
          m = re.search(r'static\s+int\s+show_smap\s*\([^)]*\)\s*\{', s)
          if not m:
              raise SystemExit('[ERROR] static int show_smap not found')
          start = m.end() - 1
          depth = 0; end = None
          for i in range(start, len(s)):
              if s[i] == '{': depth += 1
              elif s[i] == '}':
                  depth -= 1
                  if depth == 0: end = i + 1; break
          if end is None:
              raise SystemExit('[ERROR] Cannot parse show_smap body')
          body = s[start:end]
          if re.search(r'(?m)^\s*return\s*;\s*$', body):
              body = re.sub(r'(?m)^(\s*)return\s*;\s*$', r'\1return 0;', body)
              s = s[:start] + body + s[end:]
              p.write_text(s)
              print('[FIXED] show_smap bare return converted to return 0')
          else:
              print('[OK] show_smap has no bare return')
          PY
          python3 - <<'PY'
          from pathlib import Path
          import re
          s = Path('fs/proc/task_mmu.c').read_text()
          m = re.search(r'static\s+int\s+show_smap\s*\([^)]*\)\s*\{', s)
          start = m.end() - 1; depth = 0; end = None
          for i in range(start, len(s)):
              if s[i] == '{': depth += 1
              elif s[i] == '}':
                  depth -= 1
                  if depth == 0: end = i + 1; break
          body = s[start:end]
          if re.search(r'(?m)^\s*return\s*;\s*$', body):
              raise SystemExit('[ERROR] bare return remains in int show_smap')
          print('[OK] show_smap sanity passed')
          PY
          { echo "=== show_smap return fix ==="; grep -n "static int show_smap" fs/proc/task_mmu.c || true; grep -n "return 0;" fs/proc/task_mmu.c | sed -n '1,100p' || true; echo; } >> "$DEBUG_SUMMARY"

      
      - name: Real compile fix for SUSFS open_redirect macro compatibility
        shell: bash
        run: |
          set -euo pipefail
          cd "$KERNEL_DIR"
          python3 - <<'PY'
          from pathlib import Path

          hdr = Path('include/linux/susfs_def.h')
          opn = Path('fs/open.c')
          if not hdr.exists():
              raise SystemExit('[ERROR] include/linux/susfs_def.h not found')
          if not opn.exists():
              raise SystemExit('[ERROR] fs/open.c not found')

          h = hdr.read_text()
          o = opn.read_text()
          need = 'SUSFS_IS_INODE_OPEN_REDIRECT_WITHOUT_UID_CHECK'
          base = 'SUSFS_IS_INODE_OPEN_REDIRECT'

          if need in o and need not in h:
              if base not in h:
                  raise SystemExit('[ERROR] fs/open.c uses %s but %s is also missing in susfs_def.h' % (need, base))
              block = (
                  '\n\n#ifndef SUSFS_IS_INODE_OPEN_REDIRECT_WITHOUT_UID_CHECK\n'
                  '#define SUSFS_IS_INODE_OPEN_REDIRECT_WITHOUT_UID_CHECK(inode) \\\n'
                  '\tSUSFS_IS_INODE_OPEN_REDIRECT(inode)\n'
                  '#endif\n'
              )
              h = h.rstrip() + block + '\n'
              hdr.write_text(h)
              print('[FIXED] Added SUSFS open_redirect WITHOUT_UID_CHECK compatibility macro alias')
          else:
              print('[OK] SUSFS open_redirect macro compatibility already satisfied or not needed')
          PY

          # Strict sanity: if fs/open.c references the macro, header must define it.
          python3 - <<'PY'
          from pathlib import Path
          o = Path('fs/open.c').read_text()
          h = Path('include/linux/susfs_def.h').read_text()
          need = 'SUSFS_IS_INODE_OPEN_REDIRECT_WITHOUT_UID_CHECK'
          if need in o and need not in h:
              raise SystemExit('[ERROR] %s still missing from include/linux/susfs_def.h' % need)
          print('[OK] SUSFS open_redirect macro sanity passed')
          PY

          {
            echo "=== SUSFS open_redirect macro fix ==="
            grep -n "SUSFS_IS_INODE_OPEN_REDIRECT_WITHOUT_UID_CHECK\|SUSFS_IS_INODE_OPEN_REDIRECT" include/linux/susfs_def.h fs/open.c || true
            echo
          } >> "$DEBUG_SUMMARY"

      
      - name: Real compile fix for SUSFS open.c include susfs_def
        shell: bash
        run: |
          set -euo pipefail
          cd "$KERNEL_DIR"
          python3 - <<'PY'
          from pathlib import Path

          p = Path('fs/open.c')
          if not p.exists():
              raise SystemExit('[ERROR] fs/open.c not found')

          s = p.read_text()
          need_macro = 'SUSFS_IS_INODE_OPEN_REDIRECT_WITHOUT_UID_CHECK'
          need_include = '#include <linux/susfs_def.h>'

          if need_macro in s and need_include not in s:
              # Put the include with other linux includes, before local/internal includes.
              anchor = '#include <linux/falloc.h>\n'
              if anchor in s:
                  insert = anchor + '#ifdef CONFIG_KSU_SUSFS_OPEN_REDIRECT\n#include <linux/susfs_def.h>\n#endif\n'
                  s = s.replace(anchor, insert, 1)
              else:
                  # Fallback: insert after the last top block linux include.
                  lines = s.splitlines(True)
                  pos = None
                  for i, line in enumerate(lines):
                      if line.startswith('#include <linux/'):
                          pos = i + 1
                  if pos is None:
                      raise SystemExit('[ERROR] Cannot find linux include location in fs/open.c')
                  lines.insert(pos, '#ifdef CONFIG_KSU_SUSFS_OPEN_REDIRECT\n')
                  lines.insert(pos + 1, '#include <linux/susfs_def.h>\n')
                  lines.insert(pos + 2, '#endif\n')
                  s = ''.join(lines)
              p.write_text(s)
              print('[FIXED] Added linux/susfs_def.h include to fs/open.c')
          else:
              print('[OK] fs/open.c include already present or macro not used')
          PY

          # Strict sanity: if fs/open.c references SUSFS redirect macros, it must include susfs_def.h.
          python3 - <<'PY'
          from pathlib import Path
          s = Path('fs/open.c').read_text()
          if 'SUSFS_IS_INODE_OPEN_REDIRECT' in s and '#include <linux/susfs_def.h>' not in s:
              raise SystemExit('[ERROR] fs/open.c uses SUSFS open redirect macros without linux/susfs_def.h include')
          print('[OK] fs/open.c susfs_def include sanity passed')
          PY

          {
            echo "=== SUSFS open.c include fix ==="
            grep -n "susfs_def.h\|SUSFS_IS_INODE_OPEN_REDIRECT_WITHOUT_UID_CHECK" fs/open.c include/linux/susfs_def.h || true
            echo
          } >> "$DEBUG_SUMMARY"


      
      - name: Real compile fix for SUSFS stat.c mount type visibility
        shell: bash
        run: |
          set -euo pipefail
          cd "$KERNEL_DIR"
          python3 - <<'PY'
          from pathlib import Path

          p = Path('fs/stat.c')
          if not p.exists():
              raise SystemExit('[ERROR] fs/stat.c not found')

          s = p.read_text()
          uses_mount = 'susfs_get_non_sus_mnt_id_from_mnt(struct mount *orig_mnt)' in s or 'susfs_get_non_sus_mnt_id_from_mnt(struct mount *' in s
          has_mount_include = '#include "mount.h"' in s

          if uses_mount and not has_mount_include:
              anchor = '#include <asm/unistd.h>\n'
              block = anchor + '#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n#include "mount.h"\n#endif\n'
              if anchor in s:
                  s = s.replace(anchor, block, 1)
              else:
                  lines = s.splitlines(True)
                  pos = None
                  for i, line in enumerate(lines):
                      if line.startswith('#include '):
                          pos = i + 1
                  if pos is None:
                      raise SystemExit('[ERROR] Cannot find include location in fs/stat.c')
                  lines.insert(pos, '#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n')
                  lines.insert(pos + 1, '#include "mount.h"\n')
                  lines.insert(pos + 2, '#endif\n')
                  s = ''.join(lines)
              p.write_text(s)
              print('[FIXED] Added fs/mount.h include to fs/stat.c for struct mount visibility')
          else:
              print('[OK] fs/stat.c mount type visibility already satisfied or not needed')
          PY

          # Strict sanity: if stat.c declares the SUSFS mount helper, mount.h must be included.
          python3 - <<'PY'
          from pathlib import Path
