name: Daily ReSukiSU Manual SUSFS Official

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: Kernel defconfig
        required: true
        default: lisa_defconfig
      susfs_ref:
        description: ShirkNeko SUSFS ref/branch
        required: false
        default: kernel-5.4
      manual_hook_script:
        description: Existing manual hook script path
        required: true
        default: .github/scripts/apply_resukisu_manual_hooks_1_fixed.py
      jobs:
        description: Parallel build jobs. Leave as $(nproc) for auto
        required: true
        default: $(nproc)
      upload_full_out:
        description: Upload out/ on failure
        required: false
        type: boolean
        default: false
  schedule:
    # Daily at 02:30 UTC / 09:30 GMT+7
    - cron: "30 2 * * *"

permissions:
  contents: read

env:
  ARCH: arm64
  SUBARCH: arm64
  OUT_DIR: out
  DEFCONFIG: lisa_defconfig
  SUSFS_REPO: https://github.com/ShirkNeko/susfs4ksu.git
  SUSFS_REF: kernel-5.4
  MANUAL_HOOK_SCRIPT: .github/scripts/apply_resukisu_manual_hooks_1_fixed.py
  CROSS_COMPILE: aarch64-linux-gnu-
  CLANG_TRIPLE: aarch64-linux-gnu-

jobs:
  build:
    name: Official ReSukiSU manual SUSFS
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Normalize workflow inputs
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "DEFCONFIG=${{ github.event.inputs.defconfig }}" >> "$GITHUB_ENV"
            echo "SUSFS_REF=${{ github.event.inputs.susfs_ref }}" >> "$GITHUB_ENV"
            echo "MANUAL_HOOK_SCRIPT=${{ github.event.inputs.manual_hook_script }}" >> "$GITHUB_ENV"
          fi

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Prepare build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex git git-lfs gnupg \
            libelf-dev libssl-dev lld llvm make openssl python3 python3-pip \
            rsync unzip wget zip zstd \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
          mkdir -p logs artifacts logs/debug

      - name: Capture environment
        run: |
          set -euo pipefail
          {
            echo "DATE_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "GITHUB_RUN=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "EVENT_NAME=${GITHUB_EVENT_NAME}"
            echo "DEFCONFIG=${DEFCONFIG}"
            echo "SUSFS_REPO=${SUSFS_REPO}"
            echo "SUSFS_REF=${SUSFS_REF}"
            echo "MANUAL_HOOK_SCRIPT=${MANUAL_HOOK_SCRIPT}"
            echo "ARCH=${ARCH}"
            echo "OUT_DIR=${OUT_DIR}"
            echo "CROSS_COMPILE=${CROSS_COMPILE}"
            echo "CLANG_TRIPLE=${CLANG_TRIPLE}"
          } | tee logs/environment.log

      - name: Add ReSukiSU source
        run: |
          set -euo pipefail
          echo "Running ReSukiSU setup" | tee logs/resukisu-setup.log
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" \
            | bash 2>&1 | tee -a logs/resukisu-setup.log

          KSU_DIR=""
          if [ -d KernelSU ]; then KSU_DIR="KernelSU"; fi
          if [ -z "${KSU_DIR}" ] && [ -d drivers/kernelsu ]; then KSU_DIR="drivers/kernelsu"; fi
          if [ -z "${KSU_DIR}" ] && [ -d kernel/KernelSU ]; then KSU_DIR="kernel/KernelSU"; fi

          if [ -z "${KSU_DIR}" ]; then
            echo "ERROR: ReSukiSU/KernelSU directory not found" | tee logs/resukisu-commit.log
            exit 1
          fi

          echo "KSU_DIR=${KSU_DIR}" | tee logs/resukisu-commit.log
          echo "KSU_DIR=${KSU_DIR}" >> "$GITHUB_ENV"
          if [ -d "${KSU_DIR}/.git" ]; then
            git -C "${KSU_DIR}" rev-parse HEAD | tee -a logs/resukisu-commit.log || true
            git -C "${KSU_DIR}" log -1 --oneline | tee -a logs/resukisu-commit.log || true
          fi

      - name: Clone ShirkNeko SUSFS
        run: |
          set -euo pipefail
          rm -rf susfs-src
          if git ls-remote --exit-code --heads "${SUSFS_REPO}" "${SUSFS_REF}" >/dev/null 2>&1; then
            git clone --depth 1 --branch "${SUSFS_REF}" "${SUSFS_REPO}" susfs-src 2>&1 | tee logs/susfs-clone.log
          else
            git clone --depth 1 "${SUSFS_REPO}" susfs-src 2>&1 | tee logs/susfs-clone.log
            git -C susfs-src fetch --unshallow 2>/dev/null || true
            git -C susfs-src fetch --all --tags --force || true
            git -C susfs-src checkout "${SUSFS_REF}" 2>&1 | tee -a logs/susfs-clone.log
          fi
          {
            echo "===== SUSFS HEAD ====="
            git -C susfs-src rev-parse HEAD || true
            git -C susfs-src log -1 --oneline || true
            echo
            echo "===== SUSFS kernel-side files only ====="
            find susfs-src/kernel_patches -maxdepth 4 -type f \
              | grep -v 'kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch' \
              | sort || true
          } | tee logs/susfs-tree.log

      - name: Copy SUSFS kernel implementation files only
        run: |
          set -euo pipefail
          python3 - <<'PY' 2>&1 | tee logs/copy-susfs-files.log
          from pathlib import Path
          import shutil
          root = Path.cwd()
          srcroot = root / 'susfs-src' / 'kernel_patches'
          required = ['fs/susfs.c', 'include/linux/susfs.h', 'include/linux/susfs_def.h']
          optional = ['fs/sus_su.c', 'include/linux/sus_su.h']
          for rel in required:
              src = srcroot / rel
              dst = root / rel
              if not src.exists():
                  raise SystemExit(f'[ERROR] missing required SUSFS file: {src}')
              dst.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(src, dst)
              print(f'[OK] copied {src} -> {dst}')
          for rel in optional:
              src = srcroot / rel
              dst = root / rel
              if src.exists():
                  dst.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(src, dst)
                  print(f'[OK] copied optional {src} -> {dst}')
          print('[OK] KernelSU/10_enable_susfs_for_ksu.patch is not copied, checked, applied, or used.')
          PY

      - name: Official SUSFS pre-compile check with context export
        run: |
          set +e
          mkdir -p logs/debug
          python3 - <<'PY' 2>&1 | tee logs/susfs-precompile-check.log
          from pathlib import Path
          import subprocess, re
          root = Path.cwd()
          sus = root / 'susfs-src' / 'kernel_patches'
          patch = sus / '50_add_susfs_in_kernel-5.4.patch'
          failures = []

          def write(path, data):
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(data, errors='ignore')

          def source_context(path, center, radius=70):
              f = root / path
              out = [f'===== SOURCE CONTEXT: {path} =====']
              if not f.exists():
                  out.append(f'[MISSING] {path}')
                  return '\n'.join(out) + '\n'
              lines = f.read_text(errors='ignore').splitlines()
              start = max(1, center - radius)
              end = min(len(lines), center + radius)
              out.append(f'lines {start}-{end} of {len(lines)}')
              for i in range(start, end + 1):
                  out.append(f'{i:05d}: {lines[i-1]}')
              return '\n'.join(out) + '\n'

          def patch_sections(files):
              text = patch.read_text(errors='ignore') if patch.exists() else ''
              result = {}
              for f in files:
                  m = re.search(rf'(^diff --git a/{re.escape(f)} b/{re.escape(f)}\n.*?)(?=^diff --git |\Z)', text, re.M | re.S)
                  result[f] = m.group(1) if m else ''
              return result

          for rel in ['fs/susfs.c', 'include/linux/susfs.h', 'include/linux/susfs_def.h']:
              if not (root / rel).exists():
                  failures.append(f'missing copied SUSFS file: {rel}')
              else:
                  print(f'[OK] copied SUSFS file exists: {rel}')

          print('[OK] KernelSU/10_enable_susfs_for_ksu.patch is excluded from official ReSukiSU workflow path')
          if not patch.exists():
              failures.append('missing kernel-side patch: 50_add_susfs_in_kernel-5.4.patch')
              output = ''
          else:
              print(f'[INFO] selected kernel-side patch: {patch}')
              cmd = f"git apply --check --whitespace=error '{patch.resolve()}'"
              print(f'[CHECK] {cmd}  (cwd={root})')
              p = subprocess.run(cmd, shell=True, cwd=root, text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
              output = p.stdout
              print(output, end='')
              if p.returncode != 0:
                  failures.append('kernel-side SUSFS patch does not apply cleanly to this lisa source')

          files_from_errors = [(m.group(1), int(m.group(2))) for m in re.finditer(r'error: patch failed: ([^:]+):(\d+)', output)]
          if not files_from_errors:
              files_from_errors = [
                  ('fs/Makefile', 14), ('fs/namei.c', 40), ('fs/namespace.c', 26),
                  ('fs/notify/fdinfo.c', 13), ('fs/proc/task_mmu.c', 348), ('fs/readdir.c', 23),
              ]
          unique_files = []
          for f, _ in files_from_errors:
              if f not in unique_files:
                  unique_files.append(f)

          write(root / 'logs/debug/susfs-patch-check-output.log', output)
          write(root / 'logs/debug/susfs-source-context.log', '\n'.join(source_context(f, line, 90) for f, line in files_from_errors))
          sections = patch_sections(unique_files)
          write(root / 'logs/debug/susfs-patch-hunks.log', '\n'.join([f'===== PATCH SECTION FOR {f} =====\n{sections.get(f) or "[MISSING]"}' for f in unique_files]))
          allctx = ['===== ALL SOURCE CONTEXTS FOR EVERY HUNK TARGET LINE =====']
          for f in unique_files:
              allctx.append(f'##### FILE: {f} #####')
              for line in sorted(set(int(x) for x in re.findall(r'^@@ -\d+(?:,\d+)? \+(\d+)(?:,\d+)? @@', sections.get(f, ''), re.M))):
                  allctx.append(source_context(f, line, 70))
          write(root / 'logs/debug/susfs-all-hunk-source-contexts.log', '\n'.join(allctx))

          rejs = sorted(root.rglob('*.rej'))
          if rejs:
              failures.append('.rej files found before compile')
              for r in rejs:
                  print(f'[REJ] {r.relative_to(root)}')

          if failures:
              print('\n[OFFICIAL FAIL-FAST] SUSFS pre-compile check failed. Build will stop before wasting compile time.')
              print('[INFO] Exported official porting context without applying patch.')
              for item in failures:
                  print(f'  - {item}')
              raise SystemExit(1)
          print('[OK] SUSFS pre-compile check passed')
          PY
          exit ${PIPESTATUS[0]}

      - name: Apply SUSFS kernel-side patch after clean check
        run: |
          set -euo pipefail
          git apply --whitespace=error susfs-src/kernel_patches/50_add_susfs_in_kernel-5.4.patch 2>&1 | tee logs/apply-susfs-kernel-side.log
          if find . -name '*.rej' -type f | grep -q .; then
            echo "ERROR: .rej files exist after clean apply" | tee -a logs/apply-susfs-kernel-side.log
            find . -name '*.rej' -type f | sort | tee -a logs/apply-susfs-kernel-side.log
            exit 1
          fi

      - name: Apply existing manual hook script
        run: |
          set -euo pipefail
          if [ ! -f "${MANUAL_HOOK_SCRIPT}" ]; then
            echo "ERROR: manual hook script not found: ${MANUAL_HOOK_SCRIPT}" | tee logs/apply-manual-hooks.log
            exit 1
          fi
          python3 "${MANUAL_HOOK_SCRIPT}" "${DEFCONFIG}" 2>&1 | tee logs/apply-manual-hooks.log

      - name: Official validate manual hooks
        run: |
          set -euo pipefail
          failed=0
          {
            echo "===== Official manual hook validation ====="
            for pair in "fs/exec.c:ksu_handle_execveat" "fs/open.c:ksu_handle_faccessat" "fs/stat.c:ksu_handle_stat" "kernel/reboot.c:ksu_handle_sys_reboot"; do
              file="${pair%%:*}"; pattern="${pair#*:}"
              if grep -q "$pattern" "$file"; then echo "[OK] $file contains $pattern"; else echo "[ERROR] $file missing $pattern"; failed=1; fi
            done
            if grep -R "ksu_handle_execveat((int \*)AT_FDCWD" fs/exec.c >/dev/null 2>&1; then
              echo "[ERROR] unsafe exec hook cast found"; failed=1
            else
              echo "[OK] no unsafe AT_FDCWD pointer cast found"
            fi
            if grep -E "\[WARN\]|\[MISS\]|skip: no manual hook" logs/apply-manual-hooks.log >/dev/null 2>&1; then
              echo "[ERROR] manual hook script emitted WARN/MISS"; failed=1
            else
              echo "[OK] manual hook log has no WARN/MISS"
            fi
          } | tee logs/manual-hook-validation.log
          exit "$failed"

      - name: Enable ReSukiSU + SUSFS configs
        run: |
          set -euo pipefail
          python3 - <<'PY' 2>&1 | tee logs/enable-resukisu-susfs-configs.log
          from pathlib import Path
          import os
          root = Path.cwd()
          defconfig = os.environ.get('DEFCONFIG', 'lisa_defconfig')
          paths = [root/'arch/arm64/configs'/defconfig, root/'arch/arm64/configs/vendor'/defconfig]
          path = next((p for p in paths if p.exists()), None)
          if not path:
              raise SystemExit(f'[ERROR] defconfig not found: {defconfig}')
          text = path.read_text(errors='ignore')
          def setcfg(text, key):
              lines=[]; seen=False
              for line in text.splitlines():
                  if line.startswith(key+'=') or line.startswith('# '+key+' is not set'):
                      if not seen:
                          lines.append(key+'=y'); seen=True
                      continue
                  lines.append(line)
              if not seen: lines.append(key+'=y')
              return '\n'.join(lines)+'\n'
          for key in ['CONFIG_KSU','CONFIG_KSU_MANUAL_HOOK','CONFIG_KALLSYMS','CONFIG_KALLSYMS_ALL','CONFIG_KSU_SUSFS','CONFIG_KSU_SUSFS_SUS_PATH','CONFIG_KSU_SUSFS_SUS_MOUNT','CONFIG_KSU_SUSFS_SUS_KSTAT','CONFIG_KSU_SUSFS_TRY_UMOUNT','CONFIG_KSU_SUSFS_SPOOF_UNAME','CONFIG_KSU_SUSFS_ENABLE_LOG','CONFIG_KSU_SUSFS_OPEN_REDIRECT']:
              text=setcfg(text,key)
          path.write_text(text)
          print(f'[OK] enabled configs in {path}')
          PY

      - name: Final SUSFS guard before compile
        run: |
          set -euo pipefail
          for f in fs/susfs.c include/linux/susfs.h include/linux/susfs_def.h; do test -f "$f" || { echo "ERROR: $f missing"; exit 1; }; done
          if find . -name '*.rej' -type f | grep -q .; then find . -name '*.rej' -type f | sort; exit 1; fi
          echo "[OK] final SUSFS guard passed" | tee logs/final-susfs-guard.log

      - name: Dump integration status
        if: always()
        run: |
          set +e
          {
            echo "===== KSU_DIR ====="; echo "${KSU_DIR:-}"
            echo "===== SUSFS files ====="; ls -la fs/susfs.c include/linux/susfs.h include/linux/susfs_def.h 2>/dev/null || true
            echo "===== Reject files ====="; find . -name '*.rej' -type f | sort || true
            echo "===== Manual hook grep ====="; grep -R "ksu_handle_execveat\|ksu_handle_faccessat\|ksu_handle_stat\|ksu_handle_sys_reboot" fs kernel security 2>/dev/null || true
          } | tee logs/integration-status.log

      - name: Configure kernel
        run: |
          set -euo pipefail
          make O="${OUT_DIR}" ARCH="${ARCH}" CROSS_COMPILE="${CROSS_COMPILE}" CLANG_TRIPLE="${CLANG_TRIPLE}" "${DEFCONFIG}" 2>&1 | tee logs/configure.log
          make O="${OUT_DIR}" ARCH="${ARCH}" CROSS_COMPILE="${CROSS_COMPILE}" CLANG_TRIPLE="${CLANG_TRIPLE}" olddefconfig 2>&1 | tee -a logs/configure.log
          grep -E 'CONFIG_KSU|CONFIG_KALLSYMS|CONFIG_KSU_SUSFS' "${OUT_DIR}/.config" | tee logs/kernel-config-ksu-susfs.log || true

      - name: Build kernel
        run: |
          set -euo pipefail
          JOBS_INPUT='${{ github.event.inputs.jobs }}'
          if [ "${JOBS_INPUT}" = '$(nproc)' ] || [ -z "${JOBS_INPUT}" ]; then JOBS="$(nproc)"; else JOBS="${JOBS_INPUT}"; fi
          echo "Starting compilation with -j${JOBS}" | tee logs/build.log
          make -j"${JOBS}" O="${OUT_DIR}" ARCH="${ARCH}" LLVM=1 LLVM_IAS=1 CROSS_COMPILE="${CROSS_COMPILE}" CLANG_TRIPLE="${CLANG_TRIPLE}" 2>&1 | tee -a logs/build.log

      - name: Extract build error tail
        if: always()
        run: |
          mkdir -p logs
          echo "===== build.log tail 300 =====" > logs/build-tail.log
          tail -300 logs/build.log >> logs/build-tail.log 2>/dev/null || true
          echo "===== errors/warnings grep =====" > logs/build-errors.log
          grep -nEi "error:|undefined reference|No rule to make target|fatal error|ld.lld|make\\[[0-9]+\\]: \\*\\*\\*|OFFICIAL FAIL-FAST|SUSFS pre-compile check failed|manual hook script emitted" logs/*.log >> logs/build-errors.log 2>/dev/null || true

      - name: Create compact debug summary
        if: always()
        run: |
          set +e
          SUMMARY="logs/debug-summary.log"; : > "$SUMMARY"
          add_section(){ title="$1"; file="$2"; { echo; echo "================================================================"; echo "===== $title"; echo "===== file: $file"; echo "================================================================"; [ -f "$file" ] && cat "$file" || echo "[MISSING] $file"; } >> "$SUMMARY"; }
          {
            echo "ReSukiSU manual SUSFS official debug summary"
            echo "Generated at UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "GitHub run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "DEFCONFIG=${DEFCONFIG}"
            echo "SUSFS_REF=${SUSFS_REF}"
            echo "KSU_DIR=${KSU_DIR:-}"
          } >> "$SUMMARY"
          add_section environment logs/environment.log
          add_section "ReSukiSU setup" logs/resukisu-setup.log
          add_section "SUSFS tree" logs/susfs-tree.log
          add_section "copy SUSFS files" logs/copy-susfs-files.log
          add_section "SUSFS pre-compile check" logs/susfs-precompile-check.log
          add_section "SUSFS patch check output" logs/debug/susfs-patch-check-output.log
          add_section "SUSFS source context" logs/debug/susfs-source-context.log
          add_section "SUSFS all hunk source contexts" logs/debug/susfs-all-hunk-source-contexts.log
          add_section "SUSFS patch hunks" logs/debug/susfs-patch-hunks.log
          add_section "manual hook" logs/apply-manual-hooks.log
          add_section "manual hook validation" logs/manual-hook-validation.log
          add_section "integration status" logs/integration-status.log
          add_section configure logs/configure.log
          add_section "build errors" logs/build-errors.log
          add_section "build tail" logs/build-tail.log
          { echo; echo "===== reject files ====="; find . -name '*.rej' -type f | sort; } >> "$SUMMARY"

      - name: Collect outputs
        if: always()
        run: |
          set +e
          mkdir -p artifacts
          find "${OUT_DIR}" -type f \( -name 'Image' -o -name 'Image.gz' -o -name 'Image.gz-dtb' -o -name '*.dtb' -o -name '*.dtbo' -o -name '*.ko' \) -exec cp -t artifacts {} + 2>/dev/null || true

      - name: Upload 3 debug files only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: copilot-debug-3files-resukisu-manual-susfs-${{ github.run_number }}
          path: |
            logs/debug-summary.log
            logs/build-errors.log
            logs/build-tail.log
          if-no-files-found: warn

      - name: Upload kernel artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-artifacts-resukisu-manual-susfs-${{ github.run_number }}
          path: artifacts/**
          if-no-files-found: warn

      - name: Upload full out directory on failure
        if: failure() && github.event.inputs.upload_full_out == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: out-debug-resukisu-manual-susfs-${{ github.run_number }}
          path: out/**
          if-no-files-found: warn
