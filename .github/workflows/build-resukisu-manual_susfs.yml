name: ReSukiSU Manual SUSFS Phase2B Full Debug
'on':
  workflow_dispatch:
    inputs:
      defconfig:
        required: true
        default: lisa_defconfig
      susfs_ref:
        required: false
        default: kernel-5.4
      manual_hook_script:
        required: true
        default: .github/scripts/apply_resukisu_manual_hooks_1_fixed.py
      jobs:
        required: true
        default: $(nproc)
permissions:
  contents: read
env:
  ARCH: arm64
  SUBARCH: arm64
  OUT_DIR: out
  DEFCONFIG: lisa_defconfig
  SUSFS_REPO: https://github.com/ShirkNeko/susfs4ksu.git
  SUSFS_REF: kernel-5.4
  MANUAL_HOOK_SCRIPT: .github/scripts/apply_resukisu_manual_hooks_1_fixed.py
  CROSS_COMPILE: aarch64-linux-gnu-
  CLANG_TRIPLE: aarch64-linux-gnu-
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 1
    - name: Normalize inputs
      run: |
        set -euo pipefail
        echo "DEFCONFIG=${{ github.event.inputs.defconfig }}" >> "$GITHUB_ENV"
        echo "SUSFS_REF=${{ github.event.inputs.susfs_ref }}" >> "$GITHUB_ENV"
        echo "MANUAL_HOOK_SCRIPT=${{ github.event.inputs.manual_hook_script }}" >> "$GITHUB_ENV"
    - name: Prepare tools
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex git git-lfs gnupg libelf-dev libssl-dev lld llvm make openssl python3 python3-pip rsync unzip wget zip zstd gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
        mkdir -p logs artifacts logs/debug .github/scripts
        echo "DATE_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee logs/environment.log
        echo "GITHUB_RUN=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" | tee -a logs/environment.log
        echo "DEFCONFIG=$DEFCONFIG" | tee -a logs/environment.log
        echo "SUSFS_REF=$SUSFS_REF" | tee -a logs/environment.log
    - name: Add ReSukiSU source
      run: |
        set -euo pipefail
        echo "Running ReSukiSU setup" | tee logs/resukisu-setup.log
        curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash 2>&1 | tee -a logs/resukisu-setup.log
        KSU_DIR=""; [ -d KernelSU ] && KSU_DIR="KernelSU"; [ -z "$KSU_DIR" ] && [ -d drivers/kernelsu ] && KSU_DIR="drivers/kernelsu"; [ -z "$KSU_DIR" ] && [ -d kernel/KernelSU ] && KSU_DIR="kernel/KernelSU"
        [ -n "$KSU_DIR" ] || { echo "ERROR: KernelSU dir not found" | tee logs/resukisu-commit.log; exit 1; }
        echo "KSU_DIR=$KSU_DIR" | tee logs/resukisu-commit.log
        echo "KSU_DIR=$KSU_DIR" >> "$GITHUB_ENV"
        git -C "$KSU_DIR" rev-parse HEAD | tee -a logs/resukisu-commit.log || true
        git -C "$KSU_DIR" log -1 --oneline | tee -a logs/resukisu-commit.log || true
    - name: Clone and copy SUSFS files
      run: |
        set -euo pipefail
        rm -rf susfs-src
        if git ls-remote --exit-code --heads "$SUSFS_REPO" "$SUSFS_REF" >/dev/null 2>&1; then
          git clone --depth 1 --branch "$SUSFS_REF" "$SUSFS_REPO" susfs-src 2>&1 | tee logs/susfs-clone.log
        else
          git clone --depth 1 "$SUSFS_REPO" susfs-src 2>&1 | tee logs/susfs-clone.log
          git -C susfs-src fetch --unshallow 2>/dev/null || true
          git -C susfs-src fetch --all --tags --force || true
          git -C susfs-src checkout "$SUSFS_REF" 2>&1 | tee -a logs/susfs-clone.log
        fi
        { git -C susfs-src rev-parse HEAD; git -C susfs-src log -1 --oneline; find susfs-src/kernel_patches -maxdepth 4 -type f | sort; } | tee logs/susfs-tree.log
        python3 - <<'PY' 2>&1 | tee logs/copy-susfs-files.log
        from pathlib import Path
        import shutil
        root=Path.cwd(); srcroot=root/'susfs-src/kernel_patches'
        for rel in ['fs/susfs.c','include/linux/susfs.h','include/linux/susfs_def.h','fs/sus_su.c','include/linux/sus_su.h']:
            src=srcroot/rel; dst=root/rel
            if src.exists():
                dst.parent.mkdir(parents=True, exist_ok=True); shutil.copy2(src,dst); print(f'[OK] copied {rel}')
            elif rel in ['fs/susfs.c','include/linux/susfs.h','include/linux/susfs_def.h']:
                raise SystemExit(f'[ERROR] missing required {rel}')
        print('[OK] not using KernelSU/10_enable_susfs_for_ksu.patch')
        PY
    - name: Apply SUSFS compile-probe ports
      run: |
        set -euo pipefail
        python3 - <<'PY' 2>&1 | tee logs/port-susfs-compile-probe.log

        from pathlib import Path
        import re
        root=Path.cwd()
        def read(rel):
            p=root/rel
            if not p.exists(): raise SystemExit(f'[ERROR] missing {rel}')
            return p.read_text(errors='ignore')
        def write(rel,text):
            (root/rel).write_text(text); print(f'[OK] updated {rel}')
        def after(text,anchor,insert,marker):
            if marker in text: return text
            pos=text.find(anchor)
            if pos<0: raise SystemExit(f'[ERROR] anchor not found: {anchor[:100]!r}')
            return text[:pos+len(anchor)] + insert + text[pos+len(anchor):]
        def before(text,anchor,insert,marker):
            if marker in text: return text
            pos=text.find(anchor)
            if pos<0: raise SystemExit(f'[ERROR] anchor not found: {anchor[:100]!r}')
            return text[:pos] + insert + text[pos:]
        def rep(text,old,new,marker):
            if marker in text: return text
            if old not in text: raise SystemExit(f'[ERROR] target not found: {marker}')
            return text.replace(old,new,1)

        text=read('fs/Makefile')
        if 'obj-$(CONFIG_KSU_SUSFS) += susfs.o' not in text:
            text=after(text,'\t\tfs_types.o fs_context.o fs_parser.o fsopen.o\n','\nobj-$(CONFIG_KSU_SUSFS) += susfs.o\n','obj-$(CONFIG_KSU_SUSFS) += susfs.o')
        write('fs/Makefile',text)

        text=read('fs/proc/task_mmu.c')
        if '#include <linux/susfs_def.h>' not in text:
            anchor='#include <linux/ctype.h>\n' if '#include <linux/ctype.h>\n' in text else '#include <linux/mm_inline.h>\n'
            text=after(text,anchor,'#ifdef CONFIG_KSU_SUSFS_SUS_KSTAT\n#include <linux/susfs_def.h>\n#endif\n','#include <linux/susfs_def.h>')
        if 'susfs_sus_ino_for_show_map_vma' not in text:
            text=before(text,'static void\nshow_map_vma','#ifdef CONFIG_KSU_SUSFS_SUS_KSTAT\nextern void susfs_sus_ino_for_show_map_vma(unsigned long ino, dev_t *out_dev, unsigned long *out_ino);\n#endif\n\n','susfs_sus_ino_for_show_map_vma')
        old='\tif (file) {\n\t\tstruct inode *inode = file_inode(vma->vm_file);\n\t\tdev = inode->i_sb->s_dev;\n\t\tino = inode->i_ino;\n\t\tpgoff = ((loff_t)vma->vm_pgoff) << PAGE_SHIFT;\n\t}\n'
        new='\tif (file) {\n\t\tstruct inode *inode = file_inode(vma->vm_file);\n#ifdef CONFIG_KSU_SUSFS_SUS_KSTAT\n\t\t/* SUSFS: spoof map VMA inode/dev for SUS_KSTAT */\n\t\tif (unlikely(inode->i_state & INODE_STATE_SUS_KSTAT)) {\n\t\t\tsusfs_sus_ino_for_show_map_vma(inode->i_ino, &dev, &ino);\n\t\t\tgoto susfs_skip_orig_map_vma_stat;\n\t\t}\n#endif\n\t\tdev = inode->i_sb->s_dev;\n\t\tino = inode->i_ino;\n#ifdef CONFIG_KSU_SUSFS_SUS_KSTAT\nsusfs_skip_orig_map_vma_stat:\n#endif\n\t\tpgoff = ((loff_t)vma->vm_pgoff) << PAGE_SHIFT;\n\t}\n'
        text=rep(text,old,new,'SUSFS: spoof map VMA inode/dev for SUS_KSTAT')
        write('fs/proc/task_mmu.c',text)

        text=read('fs/notify/fdinfo.c')
        if '#include <linux/susfs_def.h>' not in text:
            text=after(text,'#include <linux/exportfs.h>\n','#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n#include <linux/susfs_def.h>\n#endif\n','#include <linux/susfs_def.h>')
        if 'SUSFS: show original inode information for SUS_KSTAT fdinfo' not in text:
            text=after(text,'\tinode = igrab(fsnotify_conn_inode(mark->connector));\n\tif (inode) {\n','#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n\t\t/* SUSFS: show original inode information for SUS_KSTAT fdinfo */\n#endif\n','SUSFS: show original inode information for SUS_KSTAT fdinfo')
        write('fs/notify/fdinfo.c',text)

        text=read('fs/namei.c')
        if '#include <linux/susfs_def.h>' not in text:
            text=after(text,'#include <linux/uaccess.h>\n','#if defined(CONFIG_KSU_SUSFS_SUS_PATH) || defined(CONFIG_KSU_SUSFS_OPEN_REDIRECT)\n#include <linux/susfs_def.h>\n#endif\n','#include <linux/susfs_def.h>')
        if 'susfs_namei_phase2a_marker' not in text:
            text=after(text,'#include "mount.h"\n','\nstatic const bool susfs_namei_phase2a_marker = true;\nstatic const bool susfs_phase2b_compile_probe_marker_namei = true;\n','susfs_namei_phase2a_marker')
        elif 'susfs_phase2b_compile_probe_marker_namei' not in text:
            text=after(text,'static const bool susfs_namei_phase2a_marker = true;\n','static const bool susfs_phase2b_compile_probe_marker_namei = true;\n','susfs_phase2b_compile_probe_marker_namei')
        write('fs/namei.c',text)

        text=read('fs/readdir.c')
        if '#include <linux/susfs_def.h>' not in text:
            text=after(text,'#include <linux/uaccess.h>\n','#ifdef CONFIG_KSU_SUSFS_SUS_PATH\n#include <linux/susfs_def.h>\n#endif\n','#include <linux/susfs_def.h>')
        if 'susfs_is_inode_sus_path' not in text:
            ext='\n#ifdef CONFIG_KSU_SUSFS_SUS_PATH\nextern bool susfs_is_inode_sus_path(struct inode *inode);\nextern bool susfs_is_base_dentry_android_data_dir(struct dentry *dentry);\nextern bool susfs_is_base_dentry_sdcard_dir(struct dentry *dentry);\nextern bool susfs_is_sus_android_data_d_name_found(const char *d_name);\nextern bool susfs_is_sus_sdcard_d_name_found(const char *d_name);\n#endif\n'
            text=after(text,'#include <asm/unaligned.h>\n',ext,'susfs_is_inode_sus_path')
        def add_fields(src,name):
            marker='susfs_phase2a_'+name+'_fields'
            if marker in src: return src
            m=re.search(r'(struct\s+'+re.escape(name)+r'\s*\{.*?)(\n\};)',src,re.S)
            if not m: return src
            fields='\n#ifdef CONFIG_KSU_SUSFS_SUS_PATH\n\t/* '+marker+' */\n\tstruct super_block *susfs_sb;\n\tbool susfs_is_android_data_root;\n\tbool susfs_is_sdcard_root;\n#endif'
            return src[:m.start(2)]+fields+src[m.start(2):]
        for n in ['readdir_callback','getdents_callback','getdents_callback64','compat_readdir_callback','compat_getdents_callback']:
            text=add_fields(text,n)
        if 'susfs_phase2a_readdir_callback_fields' not in text: raise SystemExit('[ERROR] readdir marker missing')
        write('fs/readdir.c',text)

        text=read('fs/namespace.c')
        if '#include <linux/susfs_def.h>' not in text:
            text=after(text,'#include <linux/shmem_fs.h>\n','#if defined(CONFIG_KSU_SUSFS_SUS_MOUNT) || defined(CONFIG_KSU_SUSFS_TRY_UMOUNT)\n#include <linux/susfs_def.h>\n#endif\n','#include <linux/susfs_def.h>')
        helper="\n\n#ifdef CONFIG_KSU_SUSFS_TRY_UMOUNT\nextern void susfs_try_umount_all(uid_t uid);\nvoid susfs_run_try_umount_for_current_mnt_ns(void)\n{\n\tsusfs_try_umount_all(current_uid().val);\n}\n#endif\n\n#ifdef CONFIG_KSU_SUSFS\nbool susfs_is_mnt_devname_ksu(struct path *path)\n{\n\tstruct mount *mnt;\n\tif (!path || !path->mnt)\n\t\treturn false;\n\tmnt = real_mount(path->mnt);\n\treturn mnt && mnt->mnt_devname && !strcmp(mnt->mnt_devname, \"KSU\");\n}\n#endif\n\nstatic const bool susfs_phase2b_compile_probe_marker_namespace = true;\n"
        if 'susfs_phase2b_compile_probe_marker_namespace' not in text:
            text=text.rstrip()+helper+'\n'
        write('fs/namespace.c',text)
        print('[OK] Phase1 + Phase2A + Phase2B compile-probe ports completed')

        PY
    - name: Verify manual ports and no rejects
      run: |
        set -euo pipefail
        python3 - <<'PY' 2>&1 | tee logs/verify-susfs-manual-ports.log
        from pathlib import Path
        root=Path.cwd()
        markers={'fs/Makefile':'obj-$(CONFIG_KSU_SUSFS) += susfs.o','fs/proc/task_mmu.c':'SUSFS: spoof map VMA inode/dev for SUS_KSTAT','fs/readdir.c':'susfs_phase2a_readdir_callback_fields','fs/namei.c':'susfs_phase2b_compile_probe_marker_namei','fs/namespace.c':'susfs_phase2b_compile_probe_marker_namespace'}
        failed=False
        for rel,marker in markers.items():
            p=root/rel
            if p.exists() and marker in p.read_text(errors='ignore'):
                print(f'[OK] marker verified in {rel}: {marker}')
            else:
                print(f'[ERROR] missing marker in {rel}: {marker}'); failed=True
        rejects=sorted(str(p) for p in root.rglob('*.rej'))
        if rejects:
            print('[ERROR] reject files found:'); print('\n'.join(rejects)); failed=True
        raise SystemExit(1 if failed else 0)
        PY
    - name: Apply existing manual hook script
      run: |
        set -euo pipefail
        if [ ! -f "$MANUAL_HOOK_SCRIPT" ]; then echo "ERROR: manual hook script not found: $MANUAL_HOOK_SCRIPT" | tee logs/apply-manual-hooks.log; exit 1; fi
        python3 "$MANUAL_HOOK_SCRIPT" "$DEFCONFIG" 2>&1 | tee logs/apply-manual-hooks.log
    - name: Patch missing ReSukiSU setresuid hook
      run: |
        set -euo pipefail
        python3 - <<'PY' 2>&1 | tee logs/patch-setresuid-hook.log
        from pathlib import Path
        p=Path('kernel/sys.c')
        if not p.exists(): raise SystemExit('[ERROR] missing kernel/sys.c')
        text=p.read_text(errors='ignore')
        proto='#ifdef CONFIG_KSU_MANUAL_HOOK\n__attribute__((hot))\nextern int ksu_handle_setresuid(uid_t ruid, uid_t euid, uid_t suid);\n#endif\n\n'
        call='#ifdef CONFIG_KSU_MANUAL_HOOK\n\tksu_handle_setresuid(ruid, euid, suid);\n#endif\n'
        if 'ksu_handle_setresuid' not in text:
            marker='SYSCALL_DEFINE3(setresuid'
            pos=text.find(marker)
            if pos<0: raise SystemExit('[ERROR] SYSCALL_DEFINE3(setresuid...) not found in kernel/sys.c')
            text=text[:pos]+proto+text[pos:]
            pos=text.find(marker); body=text.find('{',pos)
            anchors=['\tkruid = make_kuid(ns, ruid);','\tkeuid = make_kuid(ns, euid);','\told = current_cred();']
            insert_at=-1
            for a in anchors:
                insert_at=text.find(a,body)
                if insert_at>=0: break
            if insert_at<0: raise SystemExit('[ERROR] safe insertion anchor not found in setresuid')
            text=text[:insert_at]+call+text[insert_at:]
            p.write_text(text)
            print('[OK] patched kernel/sys.c with ksu_handle_setresuid hook')
        else:
            print('[SKIP] ksu_handle_setresuid already present in kernel/sys.c')

        PY
    - name: Enable ReSukiSU + SUSFS configs
      run: |
        set -euo pipefail
        python3 - <<'PY' 2>&1 | tee logs/enable-resukisu-susfs-configs.log
        from pathlib import Path
        import os
        root=Path.cwd(); defconfig=os.environ.get('DEFCONFIG','lisa_defconfig')
        path=next((p for p in [root/'arch/arm64/configs'/defconfig, root/'arch/arm64/configs/vendor'/defconfig] if p.exists()), None)
        if not path: raise SystemExit(f'[ERROR] defconfig not found: {defconfig}')
        text=path.read_text(errors='ignore')
        def setcfg(text,key):
            out=[]; seen=False
            for line in text.splitlines():
                if line.startswith(key+'=') or line.startswith('# '+key+' is not set'):
                    if not seen: out.append(key+'=y'); seen=True
                    continue
                out.append(line)
            if not seen: out.append(key+'=y')
            return '\n'.join(out)+'\n'
        for key in ['CONFIG_KSU','CONFIG_KSU_MANUAL_HOOK','CONFIG_KALLSYMS','CONFIG_KALLSYMS_ALL','CONFIG_KSU_SUSFS','CONFIG_KSU_SUSFS_SUS_PATH','CONFIG_KSU_SUSFS_SUS_MOUNT','CONFIG_KSU_SUSFS_SUS_KSTAT','CONFIG_KSU_SUSFS_TRY_UMOUNT','CONFIG_KSU_SUSFS_SPOOF_UNAME','CONFIG_KSU_SUSFS_ENABLE_LOG','CONFIG_KSU_SUSFS_OPEN_REDIRECT']:
            text=setcfg(text,key)
        path.write_text(text); print(f'[OK] enabled configs in {path}')

        PY
    - name: Configure kernel
      run: |
        set -euo pipefail
        make O="$OUT_DIR" ARCH="$ARCH" CROSS_COMPILE="$CROSS_COMPILE" CLANG_TRIPLE="$CLANG_TRIPLE" "$DEFCONFIG" 2>&1 | tee logs/configure.log
        make O="$OUT_DIR" ARCH="$ARCH" CROSS_COMPILE="$CROSS_COMPILE" CLANG_TRIPLE="$CLANG_TRIPLE" olddefconfig 2>&1 | tee -a logs/configure.log
        grep -E 'CONFIG_KSU|CONFIG_KALLSYMS|CONFIG_KSU_SUSFS' "$OUT_DIR/.config" | tee logs/kernel-config-ksu-susfs.log || true
    - name: Build kernel with full log
      run: |
        set -euo pipefail
        JOBS_INPUT='${{ github.event.inputs.jobs }}'
        if [ "$JOBS_INPUT" = '$(nproc)' ] || [ -z "$JOBS_INPUT" ]; then JOBS="$(nproc)"; else JOBS="$JOBS_INPUT"; fi
        echo "Starting compilation with -j$JOBS" | tee logs/build.log
        make -j"$JOBS" O="$OUT_DIR" ARCH="$ARCH" LLVM=1 LLVM_IAS=1 CROSS_COMPILE="$CROSS_COMPILE" CLANG_TRIPLE="$CLANG_TRIPLE" 2>&1 | tee -a logs/build.log
    - name: Extract debug logs from full build log
      if: always()
      run: |
        mkdir -p logs
        echo "===== build.log tail 1000 =====" > logs/build-tail.log
        tail -1000 logs/build.log >> logs/build-tail.log 2>/dev/null || true
        echo "===== build.log head 500 =====" > logs/build-head.log
        head -500 logs/build.log >> logs/build-head.log 2>/dev/null || true
        echo "===== errors/warnings grep =====" > logs/build-errors.log
        grep -nEi "error:|undefined reference|No rule to make target|fatal error|ld.lld|make\[[0-9]+\]: \*\*\*|manual hook script emitted|drivers/kernelsu|KernelSU|kernelsu|modbuiltin|inline_hook_check|You lost|No such file|not found|recipe for target|Stop\." logs/build.log logs/*.log >> logs/build-errors.log 2>/dev/null || true
        python3 - <<'PY' 2>/dev/null || true
        from pathlib import Path
        import re
        log=Path('logs/build.log'); out=Path('logs/build-error-context.log')
        pat=re.compile(r'error:|undefined reference|No rule to make target|fatal error|ld\.lld|make\[[0-9]+\]: \*\*\*|drivers/kernelsu|KernelSU|kernelsu|modbuiltin|inline_hook_check|You lost|No such file|not found|recipe for target|Stop\.', re.I)
        if not log.exists(): out.write_text('[MISSING] logs/build.log\n'); raise SystemExit(0)
        lines=log.read_text(errors='ignore').splitlines(); hits=[i for i,l in enumerate(lines) if pat.search(l)]
        ranges=[]
        for idx in hits[:80]:
            s=max(0,idx-100); e=min(len(lines),idx+101)
            if ranges and s<=ranges[-1][1]: ranges[-1]=(ranges[-1][0], max(ranges[-1][1], e))
            else: ranges.append((s,e))
        chunks=[]
        for s,e in ranges:
            chunks.append(f'===== build.log context lines {s+1}-{e} of {len(lines)} =====')
            for n in range(s,e): chunks.append(f'{n+1:05d}: {lines[n]}')
        out.write_text('\n'.join(chunks) if chunks else '[NO PATTERN MATCHES]\n', errors='ignore')
        PY
    - name: Create full debug summary index
      if: always()
      run: |
        set +e
        SUMMARY="logs/debug-summary.log"; : > "$SUMMARY"
        add(){ title="$1"; file="$2"; { echo; echo "================================================================"; echo "===== $title"; echo "===== file: $file"; echo "================================================================"; [ -f "$file" ] && cat "$file" || echo "[MISSING] $file"; } >> "$SUMMARY"; }
        { echo "ReSukiSU SUSFS Phase2B full debug summary"; echo "Generated UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)"; echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"; } >> "$SUMMARY"
        for pair in "environment logs/environment.log" "ReSukiSU_setup logs/resukisu-setup.log" "SUSFS_tree logs/susfs-tree.log" "copy_SUSFS logs/copy-susfs-files.log" "manual_ports logs/port-susfs-compile-probe.log" "verify_ports logs/verify-susfs-manual-ports.log" "manual_hooks logs/apply-manual-hooks.log" "setresuid_hook logs/patch-setresuid-hook.log" "configure logs/configure.log" "kernel_config logs/kernel-config-ksu-susfs.log" "build_errors logs/build-errors.log" "build_error_context logs/build-error-context.log" "build_head logs/build-head.log" "build_tail logs/build-tail.log"; do
          title="${pair%% *}"; file="${pair#* }"; add "$title" "$file"
        done
        { echo; echo "===== reject files ====="; find . -name '*.rej' -type f | sort; } >> "$SUMMARY"
    - name: Collect kernel outputs
      if: always()
      run: |
        set +e
        mkdir -p artifacts
        find "$OUT_DIR" -type f \( -name 'Image' -o -name 'Image.gz' -o -name 'Image.gz-dtb' -o -name '*.dtb' -o -name '*.dtbo' -o -name '*.ko' \) -exec cp -t artifacts {} + 2>/dev/null || true
    - name: Upload full compile logs for debug
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: full-debug-logs-resukisu-phase2b-${{ github.run_number }}
        path: |
          logs/**
          out/.config
        if-no-files-found: warn
    - name: Upload kernel artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: kernel-artifacts-resukisu-phase2b-${{ github.run_number }}
        path: artifacts/**
        if-no-files-found: warn
