name: ReSukiSU SUSFS Phase2B Hunks Only

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: Kernel defconfig
        required: true
        default: lisa_defconfig
      susfs_ref:
        description: ShirkNeko SUSFS ref/branch
        required: false
        default: kernel-5.4

permissions:
  contents: read

env:
  ARCH: arm64
  DEFCONFIG: lisa_defconfig
  SUSFS_REPO: https://github.com/ShirkNeko/susfs4ksu.git
  SUSFS_REF: kernel-5.4

jobs:
  context:
    name: Export Phase2B hunks only
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Normalize inputs
        run: |
          set -euo pipefail
          echo "DEFCONFIG=${{ github.event.inputs.defconfig }}" >> "$GITHUB_ENV"
          echo "SUSFS_REF=${{ github.event.inputs.susfs_ref }}" >> "$GITHUB_ENV"

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install minimal tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y git python3
          mkdir -p logs/debug

      - name: Clone ShirkNeko SUSFS
        run: |
          set -euo pipefail
          rm -rf susfs-src
          if git ls-remote --exit-code --heads "$SUSFS_REPO" "$SUSFS_REF" >/dev/null 2>&1; then
            git clone --depth 1 --branch "$SUSFS_REF" "$SUSFS_REPO" susfs-src
          else
            git clone --depth 1 "$SUSFS_REPO" susfs-src
            git -C susfs-src fetch --unshallow 2>/dev/null || true
            git -C susfs-src fetch --all --tags --force || true
            git -C susfs-src checkout "$SUSFS_REF"
          fi
          {
            echo "SUSFS_HEAD=$(git -C susfs-src rev-parse HEAD || true)"
            git -C susfs-src log -1 --oneline || true
          } | tee logs/susfs-tree.log

      - name: Export only remaining namei namespace hunks and compact source anchors
        run: |
          set +e
          python3 - <<'PY' 2>&1 | tee logs/phase2b-hunks-only.log
          from pathlib import Path
          import re
          root = Path.cwd()
          patch_path = root / 'susfs-src/kernel_patches/50_add_susfs_in_kernel-5.4.patch'
          wanted = ['fs/namei.c', 'fs/namespace.c']
          text = patch_path.read_text(errors='ignore') if patch_path.exists() else ''
          out = []
          anchors = []
          out.append('===== PHASE2B PATCH HUNKS ONLY =====')
          out.append('This file intentionally contains only fs/namei.c and fs/namespace.c patch sections.')
          for f in wanted:
              m = re.search(r'(^diff --git a/' + re.escape(f) + r' b/' + re.escape(f) + r'\n.*?)(?=^diff --git |\Z)', text, re.M | re.S)
              sec = m.group(1) if m else ''
              out.append('\n===== PATCH SECTION FOR ' + f + ' =====')
              out.append(sec if sec else '[MISSING PATCH SECTION]')
              if sec:
                  for hm in re.finditer(r'^@@ -(?P<old>\d+)(?:,(?P<oldn>\d+))? \+(?P<new>\d+)(?:,(?P<newn>\d+))? @@(?P<title>.*)$', sec, re.M):
                      anchors.append((f, int(hm.group('new')), hm.group(0)))
          (root/'logs/debug/phase2b-patch-hunks-only.log').write_text('\n'.join(out), errors='ignore')
          ctx=[]
          ctx.append('===== PHASE2B COMPACT SOURCE ANCHORS =====')
          for f,line,hdr in anchors:
              p=root/f
              ctx.append('\n===== ' + f + ' :: ' + hdr + ' =====')
              if not p.exists():
                  ctx.append('[MISSING SOURCE FILE]')
                  continue
              lines=p.read_text(errors='ignore').splitlines()
              start=max(1,line-18); end=min(len(lines),line+30)
              for i in range(start,end+1):
                  ctx.append(f'{i:05d}: {lines[i-1]}')
          (root/'logs/debug/phase2b-source-anchors-compact.log').write_text('\n'.join(ctx), errors='ignore')
          print('[OK] exported logs/debug/phase2b-patch-hunks-only.log')
          print('[OK] exported logs/debug/phase2b-source-anchors-compact.log')
          if not text:
              raise SystemExit(1)
          PY
          exit ${PIPESTATUS[0]}

      - name: Create tiny debug summary
        if: always()
        run: |
          set +e
          SUMMARY=logs/debug-summary.log
          : > "$SUMMARY"
          add(){ title="$1"; file="$2"; { echo; echo "================================================================"; echo "===== $title"; echo "===== file: $file"; echo "================================================================"; [ -f "$file" ] && cat "$file" || echo "[MISSING] $file"; } >> "$SUMMARY"; }
          echo "Phase2B hunks-only debug summary" >> "$SUMMARY"
          echo "Generated UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$SUMMARY"
          echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >> "$SUMMARY"
          add "SUSFS tree" logs/susfs-tree.log
          add "Phase2B patch hunks only" logs/debug/phase2b-patch-hunks-only.log
          add "Phase2B source anchors compact" logs/debug/phase2b-source-anchors-compact.log
          echo "===== errors/warnings grep =====" > logs/build-errors.log
          grep -nEi "error:|fatal|MISSING|FAIL" logs/*.log logs/debug/*.log >> logs/build-errors.log 2>/dev/null || true
          echo "===== build.log tail 300 =====" > logs/build-tail.log

      - name: Upload 3 debug files only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: copilot-debug-3files-phase2b-hunks-only-${{ github.run_number }}
          path: |
            logs/debug-summary.log
            logs/build-errors.log
            logs/build-tail.log
          if-no-files-found: warn
