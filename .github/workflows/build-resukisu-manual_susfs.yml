          ZGV2bmFtZSAmJiAhc3RyY21wKG1udC0+bW50X2Rldm5hbWUsIFwiS1NVXCIpOwp9CiNlbmRpZgoK
          c3RhdGljIGNvbnN0IGJvb2wgc3VzZnNfcGhhc2UyYl9jb21waWxlX3Byb2JlX21hcmtlcl9uYW1l
          c3BhY2UgPSB0cnVlOwoiIiIKaWYgJ3N1c2ZzX3BoYXNlMmJfY29tcGlsZV9wcm9iZV9tYXJrZXJf
          bmFtZXNwYWNlJyBub3QgaW4gdDoKICAgIHQ9dC5yc3RyaXAoKStoZWxwZXIrJ1xuJwp3cml0ZSgn
          ZnMvbmFtZXNwYWNlLmMnLHQpCnByaW50KCdbT0tdIFBoYXNlMSArIFBoYXNlMkEgKyBQaGFzZTJC
          IGNvbXBpbGUtcHJvYmUgcG9ydHMgY29tcGxldGVkJykK
          B64
          base64 -d /tmp/port_susfs_compile_probe.b64 > .github/scripts/port_susfs_compile_probe.py
          python3 .github/scripts/port_susfs_compile_probe.py 2>&1 | tee logs/port-susfs-compile-probe.log

      - name: Verify manual ports and no rejects
        run: |
          set -euo pipefail
          failed=0
          for pair in "fs/Makefile:obj-$(CONFIG_KSU_SUSFS) += susfs.o" "fs/proc/task_mmu.c:SUSFS: spoof map VMA inode/dev for SUS_KSTAT" "fs/readdir.c:susfs_phase2a_readdir_callback_fields" "fs/namei.c:susfs_phase2b_compile_probe_marker_namei" "fs/namespace.c:susfs_phase2b_compile_probe_marker_namespace"; do file="${pair%%:*}"; marker="${pair#*:}"; if grep -Fq "$marker" "$file"; then echo "[OK] marker verified in $file: $marker"; else echo "[ERROR] missing marker in $file: $marker"; failed=1; fi; done | tee logs/verify-susfs-manual-ports.log
          if find . -name '*.rej' -type f | grep -q .; then find . -name '*.rej' -type f | sort | tee -a logs/verify-susfs-manual-ports.log; failed=1; fi
          exit "$failed"

      - name: Apply existing manual hook script
        run: |
          set -euo pipefail
          if [ ! -f "$MANUAL_HOOK_SCRIPT" ]; then echo "ERROR: manual hook script not found: $MANUAL_HOOK_SCRIPT" | tee logs/apply-manual-hooks.log; exit 1; fi
          python3 "$MANUAL_HOOK_SCRIPT" "$DEFCONFIG" 2>&1 | tee logs/apply-manual-hooks.log

      - name: Enable ReSukiSU + SUSFS configs
        run: |
          set -euo pipefail
          python3 - <<'PY' 2>&1 | tee logs/enable-resukisu-susfs-configs.log
          from pathlib import Path
          import os
          root=Path.cwd(); defconfig=os.environ.get('DEFCONFIG','lisa_defconfig')
          paths=[root/'arch/arm64/configs'/defconfig, root/'arch/arm64/configs/vendor'/defconfig]
          path=next((p for p in paths if p.exists()),None)
          if not path: raise SystemExit(f'[ERROR] defconfig not found: {defconfig}')
          text=path.read_text(errors='ignore')
          def setcfg(text,key):
              out=[]; seen=False
              for line in text.splitlines():
                  if line.startswith(key+'=') or line.startswith('# '+key+' is not set'):
                      if not seen: out.append(key+'=y'); seen=True
                      continue
                  out.append(line)
              if not seen: out.append(key+'=y')
              return '\n'.join(out)+'\n'
          for key in ['CONFIG_KSU','CONFIG_KSU_MANUAL_HOOK','CONFIG_KALLSYMS','CONFIG_KALLSYMS_ALL','CONFIG_KSU_SUSFS','CONFIG_KSU_SUSFS_SUS_PATH','CONFIG_KSU_SUSFS_SUS_MOUNT','CONFIG_KSU_SUSFS_SUS_KSTAT','CONFIG_KSU_SUSFS_TRY_UMOUNT','CONFIG_KSU_SUSFS_SPOOF_UNAME','CONFIG_KSU_SUSFS_ENABLE_LOG','CONFIG_KSU_SUSFS_OPEN_REDIRECT']:
              text=setcfg(text,key)
          path.write_text(text); print(f'[OK] enabled configs in {path}')
          PY

      - name: Configure kernel
        run: |
          set -euo pipefail
          make O="$OUT_DIR" ARCH="$ARCH" CROSS_COMPILE="$CROSS_COMPILE" CLANG_TRIPLE="$CLANG_TRIPLE" "$DEFCONFIG" 2>&1 | tee logs/configure.log
          make O="$OUT_DIR" ARCH="$ARCH" CROSS_COMPILE="$CROSS_COMPILE" CLANG_TRIPLE="$CLANG_TRIPLE" olddefconfig 2>&1 | tee -a logs/configure.log
          grep -E 'CONFIG_KSU|CONFIG_KALLSYMS|CONFIG_KSU_SUSFS' "$OUT_DIR/.config" | tee logs/kernel-config-ksu-susfs.log || true

      - name: Build kernel
        run: |
          set -euo pipefail
          JOBS_INPUT='${{ github.event.inputs.jobs }}'
          if [ "$JOBS_INPUT" = '$(nproc)' ] || [ -z "$JOBS_INPUT" ]; then JOBS="$(nproc)"; else JOBS="$JOBS_INPUT"; fi
          echo "Starting compilation with -j$JOBS" | tee logs/build.log
          make -j"$JOBS" O="$OUT_DIR" ARCH="$ARCH" LLVM=1 LLVM_IAS=1 CROSS_COMPILE="$CROSS_COMPILE" CLANG_TRIPLE="$CLANG_TRIPLE" 2>&1 | tee -a logs/build.log

      - name: Extract build error tail
        if: always()
        run: |
          mkdir -p logs
          echo "===== build.log tail 300 =====" > logs/build-tail.log
          tail -300 logs/build.log >> logs/build-tail.log 2>/dev/null || true
          echo "===== errors/warnings grep =====" > logs/build-errors.log
          grep -nEi "error:|undefined reference|No rule to make target|fatal error|ld.lld|make\[[0-9]+\]: \*\*\*|manual hook script emitted" logs/*.log >> logs/build-errors.log 2>/dev/null || true

      - name: Create compact debug summary
        if: always()
        run: |
          set +e
          SUMMARY="logs/debug-summary.log"; : > "$SUMMARY"
          add(){ title="$1"; file="$2"; { echo; echo "================================================================"; echo "===== $title"; echo "===== file: $file"; echo "================================================================"; [ -f "$file" ] && cat "$file" || echo "[MISSING] $file"; } >> "$SUMMARY"; }
          { echo "ReSukiSU SUSFS Phase2B compile-probe debug summary"; echo "Generated UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)"; echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"; } >> "$SUMMARY"
          add environment logs/environment.log
          add "ReSukiSU setup" logs/resukisu-setup.log
          add "SUSFS tree" logs/susfs-tree.log
          add "copy SUSFS files" logs/copy-susfs-files.log
          add "manual SUSFS ports" logs/port-susfs-compile-probe.log
          add "verify SUSFS ports" logs/verify-susfs-manual-ports.log
          add "manual hooks" logs/apply-manual-hooks.log
          add configure logs/configure.log
          add "build errors" logs/build-errors.log
          add "build tail" logs/build-tail.log
          { echo; echo "===== reject files ====="; find . -name '*.rej' -type f | sort; } >> "$SUMMARY"

      - name: Collect outputs
        if: always()
        run: |
          set +e
          mkdir -p artifacts
          find "$OUT_DIR" -type f \( -name 'Image' -o -name 'Image.gz' -o -name 'Image.gz-dtb' -o -name '*.dtb' -o -name '*.dtbo' -o -name '*.ko' \) -exec cp -t artifacts {} + 2>/dev/null || true

      - name: Upload 3 debug files only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: copilot-debug-3files-resukisu-phase2b-compile-probe-${{ github.run_number }}
          path: |
            logs/debug-summary.log
            logs/build-errors.log
            logs/build-tail.log
          if-no-files-found: warn

      - name: Upload kernel artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-artifacts-resukisu-phase2b-compile-probe-${{ github.run_number }}
          path: artifacts/**
          if-no-files-found: warn
