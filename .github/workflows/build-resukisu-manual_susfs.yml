name: ReSukiSU Manual SUSFS Phase2B Compile Probe

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: Kernel defconfig
        required: true
        default: lisa_defconfig
      susfs_ref:
        description: ShirkNeko SUSFS ref/branch
        required: false
        default: kernel-5.4
      manual_hook_script:
        description: Existing manual hook script path
        required: true
        default: .github/scripts/apply_resukisu_manual_hooks_1_fixed.py
      jobs:
        description: Parallel build jobs
        required: true
        default: $(nproc)

permissions:
  contents: read

env:
  ARCH: arm64
  SUBARCH: arm64
  OUT_DIR: out
  DEFCONFIG: lisa_defconfig
  SUSFS_REPO: https://github.com/ShirkNeko/susfs4ksu.git
  SUSFS_REF: kernel-5.4
  MANUAL_HOOK_SCRIPT: .github/scripts/apply_resukisu_manual_hooks_1_fixed.py
  CROSS_COMPILE: aarch64-linux-gnu-
  CLANG_TRIPLE: aarch64-linux-gnu-

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Normalize inputs
        run: |
          set -euo pipefail
          echo "DEFCONFIG=${{ github.event.inputs.defconfig }}" >> "$GITHUB_ENV"
          echo "SUSFS_REF=${{ github.event.inputs.susfs_ref }}" >> "$GITHUB_ENV"
          echo "MANUAL_HOOK_SCRIPT=${{ github.event.inputs.manual_hook_script }}" >> "$GITHUB_ENV"

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Prepare dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git git-lfs gnupg libelf-dev libssl-dev lld llvm make openssl python3 python3-pip rsync unzip wget zip zstd gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
          mkdir -p logs artifacts logs/debug .github/scripts

      - name: Capture environment
        run: |
          set -euo pipefail
          { echo "DATE_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"; echo "GITHUB_RUN=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"; echo "DEFCONFIG=${DEFCONFIG}"; echo "SUSFS_REF=${SUSFS_REF}"; echo "MANUAL_HOOK_SCRIPT=${MANUAL_HOOK_SCRIPT}"; } | tee logs/environment.log

      - name: Add ReSukiSU source
        run: |
          set -euo pipefail
          echo "Running ReSukiSU setup" | tee logs/resukisu-setup.log
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash 2>&1 | tee -a logs/resukisu-setup.log
          KSU_DIR=""; [ -d KernelSU ] && KSU_DIR="KernelSU"; [ -z "$KSU_DIR" ] && [ -d drivers/kernelsu ] && KSU_DIR="drivers/kernelsu"; [ -z "$KSU_DIR" ] && [ -d kernel/KernelSU ] && KSU_DIR="kernel/KernelSU"
          if [ -z "$KSU_DIR" ]; then echo "ERROR: ReSukiSU/KernelSU directory not found" | tee logs/resukisu-commit.log; exit 1; fi
          echo "KSU_DIR=$KSU_DIR" | tee logs/resukisu-commit.log
          echo "KSU_DIR=$KSU_DIR" >> "$GITHUB_ENV"
          git -C "$KSU_DIR" rev-parse HEAD | tee -a logs/resukisu-commit.log || true
          git -C "$KSU_DIR" log -1 --oneline | tee -a logs/resukisu-commit.log || true

      - name: Clone ShirkNeko SUSFS
        run: |
          set -euo pipefail
          rm -rf susfs-src
          if git ls-remote --exit-code --heads "$SUSFS_REPO" "$SUSFS_REF" >/dev/null 2>&1; then git clone --depth 1 --branch "$SUSFS_REF" "$SUSFS_REPO" susfs-src 2>&1 | tee logs/susfs-clone.log; else git clone --depth 1 "$SUSFS_REPO" susfs-src 2>&1 | tee logs/susfs-clone.log; git -C susfs-src fetch --unshallow 2>/dev/null || true; git -C susfs-src fetch --all --tags --force || true; git -C susfs-src checkout "$SUSFS_REF" 2>&1 | tee -a logs/susfs-clone.log; fi
          { git -C susfs-src rev-parse HEAD || true; git -C susfs-src log -1 --oneline || true; find susfs-src/kernel_patches -maxdepth 4 -type f | sort || true; } | tee logs/susfs-tree.log

      - name: Copy SUSFS kernel implementation files only
        run: |
          set -euo pipefail
          python3 - <<'PY' 2>&1 | tee logs/copy-susfs-files.log
          from pathlib import Path
          import shutil
          root=Path.cwd(); srcroot=root/'susfs-src/kernel_patches'
          for rel in ['fs/susfs.c','include/linux/susfs.h','include/linux/susfs_def.h']:
              src=srcroot/rel; dst=root/rel
              if not src.exists(): raise SystemExit(f'[ERROR] missing required SUSFS file: {src}')
              dst.parent.mkdir(parents=True, exist_ok=True); shutil.copy2(src,dst); print(f'[OK] copied {src} -> {dst}')
          for rel in ['fs/sus_su.c','include/linux/sus_su.h']:
              src=srcroot/rel; dst=root/rel
              if src.exists(): dst.parent.mkdir(parents=True, exist_ok=True); shutil.copy2(src,dst); print(f'[OK] copied optional {src} -> {dst}')
          print('[OK] KernelSU/10_enable_susfs_for_ksu.patch is not copied, checked, applied, or used.')
          PY

