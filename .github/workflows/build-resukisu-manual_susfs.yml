name: Lisa ReSukiSU SUSFS Anchor Backport

on:
  workflow_dispatch:
    inputs:
      defconfig:
        required: true
        default: lisa_defconfig
      susfs_ref:
        required: false
        default: kernel-5.4
      manual_hook_script:
        required: true
        default: .github/scripts/apply_resukisu_manual_hooks_1_fixed.py
      jobs:
        required: true
        default: $(nproc)

permissions:
  contents: read

env:
  ARCH: arm64
  SUBARCH: arm64
  OUT_DIR: out
  DEFCONFIG: lisa_defconfig
  SUSFS_REPO: https://github.com/ShirkNeko/susfs4ksu.git
  SUSFS_REF: kernel-5.4
  MANUAL_HOOK_SCRIPT: .github/scripts/apply_resukisu_manual_hooks_1_fixed.py
  CROSS_COMPILE: aarch64-linux-gnu-
  CLANG_TRIPLE: aarch64-linux-gnu-

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Normalize inputs
        run: |
          set -euo pipefail
          echo "DEFCONFIG=${{ github.event.inputs.defconfig }}" >> "$GITHUB_ENV"
          echo "SUSFS_REF=${{ github.event.inputs.susfs_ref }}" >> "$GITHUB_ENV"
          echo "MANUAL_HOOK_SCRIPT=${{ github.event.inputs.manual_hook_script }}" >> "$GITHUB_ENV"

      - name: Prepare tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git git-lfs gnupg libelf-dev libssl-dev lld llvm make openssl python3 python3-pip rsync unzip wget zip zstd gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
          mkdir -p logs logs/debug artifacts .github/scripts
          echo "DATE_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee logs/environment.log
          echo "RUN=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" | tee -a logs/environment.log

      - name: Add ReSukiSU source builtin
        run: |
          set -euo pipefail
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash 2>&1 | tee logs/resukisu-setup.log
          KSU_DIR=""
          [ -d KernelSU ] && KSU_DIR="KernelSU"
          [ -z "$KSU_DIR" ] && [ -d drivers/kernelsu ] && KSU_DIR="drivers/kernelsu"
          [ -z "$KSU_DIR" ] && [ -d kernel/KernelSU ] && KSU_DIR="kernel/KernelSU"
          [ -n "$KSU_DIR" ] || { echo "ERROR: KernelSU dir not found" | tee logs/resukisu-commit.log; exit 1; }
          echo "KSU_DIR=$KSU_DIR" | tee logs/resukisu-commit.log
          echo "KSU_DIR=$KSU_DIR" >> "$GITHUB_ENV"
          git -C "$KSU_DIR" rev-parse HEAD | tee -a logs/resukisu-commit.log || true
          git -C "$KSU_DIR" log -1 --oneline | tee -a logs/resukisu-commit.log || true

      - name: Clone susfs4ksu and copy kernel-side base files
        run: |
          set -euo pipefail
          rm -rf susfs-src
          if git ls-remote --exit-code --heads "$SUSFS_REPO" "$SUSFS_REF" >/dev/null 2>&1; then
            git clone --depth 1 --branch "$SUSFS_REF" "$SUSFS_REPO" susfs-src 2>&1 | tee logs/susfs-clone.log
          else
            git clone --depth 1 "$SUSFS_REPO" susfs-src 2>&1 | tee logs/susfs-clone.log
            git -C susfs-src fetch --unshallow 2>/dev/null || true
            git -C susfs-src fetch --all --tags --force || true
            git -C susfs-src checkout "$SUSFS_REF" 2>&1 | tee -a logs/susfs-clone.log
          fi
          { git -C susfs-src rev-parse HEAD || true; git -C susfs-src log -1 --oneline || true; find susfs-src/kernel_patches -maxdepth 4 -type f | sort || true; } | tee logs/susfs-tree.log
          python3 - <<'PY' 2>&1 | tee logs/copy-susfs-files.log
          from pathlib import Path
          import shutil
          root = Path.cwd()
          srcroot = root / 'susfs-src' / 'kernel_patches'
          for rel in ['fs/susfs.c','include/linux/susfs.h','include/linux/susfs_def.h','fs/sus_su.c','include/linux/sus_su.h']:
              src = srcroot / rel
              dst = root / rel
              if src.exists():
                  dst.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(src, dst)
                  print(f'[OK] copied {rel}')
              elif rel in ['fs/susfs.c','include/linux/susfs.h','include/linux/susfs_def.h']:
                  raise SystemExit(f'[ERROR] missing required SUSFS source: {rel}')
          print('[OK] intentionally not applying 50_add_susfs_in_kernel-5.4.patch')
          print('[OK] intentionally not applying KernelSU/10_enable_susfs_for_ksu.patch')
          PY

      - name: Apply SUSFS lisa anchor backport instead of upstream patch
        run: |
          set -euo pipefail
          python3 .github/scripts/apply_susfs_backport_lisa.py 2>&1 | tee logs/apply-susfs-backport-lisa.log

      - name: Apply existing ReSukiSU manual hook script
        run: |
          set -euo pipefail
          if [ ! -f "$MANUAL_HOOK_SCRIPT" ]; then echo "ERROR: missing $MANUAL_HOOK_SCRIPT" | tee logs/apply-manual-hooks.log; exit 1; fi
          python3 "$MANUAL_HOOK_SCRIPT" "$DEFCONFIG" 2>&1 | tee logs/apply-manual-hooks.log

      - name: Apply missing ReSukiSU hooks by anchors
        run: |
          set -euo pipefail
          python3 .github/scripts/apply_resukisu_missing_hooks_lisa.py 2>&1 | tee logs/apply-resukisu-missing-hooks.log

      - name: Enable ReSukiSU and SUSFS configs
        run: |
          set -euo pipefail
          python3 - <<'PY' 2>&1 | tee logs/enable-configs.log
          from pathlib import Path
          import os
          root = Path.cwd()
          defconfig = os.environ.get('DEFCONFIG','lisa_defconfig')
          path = next((p for p in [root/'arch/arm64/configs'/defconfig, root/'arch/arm64/configs/vendor'/defconfig] if p.exists()), None)
          if not path:
              raise SystemExit(f'[ERROR] defconfig not found: {defconfig}')
          text = path.read_text(errors='ignore')
          def setcfg(text, key, value='y'):
              out=[]; seen=False
              for line in text.splitlines():
                  if line.startswith(key+'=') or line.startswith('# '+key+' is not set'):
                      if not seen:
                          out.append(f'{key}={value}'); seen=True
                      continue
                  out.append(line)
              if not seen:
                  out.append(f'{key}={value}')
              return '\n'.join(out)+'\n'
          for key in ['CONFIG_KSU','CONFIG_KSU_SUSFS','CONFIG_KSU_SUSFS_SUS_PATH','CONFIG_KSU_SUSFS_SUS_MOUNT','CONFIG_KSU_SUSFS_SUS_KSTAT','CONFIG_KSU_SUSFS_TRY_UMOUNT','CONFIG_KSU_SUSFS_SPOOF_UNAME','CONFIG_KSU_SUSFS_ENABLE_LOG','CONFIG_KSU_SUSFS_OPEN_REDIRECT']:
              text = setcfg(text, key)
          path.write_text(text)
          print(f'[OK] enabled configs in {path}')
          PY

      - name: Official build entry
        run: |
          set -euo pipefail
          JOBS_INPUT='${{ github.event.inputs.jobs }}'
          if [ "$JOBS_INPUT" = '$(nproc)' ] || [ -z "$JOBS_INPUT" ]; then JOBS="$(nproc)"; else JOBS="$JOBS_INPUT"; fi
          echo "JOBS=$JOBS" | tee logs/build.log
          if [ -x ./build.sh ]; then
            echo "[INFO] running ./build.sh" | tee -a logs/build.log
            JOBS="$JOBS" DEFCONFIG="$DEFCONFIG" ./build.sh 2>&1 | tee -a logs/build.log
          else
            echo "[INFO] ./build.sh not found; running make fallback" | tee -a logs/build.log
            make O="$OUT_DIR" ARCH="$ARCH" CROSS_COMPILE="$CROSS_COMPILE" CLANG_TRIPLE="$CLANG_TRIPLE" "$DEFCONFIG" 2>&1 | tee logs/configure.log
            make O="$OUT_DIR" ARCH="$ARCH" CROSS_COMPILE="$CROSS_COMPILE" CLANG_TRIPLE="$CLANG_TRIPLE" olddefconfig 2>&1 | tee -a logs/configure.log
            make -j"$JOBS" O="$OUT_DIR" ARCH="$ARCH" LLVM=1 LLVM_IAS=1 CROSS_COMPILE="$CROSS_COMPILE" CLANG_TRIPLE="$CLANG_TRIPLE" 2>&1 | tee -a logs/build.log
          fi

      - name: Extract debug logs
        if: always()
        run: |
          mkdir -p logs
          echo "===== errors/warnings grep =====" > logs/build-errors.log
          grep -nEi "error:|undefined reference|No rule to make target|fatal error|ld.lld|make\[[0-9]+\]: \*\*\*|inline_hook_check|You lost|not found|anchor|FAIL" logs/*.log >> logs/build-errors.log 2>/dev/null || true
          echo "===== build.log tail 1200 =====" > logs/build-tail.log
          tail -1200 logs/build.log >> logs/build-tail.log 2>/dev/null || true
          SUMMARY=logs/debug-summary.log
          : > "$SUMMARY"
          add(){ title="$1"; file="$2"; { echo; echo "================================================================"; echo "===== $title"; echo "===== file: $file"; echo "================================================================"; [ -f "$file" ] && cat "$file" || echo "[MISSING] $file"; } >> "$SUMMARY"; }
          add environment logs/environment.log
          add resukisu_setup logs/resukisu-setup.log
          add susfs_tree logs/susfs-tree.log
          add copy_susfs logs/copy-susfs-files.log
          add susfs_backport logs/apply-susfs-backport-lisa.log
          add manual_hooks logs/apply-manual-hooks.log
          add missing_hooks logs/apply-resukisu-missing-hooks.log
          add build_errors logs/build-errors.log
          add build_tail logs/build-tail.log
          { echo; echo "===== reject files ====="; find . -name '*.rej' -type f | sort; } >> "$SUMMARY"

      - name: Upload full debug logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anchor-backport-full-debug-${{ github.run_number }}
          path: |
            logs/**
            out/.config
          if-no-files-found: warn

      - name: Upload kernel artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anchor-backport-kernel-artifacts-${{ github.run_number }}
          path: |
            out/arch/arm64/boot/Image*
            out/arch/arm64/boot/dts/**/*.dtb
            out/arch/arm64/boot/dts/**/*.dtbo
            artifacts/**
          if-no-files-found: warn
