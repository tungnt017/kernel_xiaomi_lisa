name: Daily ReSukiSU Lisa Manual Hook + SUSFS Official

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: "Kernel defconfig"
        required: true
        default: "lisa_defconfig"
      resukisu_ref:
        description: "Optional ReSukiSU branch/tag/commit after setup. Empty = keep setup default"
        required: false
        default: ""
      susfs_repo:
        description: "SUSFS repository"
        required: true
        default: "https://github.com/ShirkNeko/susfs4ksu.git"
      susfs_ref:
        description: "SUSFS branch/tag/commit for kernel 5.4. Empty = default repo branch"
        required: false
        default: "kernel-5.4"
      run_manual_hooks:
        description: "Run existing manual hook script"
        required: true
        type: boolean
        default: true
      manual_hook_script:
        description: "Existing manual hook script path"
        required: true
        default: ".github/scripts/apply_resukisu_manual_hooks_1_fixed.py"
      jobs:
        description: "Parallel build jobs. Leave as $(nproc) for auto"
        required: true
        default: "$(nproc)"
      upload_full_out:
        description: "Upload out/ on failure"
        required: false
        type: boolean
        default: false

  schedule:
    # Daily build/check at 02:30 UTC. Vietnam time = 09:30 GMT+7.
    - cron: "30 2 * * *"

permissions:
  contents: read

env:
  ARCH: arm64
  SUBARCH: arm64
  OUT_DIR: out
  DEFCONFIG: lisa_defconfig
  RESUKISU_REF: ""
  SUSFS_REPO: https://github.com/ShirkNeko/susfs4ksu.git
  SUSFS_REF: kernel-5.4
  MANUAL_HOOK_SCRIPT: .github/scripts/apply_resukisu_manual_hooks_1_fixed.py
  CROSS_COMPILE: aarch64-linux-gnu-
  CLANG_TRIPLE: aarch64-linux-gnu-

jobs:
  build:
    name: Daily official ReSukiSU Lisa + SUSFS
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Normalize workflow inputs
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "DEFCONFIG=${{ github.event.inputs.defconfig }}" >> "$GITHUB_ENV"
            echo "RESUKISU_REF=${{ github.event.inputs.resukisu_ref }}" >> "$GITHUB_ENV"
            echo "SUSFS_REPO=${{ github.event.inputs.susfs_repo }}" >> "$GITHUB_ENV"
            echo "SUSFS_REF=${{ github.event.inputs.susfs_ref }}" >> "$GITHUB_ENV"
            echo "MANUAL_HOOK_SCRIPT=${{ github.event.inputs.manual_hook_script }}" >> "$GITHUB_ENV"
          fi

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Prepare build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex git git-lfs gnupg \
            libelf-dev libssl-dev lld llvm make openssl python3 python3-pip \
            rsync unzip wget zip zstd \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
          mkdir -p logs artifacts logs/debug

      - name: Capture initial environment
        run: |
          set -euo pipefail
          {
            echo "DATE_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "GITHUB_RUN=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "EVENT_NAME=${GITHUB_EVENT_NAME}"
            echo "DEFCONFIG=${DEFCONFIG}"
            echo "RESUKISU_REF=${RESUKISU_REF}"
            echo "SUSFS_REPO=${SUSFS_REPO}"
            echo "SUSFS_REF=${SUSFS_REF}"
            echo "MANUAL_HOOK_SCRIPT=${MANUAL_HOOK_SCRIPT}"
            echo "ARCH=${ARCH}"
            echo "OUT_DIR=${OUT_DIR}"
            echo "CROSS_COMPILE=${CROSS_COMPILE}"
            echo "CLANG_TRIPLE=${CLANG_TRIPLE}"
          } | tee logs/environment.log

      - name: Add ReSukiSU source
        run: |
          set -euo pipefail
          echo "Running ReSukiSU setup" | tee logs/resukisu-setup.log
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" \
            | bash 2>&1 | tee -a logs/resukisu-setup.log

          KSU_DIR=""
          if [ -d KernelSU ]; then
            KSU_DIR="KernelSU"
          elif [ -d drivers/kernelsu ]; then
            KSU_DIR="drivers/kernelsu"
          elif [ -d kernel/KernelSU ]; then
            KSU_DIR="kernel/KernelSU"
          fi

          if [ -z "${KSU_DIR}" ]; then
            echo "ERROR: ReSukiSU/KernelSU directory not found" | tee logs/resukisu-commit.log
            find . -maxdepth 5 -type d \( -iname "kernelsu" -o -iname "ReSukiSU*" \) | tee -a logs/resukisu-commit.log || true
            exit 1
          fi

          echo "KSU_DIR=${KSU_DIR}" | tee logs/resukisu-commit.log
          echo "KSU_DIR=${KSU_DIR}" >> "$GITHUB_ENV"

          if [ -d "${KSU_DIR}/.git" ]; then
            git -C "${KSU_DIR}" fetch --unshallow 2>/dev/null || true
            git -C "${KSU_DIR}" fetch --all --tags --force || true
            if [ -n "${RESUKISU_REF}" ]; then
              echo "Checking out ReSukiSU ref: ${RESUKISU_REF}" | tee -a logs/resukisu-commit.log
              git -C "${KSU_DIR}" checkout "${RESUKISU_REF}" 2>&1 | tee -a logs/resukisu-commit.log
            fi
            git -C "${KSU_DIR}" rev-parse HEAD | tee -a logs/resukisu-commit.log || true
            git -C "${KSU_DIR}" log -1 --oneline | tee -a logs/resukisu-commit.log || true
          fi

      - name: Clone ShirkNeko SUSFS
        run: |
          set -euo pipefail
          rm -rf susfs-src

          if [ -n "${SUSFS_REF}" ]; then
            if git ls-remote --exit-code --heads "${SUSFS_REPO}" "${SUSFS_REF}" >/dev/null 2>&1; then
              echo "Cloning SUSFS branch: ${SUSFS_REF}" | tee logs/susfs-clone.log
              git clone --depth 1 --branch "${SUSFS_REF}" "${SUSFS_REPO}" susfs-src 2>&1 | tee -a logs/susfs-clone.log
            else
              echo "SUSFS ref is not a branch; cloning default branch then checking out: ${SUSFS_REF}" | tee logs/susfs-clone.log
              git clone --depth 1 "${SUSFS_REPO}" susfs-src 2>&1 | tee -a logs/susfs-clone.log
              git -C susfs-src fetch --unshallow 2>/dev/null || true
              git -C susfs-src fetch --all --tags --force || true
              git -C susfs-src checkout "${SUSFS_REF}" 2>&1 | tee -a logs/susfs-clone.log
            fi
          else
            echo "Cloning SUSFS default branch" | tee logs/susfs-clone.log
            git clone --depth 1 "${SUSFS_REPO}" susfs-src 2>&1 | tee -a logs/susfs-clone.log
          fi

          {
            echo "===== SUSFS HEAD ====="
            git -C susfs-src rev-parse HEAD || true
            git -C susfs-src log -1 --oneline || true
            echo
            echo "===== SUSFS tree ====="
            find susfs-src/kernel_patches -maxdepth 4 -type f | sort || true
          } | tee logs/susfs-tree.log

      - name: Copy SUSFS implementation files
        run: |
          set -euo pipefail

          python3 - <<'PY' 2>&1 | tee logs/copy-susfs-files.log
          from pathlib import Path
          import shutil

          ROOT = Path.cwd()
          SUS = ROOT / "susfs-src" / "kernel_patches"
          required = [
              "fs/susfs.c",
              "include/linux/susfs.h",
              "include/linux/susfs_def.h",
          ]

          for rel in required:
              src = SUS / rel
              dst = ROOT / rel
              if not src.exists():
                  raise SystemExit(f"[ERROR] required SUSFS file missing: {src.relative_to(ROOT)}")
              dst.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(src, dst)
              print(f"[OK] copied {src.relative_to(ROOT)} -> {dst.relative_to(ROOT)}", flush=True)

          # Optional files are copied for source completeness only. The workflow does not enable SUS_SU by default.
          for rel in ["fs/sus_su.c", "include/linux/sus_su.h"]:
              src = SUS / rel
              dst = ROOT / rel
              if src.exists():
                  dst.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(src, dst)
                  print(f"[OK] copied optional {src.relative_to(ROOT)} -> {dst.relative_to(ROOT)}", flush=True)
          PY

      - name: Official SUSFS pre-compile check with context export
        run: |
          set +e
          mkdir -p logs/debug

          python3 - <<'PY' 2>&1 | tee logs/susfs-precompile-check.log
          from pathlib import Path
          import subprocess
          import re
          import sys

          ROOT = Path.cwd()
          SUS = ROOT / "susfs-src" / "kernel_patches"
          failures = []
          patch_stdout = ""

          def log(msg):
              print(msg, flush=True)

          def write_text(path, text):
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(text, errors="ignore")

          def run_capture(cmd, cwd=ROOT):
              log(f"[CHECK] {cmd}  (cwd={cwd})")
              p = subprocess.run(cmd, shell=True, cwd=cwd, text=True,
                                 stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
              print(p.stdout, end="")
              return p.returncode, p.stdout

          def export_source_context(file_path, center_line=None, radius=80):
              p = ROOT / file_path
              out = []
              out.append(f"===== SOURCE CONTEXT: {file_path} =====")
              if not p.exists():
                  out.append(f"[MISSING] {file_path}")
                  return "\n".join(out) + "\n"
              lines = p.read_text(errors="ignore").splitlines()
              if center_line is None:
                  start, end = 1, min(len(lines), 160)
              else:
                  start = max(1, center_line - radius)
                  end = min(len(lines), center_line + radius)
              out.append(f"lines {start}-{end} of {len(lines)}")
              for idx in range(start, end + 1):
                  out.append(f"{idx:05d}: {lines[idx-1]}")
              return "\n".join(out) + "\n"

          def export_patch_file_hunks(patch_file, files):
              text = patch_file.read_text(errors="ignore") if patch_file.exists() else ""
              out = []
              out.append(f"===== PATCH HUNKS FROM: {patch_file.relative_to(ROOT) if patch_file.exists() else patch_file} =====")
              for f in files:
                  out.append(f"\n===== PATCH SECTION FOR {f} =====")
                  pattern = re.compile(rf"(^diff --git a/{re.escape(f)} b/{re.escape(f)}\n.*?)(?=^diff --git |\Z)", re.M | re.S)
                  m = pattern.search(text)
                  if m:
                      section = m.group(1)
                      out.append(section)
                  else:
                      out.append(f"[MISSING PATCH SECTION] {f}")
              return "\n".join(out) + "\n"

          # Required copied files.
          for rel in ["fs/susfs.c", "include/linux/susfs.h", "include/linux/susfs_def.h"]:
              p = ROOT / rel
              if not p.exists():
                  failures.append(f"missing copied SUSFS file: {rel}")
              else:
                  log(f"[OK] copied SUSFS file exists: {rel}")

          forbidden = SUS / "KernelSU" / "10_enable_susfs_for_ksu.patch"
          if forbidden.exists():
              log(f"[INFO] KSU-side patch exists but is intentionally not used: {forbidden.relative_to(ROOT)}")

          patches = []
          patches += sorted(SUS.glob("50_add_susfs_in_kernel-5.4*.patch"))
          patches += sorted(SUS.glob("*susfs*kernel*5.4*.patch"))
          unique = []
          for p in patches:
              if p not in unique:
                  unique.append(p)

          patch = None
          if not unique:
              failures.append("no kernel 5.4 SUSFS patch found under susfs-src/kernel_patches")
          else:
              patch = unique[0]
              log(f"[INFO] selected kernel-side patch: {patch.relative_to(ROOT)}")
              rc, patch_stdout = run_capture(f"git apply --check --whitespace=error '{patch.resolve()}'", ROOT)
              if rc != 0:
                  failures.append("kernel-side SUSFS patch does not apply cleanly to this lisa source")
              else:
                  log("[OK] kernel-side SUSFS patch preflight clean")

          # Export context regardless, so manual official porting can be done without partial apply.
          files_from_errors = []
          for match in re.finditer(r"error: patch failed: ([^:]+):(\d+)", patch_stdout):
              files_from_errors.append((match.group(1), int(match.group(2))))
          if not files_from_errors:
              files_from_errors = [
                  ("fs/Makefile", 14),
                  ("fs/namei.c", 40),
                  ("fs/namespace.c", 26),
                  ("fs/notify/fdinfo.c", 13),
                  ("fs/proc/task_mmu.c", 348),
                  ("fs/readdir.c", 23),
              ]

          unique_files = []
          for f, _ in files_from_errors:
              if f not in unique_files:
                  unique_files.append(f)

          source_context = []
          for f, line in files_from_errors:
              source_context.append(export_source_context(f, line, 90))
          write_text(ROOT / "logs" / "debug" / "susfs-source-context.log", "\n".join(source_context))

          if patch:
              write_text(ROOT / "logs" / "debug" / "susfs-patch-hunks.log", export_patch_file_hunks(patch, unique_files))
              write_text(ROOT / "logs" / "debug" / "susfs-patch-check-output.log", patch_stdout)

          rejs = sorted(ROOT.rglob("*.rej"))
          if rejs:
              failures.append(".rej files found before compile")
              for r in rejs:
                  log(f"[REJ] {r.relative_to(ROOT)}")

          if failures:
              log("")
              log("[OFFICIAL FAIL-FAST] SUSFS pre-compile check failed. Build will stop before wasting compile time.")
              log("[INFO] Exported official porting context without applying patch:")
              log("  - logs/debug/susfs-source-context.log")
              log("  - logs/debug/susfs-patch-hunks.log")
              log("  - logs/debug/susfs-patch-check-output.log")
              for item in failures:
                  log(f"  - {item}")
              raise SystemExit(1)

          log("[OK] SUSFS pre-compile check passed")
          PY

          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Apply SUSFS kernel-side patch after clean check
        run: |
          set -euo pipefail

          python3 - <<'PY' 2>&1 | tee logs/apply-susfs-kernel-side.log
          from pathlib import Path
          import subprocess

          ROOT = Path.cwd()
          SUS = ROOT / "susfs-src" / "kernel_patches"
          patches = []
          patches += sorted(SUS.glob("50_add_susfs_in_kernel-5.4*.patch"))
          patches += sorted(SUS.glob("*susfs*kernel*5.4*.patch"))
          unique = []
          for p in patches:
              if p not in unique:
                  unique.append(p)
          patch = unique[0]

          print(f"[RUN] git apply --whitespace=error {patch.relative_to(ROOT)}", flush=True)
          p = subprocess.run(f"git apply --whitespace=error '{patch.resolve()}'", shell=True, cwd=ROOT)
          if p.returncode != 0:
              raise SystemExit(p.returncode)

          rejs = sorted(ROOT.rglob("*.rej"))
          if rejs:
              print("[ERROR] .rej files exist after clean apply:", flush=True)
              for r in rejs:
                  print(f"  - {r.relative_to(ROOT)}", flush=True)
              raise SystemExit(1)

          print("[OK] SUSFS kernel-side patch applied cleanly with zero rejects", flush=True)
          PY

      - name: Apply existing manual hook script
        if: ${{ github.event_name == 'schedule' || github.event.inputs.run_manual_hooks == 'true' }}
        run: |
          set -euo pipefail

          if [ ! -f "${MANUAL_HOOK_SCRIPT}" ]; then
            echo "ERROR: manual hook script not found: ${MANUAL_HOOK_SCRIPT}" | tee logs/apply-manual-hooks.log
            exit 1
          fi

          python3 "${MANUAL_HOOK_SCRIPT}" "${DEFCONFIG}" 2>&1 | tee logs/apply-manual-hooks.log

      - name: Official validate manual hooks
        if: ${{ github.event_name == 'schedule' || github.event.inputs.run_manual_hooks == 'true' }}
        run: |
          set -euo pipefail

          {
            echo "===== Official manual hook validation ====="
            failed=0

            require_grep() {
              local pattern="$1"
              local file="$2"
              if grep -qE "$pattern" "$file"; then
                echo "[OK] $file contains $pattern"
              else
                echo "[ERROR] $file missing $pattern"
                failed=1
              fi
            }

            require_grep "ksu_handle_execveat" "fs/exec.c"
            require_grep "ksu_handle_faccessat" "fs/open.c"
            require_grep "ksu_handle_stat" "fs/stat.c"
            require_grep "ksu_handle_sys_reboot" "kernel/reboot.c"

            if grep -R "ksu_handle_execveat((int \*)AT_FDCWD" fs/exec.c >/dev/null 2>&1; then
              echo "[ERROR] unsafe exec hook cast found: ksu_handle_execveat((int *)AT_FDCWD, ...). Fix manual hook script properly."
              failed=1
            else
              echo "[OK] no unsafe AT_FDCWD pointer cast found"
            fi

            if grep -E "\[WARN\]|\[MISS\]|skip: no manual hook" logs/apply-manual-hooks.log >/dev/null 2>&1; then
              echo "[ERROR] manual hook script emitted WARN/MISS. Official build requires clean hooks."
              grep -E "\[WARN\]|\[MISS\]|skip: no manual hook" logs/apply-manual-hooks.log || true
              failed=1
            else
              echo "[OK] manual hook log has no WARN/MISS"
            fi

            if [ "$failed" -ne 0 ]; then
              exit 1
            fi
          } | tee logs/manual-hook-validation.log

      - name: Enable ReSukiSU + SUSFS configs
        run: |
          set -euo pipefail

          python3 - <<'PY' 2>&1 | tee logs/enable-resukisu-susfs-configs.log
          from pathlib import Path
          import os

          ROOT = Path.cwd()
          defconfig = os.environ.get("DEFCONFIG", "lisa_defconfig")
          candidates = [
              ROOT / "arch" / "arm64" / "configs" / defconfig,
              ROOT / "arch" / "arm64" / "configs" / "vendor" / defconfig,
          ]
          path = next((p for p in candidates if p.exists()), None)
          if path is None:
              raise SystemExit(f"[ERROR] defconfig not found: {defconfig}")

          def set_config(text, key, value="y"):
              lines = []
              seen = False
              for line in text.splitlines():
                  if line.startswith(key + "=") or line.startswith("# " + key + " is not set"):
                      if not seen:
                          lines.append(f"{key}={value}")
                          seen = True
                      continue
                  lines.append(line)
              if not seen:
                  lines.append(f"{key}={value}")
              return "\n".join(lines) + "\n"

          text = path.read_text(errors="ignore")
          for key in [
              "CONFIG_KSU",
              "CONFIG_KSU_MANUAL_HOOK",
              "CONFIG_KALLSYMS",
              "CONFIG_KALLSYMS_ALL",
              "CONFIG_KSU_SUSFS",
              "CONFIG_KSU_SUSFS_SUS_PATH",
              "CONFIG_KSU_SUSFS_SUS_MOUNT",
              "CONFIG_KSU_SUSFS_SUS_KSTAT",
              "CONFIG_KSU_SUSFS_TRY_UMOUNT",
              "CONFIG_KSU_SUSFS_SPOOF_UNAME",
              "CONFIG_KSU_SUSFS_ENABLE_LOG",
              "CONFIG_KSU_SUSFS_OPEN_REDIRECT",
          ]:
              text = set_config(text, key, "y")

          path.write_text(text)
          print(f"[OK] enabled ReSukiSU manual hook + SUSFS configs in {path.relative_to(ROOT)}")
          PY

      - name: Final SUSFS guard before compile
        run: |
          set -euo pipefail
          {
            echo "===== Final SUSFS guard before compile ====="
            failed=0
            for f in fs/susfs.c include/linux/susfs.h include/linux/susfs_def.h; do
              if [ -f "$f" ]; then
                echo "[OK] $f exists"
              else
                echo "[ERROR] $f missing"
                failed=1
              fi
            done

            if find . -name '*.rej' -type f | grep -q .; then
              echo "[ERROR] .rej files found before compile"
              find . -name '*.rej' -type f | sort
              failed=1
            else
              echo "[OK] no .rej files before compile"
            fi

            if [ "$failed" -ne 0 ]; then
              exit 1
            fi
          } | tee logs/final-susfs-guard.log

      - name: Dump integration status
        if: always()
        run: |
          set +e
          mkdir -p logs/debug
          {
            echo "===== KSU_DIR ====="
            echo "${KSU_DIR:-}"
            echo
            echo "===== SUSFS files ====="
            ls -la fs/susfs.c include/linux/susfs.h include/linux/susfs_def.h 2>/dev/null || true
            echo
            echo "===== Reject files ====="
            find . -name '*.rej' -type f -print | sort || true
            echo
            echo "===== Manual hook grep ====="
            grep -R "ksu_handle_execveat\|ksu_handle_faccessat\|ksu_handle_stat\|ksu_handle_sys_reboot" fs kernel security 2>/dev/null || true
            echo
            echo "===== Defconfig KSU/SUSFS ====="
            grep -E 'CONFIG_KSU|CONFIG_KALLSYMS|CONFIG_KPM' "arch/arm64/configs/${DEFCONFIG}" 2>/dev/null || true
          } | tee logs/integration-status.log

          cp fs/susfs.c logs/debug/susfs.c.txt 2>/dev/null || true
          cp include/linux/susfs.h logs/debug/susfs.h.txt 2>/dev/null || true
          cp include/linux/susfs_def.h logs/debug/susfs_def.h.txt 2>/dev/null || true
          cp "arch/arm64/configs/${DEFCONFIG}" logs/debug/patched-defconfig.txt 2>/dev/null || true

      - name: Configure kernel
        run: |
          set -euo pipefail
          make O="${OUT_DIR}" ARCH="${ARCH}" \
            CROSS_COMPILE="${CROSS_COMPILE}" \
            CLANG_TRIPLE="${CLANG_TRIPLE}" \
            "${DEFCONFIG}" 2>&1 | tee logs/configure.log
          make O="${OUT_DIR}" ARCH="${ARCH}" \
            CROSS_COMPILE="${CROSS_COMPILE}" \
            CLANG_TRIPLE="${CLANG_TRIPLE}" \
            olddefconfig 2>&1 | tee -a logs/configure.log
          cp "${OUT_DIR}/.config" logs/debug/effective-dot-config.txt 2>/dev/null || true
          grep -E 'CONFIG_KSU|CONFIG_KALLSYMS|CONFIG_KPM|CONFIG_KSU_SUSFS' "${OUT_DIR}/.config" | tee logs/kernel-config-ksu-susfs.log || true

      - name: Build kernel
        run: |
          set -euo pipefail
          JOBS_INPUT='${{ github.event.inputs.jobs }}'
          if [ "${JOBS_INPUT}" = '$(nproc)' ] || [ -z "${JOBS_INPUT}" ]; then
            JOBS="$(nproc)"
          else
            JOBS="${JOBS_INPUT}"
          fi
          echo "Starting compilation with -j${JOBS}" | tee logs/build.log
          make -j"${JOBS}" O="${OUT_DIR}" ARCH="${ARCH}" \
            LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE="${CROSS_COMPILE}" \
            CLANG_TRIPLE="${CLANG_TRIPLE}" \
            2>&1 | tee -a logs/build.log

      - name: Extract build error tail
        if: always()
        run: |
          mkdir -p logs
          echo "===== build.log tail 300 =====" > logs/build-tail.log
          tail -300 logs/build.log >> logs/build-tail.log 2>/dev/null || true
          echo "===== errors/warnings grep =====" > logs/build-errors.log
          grep -nEi "error:|undefined reference|No rule to make target|fatal error|ld.lld|make\\[[0-9]+\\]: \\*\\*\\*|OFFICIAL FAIL-FAST|SUSFS pre-compile check failed|manual hook script emitted" logs/*.log \
            >> logs/build-errors.log 2>/dev/null || true

      - name: Create compact debug summary
        if: always()
        run: |
          set +e
          mkdir -p logs

          SUMMARY="logs/debug-summary.log"
          : > "$SUMMARY"

          add_section() {
            local title="$1"
            local file="$2"
            {
              echo
              echo "================================================================"
              echo "===== ${title}"
              echo "===== file: ${file}"
              echo "================================================================"
              if [ -f "$file" ]; then
                cat "$file"
              else
                echo "[MISSING] $file"
              fi
            } >> "$SUMMARY"
          }

          {
            echo "ReSukiSU daily official debug summary for Copilot upload"
            echo "Generated at UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "GitHub run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "DEFCONFIG=${DEFCONFIG}"
            echo "RESUKISU_REF=${RESUKISU_REF}"
            echo "SUSFS_REPO=${SUSFS_REPO}"
            echo "SUSFS_REF=${SUSFS_REF}"
            echo "KSU_DIR=${KSU_DIR:-}"
            echo "MANUAL_HOOK_SCRIPT=${MANUAL_HOOK_SCRIPT}"
          } >> "$SUMMARY"

          add_section "environment" "logs/environment.log"
          add_section "ReSukiSU setup" "logs/resukisu-setup.log"
          add_section "ReSukiSU commit" "logs/resukisu-commit.log"
          add_section "SUSFS clone/tree" "logs/susfs-tree.log"
          add_section "copy SUSFS files" "logs/copy-susfs-files.log"
          add_section "SUSFS pre-compile check" "logs/susfs-precompile-check.log"
          add_section "SUSFS patch check output" "logs/debug/susfs-patch-check-output.log"
          add_section "SUSFS source context" "logs/debug/susfs-source-context.log"
          add_section "SUSFS patch hunks" "logs/debug/susfs-patch-hunks.log"
          add_section "apply SUSFS kernel-side" "logs/apply-susfs-kernel-side.log"
          add_section "manual hook" "logs/apply-manual-hooks.log"
          add_section "manual hook validation" "logs/manual-hook-validation.log"
          add_section "enable configs" "logs/enable-resukisu-susfs-configs.log"
          add_section "final SUSFS guard" "logs/final-susfs-guard.log"
          add_section "integration status" "logs/integration-status.log"
          add_section "configure" "logs/configure.log"
          add_section "effective KSU/SUSFS config" "logs/kernel-config-ksu-susfs.log"
          add_section "build errors" "logs/build-errors.log"
          add_section "build tail" "logs/build-tail.log"

          {
            echo
            echo "================================================================"
            echo "===== reject files"
            echo "================================================================"
            find . -name '*.rej' -type f | sort
          } >> "$SUMMARY"

          echo "Created $SUMMARY"

      - name: Collect outputs
        if: always()
        run: |
          set +e
          mkdir -p artifacts logs
          {
            echo "===== OUTPUT FILES ====="
            find "${OUT_DIR}" -type f \( \
              -name 'Image' -o -name 'Image.gz' -o -name 'Image.gz-dtb' -o \
              -name '*.dtb' -o -name '*.dtbo' -o -name '*.ko' -o -name 'vmlinux' \
            \) -print | sort
          } | tee logs/output-files.log
          cp "${OUT_DIR}/arch/arm64/boot/Image" artifacts/ 2>/dev/null || true
          cp "${OUT_DIR}/arch/arm64/boot/Image.gz" artifacts/ 2>/dev/null || true
          cp "${OUT_DIR}/arch/arm64/boot/Image.gz-dtb" artifacts/ 2>/dev/null || true
          find "${OUT_DIR}/arch/arm64/boot/dts" -type f \( -name '*.dtb' -o -name '*.dtbo' \) -exec cp -t artifacts {} + 2>/dev/null || true

      - name: Upload 3 debug files only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: copilot-debug-3files-resukisu-daily-${{ github.run_number }}
          path: |
            logs/debug-summary.log
            logs/build-errors.log
            logs/build-tail.log
          if-no-files-found: warn

      - name: Upload kernel artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-artifacts-resukisu-daily-${{ github.run_number }}
          path: artifacts/**
          if-no-files-found: warn

      - name: Upload full out directory on failure
        if: failure() && github.event.inputs.upload_full_out == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: out-debug-resukisu-daily-${{ github.run_number }}
          path: out/**
          if-no-files-found: warn
