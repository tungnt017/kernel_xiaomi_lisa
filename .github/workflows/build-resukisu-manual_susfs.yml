          chmod +x .github/scripts/port_susfs_lisa_phase1.py .github/scripts/port_susfs_lisa_phase2a.py

      - name: Apply official SUSFS phase 1 lisa port
        run: |
          set -euo pipefail
          python3 .github/scripts/port_susfs_lisa_phase1.py 2>&1 | tee logs/port-susfs-phase1.log

      - name: Apply official SUSFS phase 2A lisa port
        run: |
          set -euo pipefail
          python3 .github/scripts/port_susfs_lisa_phase2a.py 2>&1 | tee logs/port-susfs-phase2a.log

      - name: Official SUSFS pre-compile check with phase2A filtered context export
        run: |
          set +e
          mkdir -p logs/debug
          python3 - <<'PY' 2>&1 | tee logs/susfs-precompile-check.log
          from pathlib import Path
          import subprocess, re
          root=Path.cwd(); original=root/'susfs-src/kernel_patches/50_add_susfs_in_kernel-5.4.patch'; patch=root/'logs/debug/50_add_susfs_in_kernel-5.4.remaining-after-phase2a.patch'; failures=[]
          FILTER_FILES={'fs/Makefile','fs/proc/task_mmu.c','fs/notify/fdinfo.c','fs/readdir.c'}
          def write(p,d): p.parent.mkdir(parents=True, exist_ok=True); p.write_text(d, errors='ignore')
          def strip(src,dst):
              if not src.exists(): return False
              text=src.read_text(errors='ignore'); parts=re.split(r'(?=^diff --git )',text,flags=re.M); pre=parts[0]; kept=[]; skipped=[]
              for sec in parts[1:]:
                  m=re.match(r'diff --git a/(.*?) b/\1',sec)
                  if m and m.group(1) in FILTER_FILES: skipped.append(m.group(1)); continue
                  kept.append(sec)
              dst.write_text(pre+''.join(kept), errors='ignore')
              for f in sorted(set(skipped)): print(f'[OK] skipped already-ported hunk file: {f}')
              return True
          def source_context(path,center,radius=80):
              f=root/path; out=[f'===== SOURCE CONTEXT: {path} =====']
              if not f.exists(): out.append(f'[MISSING] {path}'); return '
'.join(out)+'
'
              lines=f.read_text(errors='ignore').splitlines(); s=max(1,center-radius); e=min(len(lines),center+radius); out.append(f'lines {s}-{e} of {len(lines)}')
              for i in range(s,e+1): out.append(f'{i:05d}: {lines[i-1]}')
              return '
'.join(out)+'
'
          markers={'fs/Makefile':'obj-$(CONFIG_KSU_SUSFS) += susfs.o','fs/proc/task_mmu.c':'SUSFS: spoof map VMA inode/dev for SUS_KSTAT','fs/notify/fdinfo.c':'SUSFS: show original inode information for SUS_KSTAT fdinfo','fs/readdir.c':'susfs_phase2a_readdir_callback_fields','fs/namei.c':'susfs_namei_phase2a_marker'}
          for rel,mark in markers.items():
              p=root/rel
              if not p.exists() or mark not in p.read_text(errors='ignore'): failures.append(f'port marker missing in {rel}: {mark}')
              else: print(f'[OK] marker verified in {rel}: {mark}')
          for rel in ['fs/susfs.c','include/linux/susfs.h','include/linux/susfs_def.h']:
              if not (root/rel).exists(): failures.append(f'missing copied SUSFS file: {rel}')
              else: print(f'[OK] copied SUSFS file exists: {rel}')
          print('[OK] KernelSU/10_enable_susfs_for_ksu.patch is excluded from official ReSukiSU workflow path')
          if not strip(original,patch): failures.append('missing kernel-side patch: 50_add_susfs_in_kernel-5.4.patch'); output=''
          else:
              print(f'[INFO] selected remaining kernel-side patch after phase2A: {patch}')
              cmd=f"git apply --check --whitespace=error '{patch.resolve()}'"; print(f'[CHECK] {cmd}  (cwd={root})')
              p=subprocess.run(cmd,shell=True,cwd=root,text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT); output=p.stdout; print(output,end='')
              if p.returncode != 0: failures.append('remaining kernel-side SUSFS patch does not apply cleanly to this lisa source')
          files=[(m.group(1),int(m.group(2))) for m in re.finditer(r'error: patch failed: ([^:]+):(\d+)', output)]
          write(root/'logs/debug/susfs-patch-check-output.log', output); write(root/'logs/debug/susfs-phase2a-filtered-patch-path.log', str(patch)+'
'); write(root/'logs/debug/susfs-source-context.log', '
'.join(source_context(f,l,90) for f,l in files))
          text=patch.read_text(errors='ignore') if patch.exists() else ''; unique=[]
          for f,_ in files:
              if f not in unique: unique.append(f)
          hunks=[]; allctx=['===== ALL SOURCE CONTEXTS FOR EVERY HUNK TARGET LINE =====']
          for f in unique:
              m=re.search(rf'(^diff --git a/{re.escape(f)} b/{re.escape(f)}
.*?)(?=^diff --git |\Z)',text,re.M|re.S); sec=m.group(1) if m else ''
              hunks.append(f'===== PATCH SECTION FOR {f} =====
{sec or "[MISSING]"}'); allctx.append(f'##### FILE: {f} #####')
              for line in sorted(set(int(x) for x in re.findall(r'^@@ -\d+(?:,\d+)? \+(\d+)(?:,\d+)? @@',sec,re.M))): allctx.append(source_context(f,line,70))
          write(root/'logs/debug/susfs-patch-hunks.log','
'.join(hunks)); write(root/'logs/debug/susfs-all-hunk-source-contexts.log','
'.join(allctx))
          if any(root.rglob('*.rej')): failures.append('.rej files found before compile')
          if failures:
              print('
[OFFICIAL FAIL-FAST] SUSFS pre-compile check failed. Build will stop before wasting compile time.'); print('[INFO] Exported official porting context without applying patch.')
              for item in failures: print(f'  - {item}')
              raise SystemExit(1)
          print('[OK] SUSFS pre-compile check passed')
          PY
          exit ${PIPESTATUS[0]}

      - name: Apply remaining SUSFS kernel-side patch after clean check
        run: |
          set -euo pipefail
          git apply --whitespace=error logs/debug/50_add_susfs_in_kernel-5.4.remaining-after-phase2a.patch 2>&1 | tee logs/apply-susfs-kernel-side.log
          if find . -name '*.rej' -type f | grep -q .; then find . -name '*.rej' -type f | sort | tee -a logs/apply-susfs-kernel-side.log; exit 1; fi

      - name: Apply existing manual hook script
        run: |
          set -euo pipefail
          if [ ! -f "$MANUAL_HOOK_SCRIPT" ]; then echo "ERROR: manual hook script not found: $MANUAL_HOOK_SCRIPT" | tee logs/apply-manual-hooks.log; exit 1; fi
          python3 "$MANUAL_HOOK_SCRIPT" "$DEFCONFIG" 2>&1 | tee logs/apply-manual-hooks.log

      - name: Enable ReSukiSU + SUSFS configs
        run: |
          set -euo pipefail
          python3 - <<'PY' 2>&1 | tee logs/enable-resukisu-susfs-configs.log
          from pathlib import Path
          import os
          root=Path.cwd(); defconfig=os.environ.get('DEFCONFIG','lisa_defconfig'); paths=[root/'arch/arm64/configs'/defconfig, root/'arch/arm64/configs/vendor'/defconfig]
          path=next((p for p in paths if p.exists()),None)
          if not path: raise SystemExit(f'[ERROR] defconfig not found: {defconfig}')
          text=path.read_text(errors='ignore')
          def setcfg(text,key):
              lines=[]; seen=False
              for line in text.splitlines():
                  if line.startswith(key+'=') or line.startswith('# '+key+' is not set'):
                      if not seen: lines.append(key+'=y'); seen=True
                      continue
                  lines.append(line)
              if not seen: lines.append(key+'=y')
              return '
'.join(lines)+'
'
          for key in ['CONFIG_KSU','CONFIG_KSU_MANUAL_HOOK','CONFIG_KALLSYMS','CONFIG_KALLSYMS_ALL','CONFIG_KSU_SUSFS','CONFIG_KSU_SUSFS_SUS_PATH','CONFIG_KSU_SUSFS_SUS_MOUNT','CONFIG_KSU_SUSFS_SUS_KSTAT','CONFIG_KSU_SUSFS_TRY_UMOUNT','CONFIG_KSU_SUSFS_SPOOF_UNAME','CONFIG_KSU_SUSFS_ENABLE_LOG','CONFIG_KSU_SUSFS_OPEN_REDIRECT']:
              text=setcfg(text,key)
          path.write_text(text); print(f'[OK] enabled configs in {path}')
          PY

      - name: Final SUSFS guard before compile
        run: |
          set -euo pipefail
          for f in fs/susfs.c include/linux/susfs.h include/linux/susfs_def.h; do test -f "$f" || { echo "ERROR: $f missing"; exit 1; }; done
          if find . -name '*.rej' -type f | grep -q .; then find . -name '*.rej' -type f | sort; exit 1; fi
          echo "[OK] final SUSFS guard passed" | tee logs/final-susfs-guard.log

      - name: Configure kernel
        run: |
          set -euo pipefail
          make O="$OUT_DIR" ARCH="$ARCH" CROSS_COMPILE="$CROSS_COMPILE" CLANG_TRIPLE="$CLANG_TRIPLE" "$DEFCONFIG" 2>&1 | tee logs/configure.log
          make O="$OUT_DIR" ARCH="$ARCH" CROSS_COMPILE="$CROSS_COMPILE" CLANG_TRIPLE="$CLANG_TRIPLE" olddefconfig 2>&1 | tee -a logs/configure.log
          grep -E 'CONFIG_KSU|CONFIG_KALLSYMS|CONFIG_KSU_SUSFS' "$OUT_DIR/.config" | tee logs/kernel-config-ksu-susfs.log || true

      - name: Build kernel
        run: |
          set -euo pipefail
          JOBS_INPUT='${{ github.event.inputs.jobs }}'
          if [ "$JOBS_INPUT" = '$(nproc)' ] || [ -z "$JOBS_INPUT" ]; then JOBS="$(nproc)"; else JOBS="$JOBS_INPUT"; fi
          echo "Starting compilation with -j$JOBS" | tee logs/build.log
          make -j"$JOBS" O="$OUT_DIR" ARCH="$ARCH" LLVM=1 LLVM_IAS=1 CROSS_COMPILE="$CROSS_COMPILE" CLANG_TRIPLE="$CLANG_TRIPLE" 2>&1 | tee -a logs/build.log

      - name: Extract build error tail
        if: always()
        run: |
          mkdir -p logs
          echo "===== build.log tail 300 =====" > logs/build-tail.log
          tail -300 logs/build.log >> logs/build-tail.log 2>/dev/null || true
          echo "===== errors/warnings grep =====" > logs/build-errors.log
          grep -nEi "error:|undefined reference|No rule to make target|fatal error|ld.lld|make\[[0-9]+\]: \*\*\*|OFFICIAL FAIL-FAST|SUSFS pre-compile check failed|manual hook script emitted" logs/*.log >> logs/build-errors.log 2>/dev/null || true

      - name: Create compact debug summary
        if: always()
        run: |
          set +e
          SUMMARY="logs/debug-summary.log"; : > "$SUMMARY"
          add_section(){ title="$1"; file="$2"; { echo; echo "================================================================"; echo "===== $title"; echo "===== file: $file"; echo "================================================================"; [ -f "$file" ] && cat "$file" || echo "[MISSING] $file"; } >> "$SUMMARY"; }
          { echo "ReSukiSU manual SUSFS official Phase2A debug summary"; echo "Generated at UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)"; echo "GitHub run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"; echo "DEFCONFIG=$DEFCONFIG"; echo "SUSFS_REF=$SUSFS_REF"; echo "KSU_DIR=${KSU_DIR:-}"; } >> "$SUMMARY"
          add_section environment logs/environment.log
          add_section "ReSukiSU setup" logs/resukisu-setup.log
          add_section "SUSFS tree" logs/susfs-tree.log
          add_section "copy SUSFS files" logs/copy-susfs-files.log
          add_section "SUSFS phase 1 port" logs/port-susfs-phase1.log
          add_section "SUSFS phase 2A port" logs/port-susfs-phase2a.log
          add_section "SUSFS pre-compile check" logs/susfs-precompile-check.log
          add_section "SUSFS phase2A filtered patch path" logs/debug/susfs-phase2a-filtered-patch-path.log
          add_section "SUSFS patch check output" logs/debug/susfs-patch-check-output.log
          add_section "SUSFS source context" logs/debug/susfs-source-context.log
          add_section "SUSFS all hunk source contexts" logs/debug/susfs-all-hunk-source-contexts.log
          add_section "SUSFS patch hunks" logs/debug/susfs-patch-hunks.log
          add_section "manual hook" logs/apply-manual-hooks.log
          add_section configure logs/configure.log
          add_section "build errors" logs/build-errors.log
          add_section "build tail" logs/build-tail.log
          { echo; echo "===== reject files ====="; find . -name '*.rej' -type f | sort; } >> "$SUMMARY"

      - name: Collect outputs
        if: always()
        run: |
          set +e
          mkdir -p artifacts
          find "$OUT_DIR" -type f \( -name 'Image' -o -name 'Image.gz' -o -name 'Image.gz-dtb' -o -name '*.dtb' -o -name '*.dtbo' -o -name '*.ko' \) -exec cp -t artifacts {} + 2>/dev/null || true

      - name: Upload 3 debug files only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: copilot-debug-3files-resukisu-manual-susfs-phase2a-${{ github.run_number }}
          path: |
            logs/debug-summary.log
            logs/build-errors.log
            logs/build-tail.log
          if-no-files-found: warn

      - name: Upload kernel artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-artifacts-resukisu-manual-susfs-phase2a-${{ github.run_number }}
          path: artifacts/**
          if-no-files-found: warn
