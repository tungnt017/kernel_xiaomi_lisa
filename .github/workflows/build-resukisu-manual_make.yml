name: Build Lisa Kernel With ReSukiSU Manual Hooks Fixed

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: "Defconfig name"
        required: true
        default: "lisa_defconfig"
      jobs:
        description: "Build jobs"
        required: true
        default: "auto"
      release_tag:
        description: "GitHub Release tag name, empty = auto run number"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    name: Build ReSukiSU kernel
    runs-on: ubuntu-22.04

    env:
      ARCH: arm64
      SUBARCH: arm64
      OUT_DIR: out
      DEFCONFIG: ${{ github.event.inputs.defconfig }}

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          set -e

          sudo apt update
          sudo apt install -y \
            git curl wget zip unzip \
            build-essential bc bison flex \
            libssl-dev libelf-dev libyaml-dev \
            python3 python-is-python3 \
            clang lld llvm \
            gcc-aarch64-linux-gnu \
            cpio rsync file gzip

      - name: Prepare logs directory
        run: |
          mkdir -p logs

      - name: Add ReSukiSU source
        run: |
          set -e
          set -o pipefail
          mkdir -p logs

          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash 2>&1 | tee logs/resukisu-setup.log

      - name: Apply ReSukiSU manual hooks
        run: |
          set -e
          set -o pipefail
          mkdir -p logs

          python3 .github/scripts/apply_resukisu_manual_hooks_1_fixed.py "${DEFCONFIG}" 2>&1 | tee logs/apply-hooks.log

      - name: Verify ReSukiSU manual hook diff
        run: |
          set -e
          set -o pipefail
          mkdir -p logs

          {
            echo "===== git diff -- manual hook files ====="
            git diff --               fs/exec.c               fs/stat.c               fs/open.c               kernel/reboot.c               security/selinux/selinuxfs.c || true

            echo
            echo "===== Verify required ReSukiSU hook markers ====="

            FAIL=0

            check_marker() {
              local file="$1"
              local marker="$2"
              local label="$3"

              if [ ! -f "$file" ]; then
                echo "[MISS] ${label}: file not found: ${file}"
                FAIL=1
                return 0
              fi

              if grep -Fq "$marker" "$file"; then
                echo "[OK] ${label}: ${marker}"
              else
                echo "[MISS] ${label}: ${marker} in ${file}"
                FAIL=1
              fi
            }

            check_regex() {
              local file="$1"
              local pattern="$2"
              local label="$3"

              if [ ! -f "$file" ]; then
                echo "[MISS] ${label}: file not found: ${file}"
                FAIL=1
                return 0
              fi

              if grep -Eq "$pattern" "$file"; then
                echo "[OK] ${label}: ${pattern}"
              else
                echo "[MISS] ${label}: ${pattern} in ${file}"
                FAIL=1
              fi
            }

            check_marker fs/exec.c "ksu_handle_execveat" "execve/execveat hook"
            check_marker fs/stat.c "ksu_handle_stat" "stat path hook"
            check_marker fs/stat.c "ksu_handle_newfstat_ret" "newfstat return hook"
            check_marker kernel/reboot.c "ksu_handle_sys_reboot" "reboot hook"

            if [ -f security/selinux/selinuxfs.c ]; then
              check_regex security/selinux/selinuxfs.c "EXPORT_SYMBOL(_GPL)?[[:space:]]*\([[:space:]]*write_op[[:space:]]*\)" "SELinux write_op export"
              check_regex security/selinux/selinuxfs.c "EXPORT_SYMBOL(_GPL)?[[:space:]]*\([[:space:]]*sel_handle_status_ops[[:space:]]*\)" "SELinux status ops export"
            else
              echo "[WARN] security/selinux/selinuxfs.c not found, skip SELinux export checks"
            fi

            if grep -Fq "SYSCALL_DEFINE2(fstat64" fs/stat.c; then
              check_marker fs/stat.c "ksu_handle_fstat64_ret" "fstat64 return hook"
            else
              echo "[SKIP] fstat64 syscall not present in this kernel tree"
            fi

            if grep -Fq "SYSCALL_DEFINE4(fstatat64" fs/stat.c; then
              check_marker fs/stat.c "ksu_handle_stat(&dfd, &filename, &flag);" "fstatat64 stat hook"
            else
              echo "[SKIP] fstatat64 syscall not present in this kernel tree"
            fi

            echo
            if [ "$FAIL" -ne 0 ]; then
              echo "[ERROR] ReSukiSU manual hook diff/marker check failed. Missing required hook(s), stop build."
              exit 1
            fi

            echo "[DONE] ReSukiSU manual hook diff/marker check passed"
          } 2>&1 | tee logs/hook-diff-check.log

      - name: Force ReSukiSU required config
        run: |
          set -e

          DEFCONFIG_PATH=""

          if [ -f "arch/arm64/configs/${DEFCONFIG}" ]; then
            DEFCONFIG_PATH="arch/arm64/configs/${DEFCONFIG}"
          elif [ -f "arch/arm64/configs/vendor/${DEFCONFIG}" ]; then
            DEFCONFIG_PATH="arch/arm64/configs/vendor/${DEFCONFIG}"
          else
            echo "ERROR: defconfig not found: ${DEFCONFIG}"
            exit 1
          fi

          sed -i '/CONFIG_KALLSYMS=/d' "${DEFCONFIG_PATH}"
          sed -i '/CONFIG_KALLSYMS_ALL=/d' "${DEFCONFIG_PATH}"
          sed -i '/# CONFIG_KALLSYMS is not set/d' "${DEFCONFIG_PATH}"
          sed -i '/# CONFIG_KALLSYMS_ALL is not set/d' "${DEFCONFIG_PATH}"

          cat >> "${DEFCONFIG_PATH}" <<'EOF'

          # ReSukiSU static symbol export requirement
          CONFIG_KALLSYMS=y
          CONFIG_KALLSYMS_ALL=y
          EOF

          echo "Updated ${DEFCONFIG_PATH}:"
          grep -n "CONFIG_KALLSYMS" "${DEFCONFIG_PATH}" || true

      - name: Show ReSukiSU config
        run: |
          set -e
          set -o pipefail
          mkdir -p logs

          {
            DEFCONFIG_PATH=""

            if [ -f "arch/arm64/configs/${DEFCONFIG}" ]; then
              DEFCONFIG_PATH="arch/arm64/configs/${DEFCONFIG}"
            elif [ -f "arch/arm64/configs/vendor/${DEFCONFIG}" ]; then
              DEFCONFIG_PATH="arch/arm64/configs/vendor/${DEFCONFIG}"
            else
              echo "ERROR: defconfig not found: ${DEFCONFIG}"
              find arch/arm64/configs -name "*defconfig" | sort
              exit 1
            fi

            echo "DEFCONFIG_PATH=${DEFCONFIG_PATH}"
            grep -n "CONFIG_KSU" "${DEFCONFIG_PATH}" || true
            grep -n "CONFIG_KALLSYMS" "${DEFCONFIG_PATH}" || true
          } 2>&1 | tee logs/config.log

      - name: Build kernel using make and zip AnyKernel3 using template build.sh
        run: |
          set -e
          set -o pipefail
          mkdir -p logs artifacts/zips out

          SECONDS=0
          AK3_CACHE_DIR="$HOME/AnyKernel3"
          AK3_DIR="AnyKernel3"
          ZIPNAME="QuicksilveR-lisa-$(date '+%Y%m%d-%H%M')-${GITHUB_RUN_NUMBER}.zip"

          if test -z "$(git rev-parse --show-cdup 2>/dev/null)" && head=$(git rev-parse --verify HEAD 2>/dev/null); then
            ZIPNAME="${ZIPNAME::-4}-$(echo "$head" | cut -c1-8).zip"
          fi

          if [ "${{ github.event.inputs.jobs }}" = "auto" ]; then
            export JOBS="$(nproc --all)"
          else
            export JOBS="${{ github.event.inputs.jobs }}"
          fi

          export ARCH=arm64
          export SUBARCH=arm64
          export OUT_DIR="${OUT_DIR}"
          export DEFCONFIG="${DEFCONFIG}"

          TC_DIR="$HOME/tc/clang-r450784d"
          if [ -d "${TC_DIR}/bin" ]; then
            export PATH="${TC_DIR}/bin:${PATH}"
            MAKE_PARAMS="O=${OUT_DIR} ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1 CROSS_COMPILE=${TC_DIR}/bin/llvm-"
          else
            MAKE_PARAMS="O=${OUT_DIR} ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1"
          fi

          {
            echo "ARCH=${ARCH}"
            echo "SUBARCH=${SUBARCH}"
            echo "OUT_DIR=${OUT_DIR}"
            echo "DEFCONFIG=${DEFCONFIG}"
            echo "JOBS=${JOBS}"
            echo "MAKE_PARAMS=${MAKE_PARAMS}"
            echo "ZIPNAME=${ZIPNAME}"
            echo "GITHUB_SHA=${GITHUB_SHA}"
            echo "GITHUB_RUN_NUMBER=${GITHUB_RUN_NUMBER}"
          } | tee logs/build-env.log

          {
            echo "===== make ${DEFCONFIG} ====="
            make ${MAKE_PARAMS} "${DEFCONFIG}"

            echo
            echo "===== Starting compilation ====="
            make -j"${JOBS}" ${MAKE_PARAMS}

            echo
            echo "===== Install kernel modules ====="
            make -j"${JOBS}" ${MAKE_PARAMS} INSTALL_MOD_PATH=modules INSTALL_MOD_STRIP=1 modules_install

            kernel="${OUT_DIR}/arch/arm64/boot/Image"
            dtb="${OUT_DIR}/arch/arm64/boot/dts/vendor/qcom/yupik.dtb"
            dtbo="${OUT_DIR}/arch/arm64/boot/dts/vendor/qcom/lisa-sm7325-overlay.dtbo"

            if [ ! -f "${kernel}" ] || [ ! -f "${dtb}" ] || [ ! -f "${dtbo}" ]; then
              echo "ERROR: Compilation output missing"
              echo "kernel=${kernel}"
              echo "dtb=${dtb}"
              echo "dtbo=${dtbo}"
              find "${OUT_DIR}/arch/arm64/boot" -maxdepth 6 -type f -print || true
              exit 1
            fi

            echo
            echo "===== Prepare AnyKernel3 template ====="
            rm -rf "${AK3_DIR}"
            if [ -d "${AK3_CACHE_DIR}" ]; then
              cp -r "${AK3_CACHE_DIR}" "${AK3_DIR}"
              git -C "${AK3_DIR}" checkout lisa >/dev/null 2>&1 || true
            else
              git clone -q https://github.com/ghostrider-reborn/AnyKernel3 -b lisa "${AK3_DIR}"
            fi

            echo
            echo "===== Copy kernel, dtb, dtbo, and modules to AnyKernel3 ====="
            cp -v "${kernel}" "${AK3_DIR}/"
            cp -v "${dtb}" "${AK3_DIR}/dtb"

            PYTHON_DTC="python3"
            if command -v python2 >/dev/null 2>&1; then
              PYTHON_DTC="python2"
            fi
            "${PYTHON_DTC}" scripts/dtc/libfdt/mkdtboimg.py create "${AK3_DIR}/dtbo.img" --page_size=4096 "${dtbo}"

            MODULE_DEST="${AK3_DIR}/modules/vendor/lib/modules"
            mkdir -p "${MODULE_DEST}"
            MODULE_BASE="$(find out/modules/lib/modules -maxdepth 1 -type d -name "5.4*" | head -n 1 || true)"
            if [ -z "${MODULE_BASE}" ]; then
              echo "ERROR: module output directory not found under out/modules/lib/modules/5.4*"
              find out/modules -type f -o -type d | sort || true
              exit 1
            fi

            find "${MODULE_BASE}" -name "*.ko" -exec cp -v {} "${MODULE_DEST}/" \;
            cp -v "${MODULE_BASE}"/modules.{alias,dep,softdep} "${MODULE_DEST}/"
            cp -v "${MODULE_BASE}/modules.order" "${MODULE_DEST}/modules.load"
            sed -i 's#\(kernel/[^: ]*/\)\([^: ]*\.ko\)#/vendor/lib/modules/\2#g' "${MODULE_DEST}/modules.dep"
            sed -i 's#.*/##g' "${MODULE_DEST}/modules.load"

            echo
            echo "===== Zip AnyKernel3 ====="
            (
              cd "${AK3_DIR}"
              zip -r9 "../artifacts/zips/${ZIPNAME}" * -x .git README.md "*placeholder"
            )

            echo "Zip: artifacts/zips/${ZIPNAME}"
            unzip -l "artifacts/zips/${ZIPNAME}" | tee logs/anykernel3-zip-list.log
            echo "Completed in $((SECONDS / 60)) minute(s) and $((SECONDS % 60)) second(s)!"
          } 2>&1 | tee logs/build.log

      - name: Collect flashable zip
        if: always()
        run: |
          set -e
          set -o pipefail

          mkdir -p artifacts/zips
          mkdir -p logs

          {
            echo "Searching for flashable zip from build.sh..."

            mapfile -t ZIP_FILES < <(
              find . -type f -name "*.zip" \
                ! -path "./.git/*" \
                ! -path "./artifacts/*" \
                ! -path "./KernelSU-Next/*" \
                ! -path "./ReSukiSU/*" \
                | sort
            )

            if [ "${#ZIP_FILES[@]}" -eq 0 ]; then
              echo "WARNING: No zip found."
              echo "Available zip files:"
              find . -type f -name "*.zip" || true
            else
              echo "Found zip(s):"
              printf '%s\n' "${ZIP_FILES[@]}"

              for zipfile in "${ZIP_FILES[@]}"; do
                cp -v "${zipfile}" artifacts/zips/
              done
            fi

            echo "Artifacts ready:"
            find artifacts -type f -print || true
          } 2>&1 | tee logs/collect.log

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lisa-resukisu-build-logs-${{ github.run_number }}
          path: logs/**
          if-no-files-found: warn

      - name: Upload kernel artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lisa-kernel-resukisu-manual-${{ github.run_number }}
          path: artifacts/**
          if-no-files-found: warn

      - name: Upload zip to GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          set -e
          set -o pipefail

          if [ -z "${INPUT_RELEASE_TAG}" ]; then
            RELEASE_TAG="resukisu-lisa-${{ github.run_number }}"
          else
            RELEASE_TAG="${INPUT_RELEASE_TAG}"
          fi

          RELEASE_NAME="Lisa Kernel ReSukiSU Manual - ${RELEASE_TAG}"

          echo "Release tag: ${RELEASE_TAG}"

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Release exists"
          else
            echo "Creating release..."
            gh release create "${RELEASE_TAG}" \
              --title "${RELEASE_NAME}" \
              --notes "ReSukiSU manual hook AnyKernel3 build for Xiaomi lisa."
          fi

          ZIPS="$(find artifacts/zips -type f -name "*.zip" | sort)"

          if [ -z "${ZIPS}" ]; then
            echo "ERROR: no zip found to upload"
            exit 1
          fi

          echo "Uploading:"
          echo "${ZIPS}"

          gh release upload "${RELEASE_TAG}" ${ZIPS} --clobber
