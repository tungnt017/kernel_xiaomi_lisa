name: Build Lisa Kernel With SukiSU-Ultra Builtin Manual Hooks

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: "Defconfig name"
        required: true
        default: "lisa_defconfig"
      jobs:
        description: "Build jobs, auto = nproc"
        required: true
        default: "auto"
      release_tag:
        description: "GitHub Release tag name, empty = auto run number"
        required: false
        default: ""
      kallsyms_all:
        description: "Force CONFIG_KALLSYMS_ALL=y (set to 1 to enable)"
        required: false
        default: "1"
      disable_susfs:
        description: "Disable SUSFS in SukiSU-Ultra builtin branch (set to 1 to disable)"
        required: false
        default: "1"
      sanitize_polly:
        description: "Strip unsupported LLVM Polly flags if current clang does not support them"
        required: false
        default: "1"

permissions:
  contents: write

env:
  ARCH: arm64
  SUBARCH: arm64
  OUT_DIR: out
  DEFCONFIG: ${{ github.event.inputs.defconfig }}

jobs:
  build:
    name: Build SukiSU-Ultra builtin kernel
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Prepare build environment
        shell: bash
        run: |
          set -e
          set -o pipefail
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex git kmod libssl-dev \
            libelf-dev libncurses5-dev libncurses-dev lld llvm clang python3 zip \
            dwarves pahole jq \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi binutils-aarch64-linux-gnu
          mkdir -p logs debug "${OUT_DIR}"
          {
            echo "[INFO] Toolchain versions"
            clang --version || true
            ld.lld --version || true
            aarch64-linux-gnu-gcc --version | head -1 || true
            arm-linux-gnueabi-gcc --version | head -1 || true
          } 2>&1 | tee logs/toolchain.log

      - name: Setup SukiSU-Ultra builtin
        shell: bash
        run: |
          set -e
          set -o pipefail
          mkdir -p logs debug
          {
            echo "[INFO] Setup SukiSU-Ultra builtin"
            curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s builtin
            echo "[INFO] SukiSU paths after setup:"
            find . -maxdepth 5 -type d \( -iname "kernelsu" -o -iname "KernelSU" \) -print || true
            echo "[INFO] SukiSU Kconfig files:"
            find . -maxdepth 6 -type f -name "Kconfig" | grep -Ei "ksu|kernelsu|KernelSU" || true
          } 2>&1 | tee logs/setup-sukisu.log

      - name: Disable SukiSU-Ultra SUSFS default in Kconfig
        if: ${{ github.event.inputs.disable_susfs == '1' }}
        shell: bash
        run: |
          set -e
          set -o pipefail
          mkdir -p logs debug
          {
            echo "[INFO] Disable SUSFS default in SukiSU-Ultra Kconfig"

            KCONFIG_PATH=""
            for p in \
              "drivers/kernelsu/Kconfig" \
              "KernelSU/kernel/Kconfig" \
              "kernel/Kconfig"
            do
              if [ -f "$p" ] && grep -q "config KSU_SUSFS" "$p"; then
                KCONFIG_PATH="$p"
                break
              fi
            done

            if [ -z "$KCONFIG_PATH" ]; then
              echo "[ERROR] Cannot find Kconfig containing config KSU_SUSFS"
              find . -name "Kconfig" | sort | tee debug/kconfig-list.txt
              exit 1
            fi

            echo "[INFO] Kconfig path: ${KCONFIG_PATH}"
            echo "${KCONFIG_PATH}" > debug/susfs-kconfig-path.txt

            echo "[INFO] Before patch:"
            grep -A35 -n "^config KSU_SUSFS$" "${KCONFIG_PATH}" | tee debug/susfs-kconfig-before.txt || true

            BEFORE_HASH="$(sha256sum "${KCONFIG_PATH}" | awk '{print $1}')"
            perl -0pi -e 's/(config KSU_SUSFS\b.*?\n[ \t]*default[ \t]+)y\b/${1}n/s' "${KCONFIG_PATH}"
            AFTER_HASH="$(sha256sum "${KCONFIG_PATH}" | awk '{print $1}')"

            echo "[INFO] After patch:"
            grep -A35 -n "^config KSU_SUSFS$" "${KCONFIG_PATH}" | tee debug/susfs-kconfig-after.txt || true

            if grep -A35 "^config KSU_SUSFS$" "${KCONFIG_PATH}" | grep -q "default[[:space:]]\+n"; then
              if [ "${BEFORE_HASH}" = "${AFTER_HASH}" ]; then
                echo "[OK] CONFIG_KSU_SUSFS already default n"
              else
                echo "[OK] Changed CONFIG_KSU_SUSFS default y -> default n in ${KCONFIG_PATH}"
              fi
            else
              echo "[ERROR] CONFIG_KSU_SUSFS default n not confirmed after patch"
              exit 2
            fi
          } 2>&1 | tee logs/disable-susfs-kconfig.log

      - name: Apply SukiSU-Ultra manual hooks
        shell: bash
        run: |
          set -e
          set -o pipefail
          mkdir -p logs debug
          {
            echo "[INFO] Looking for apply_sukisu_ultra_manual_hooks.py"

            HOOK_SCRIPT=""
            for p in \
              "apply_sukisu_ultra_manual_hooks.py" \
              ".github/scripts/apply_sukisu_ultra_manual_hooks.py" \
              "scripts/apply_sukisu_ultra_manual_hooks.py" \
              "tools/apply_sukisu_ultra_manual_hooks.py"
            do
              if [ -f "$p" ]; then
                HOOK_SCRIPT="$p"
                break
              fi
            done

            if [ -z "$HOOK_SCRIPT" ]; then
              echo "[ERROR] apply_sukisu_ultra_manual_hooks.py not found. Manual hook workflow requires this script."
              find . -maxdepth 5 -type f \( -name "*sukisu*hook*.py" -o -name "*manual*hook*.py" \) | sort | tee debug/manual-hook-script-search.txt || true
              exit 1
            fi

            echo "[INFO] Hook script: ${HOOK_SCRIPT}"
            cp "$HOOK_SCRIPT" debug/apply_sukisu_ultra_manual_hooks.used.py

            export SUKISU_KALLSYMS_ALL="${{ github.event.inputs.kallsyms_all }}"
            python3 "$HOOK_SCRIPT" "${DEFCONFIG}"
          } 2>&1 | tee logs/apply-manual-hooks.log

      - name: Force disable SUSFS in defconfig
        if: ${{ github.event.inputs.disable_susfs == '1' }}
        shell: bash
        run: |
          set -e
          set -o pipefail
          mkdir -p logs debug
          {
            DEFCONFIG_PATH=""
            for p in \
              "arch/arm64/configs/${DEFCONFIG}" \
              "arch/arm64/configs/vendor/${DEFCONFIG}"
            do
              if [ -f "$p" ]; then
                DEFCONFIG_PATH="$p"
                break
              fi
            done

            if [ -z "$DEFCONFIG_PATH" ]; then
              echo "[ERROR] Defconfig not found: ${DEFCONFIG}"
              find arch/arm64/configs -name "*defconfig" | sort | tee debug/defconfig-list.txt || true
              exit 1
            fi

            echo "[INFO] Defconfig path: ${DEFCONFIG_PATH}"
            echo "${DEFCONFIG_PATH}" > debug/defconfig-path.txt
            cp "$DEFCONFIG_PATH" debug/defconfig-before-disable-susfs.txt

            sed -i '/^CONFIG_KSU_SUSFS=/d' "$DEFCONFIG_PATH"
            sed -i '/^# CONFIG_KSU_SUSFS is not set/d' "$DEFCONFIG_PATH"
            sed -i '/^CONFIG_KSU_SUSFS_/d' "$DEFCONFIG_PATH"
            sed -i '/^# CONFIG_KSU_SUSFS_.* is not set/d' "$DEFCONFIG_PATH"

            {
              echo ""
              echo "# SukiSU-Ultra: force disable SUSFS"
              echo "# CONFIG_KSU_SUSFS is not set"
            } >> "$DEFCONFIG_PATH"

            cp "$DEFCONFIG_PATH" debug/defconfig-after-disable-susfs.txt
            echo "[OK] Forced CONFIG_KSU_SUSFS=n in defconfig"
            tail -60 "$DEFCONFIG_PATH"
          } 2>&1 | tee logs/disable-susfs-defconfig.log

      - name: Sanitize unsupported LLVM Polly flags
        if: ${{ github.event.inputs.sanitize_polly == '1' }}
        shell: bash
        run: |
          set -e
          set -o pipefail
          mkdir -p logs debug
          {
            echo "[INFO] Checking whether current clang supports LLVM Polly flags"
            echo 'int main(void){return 0;}' > /tmp/polly-test.c
            if clang -Werror -mllvm -polly -x c -c /tmp/polly-test.c -o /tmp/polly-test.o >/tmp/polly-test.log 2>&1; then
              echo "[OK] clang accepts -mllvm -polly; no flag sanitization needed"
              cat /tmp/polly-test.log || true
              exit 0
            fi

            echo "[WARN] clang does not accept -mllvm -polly on this runner"
            cat /tmp/polly-test.log || true
            echo "[INFO] Searching Polly flags in build files"
            grep -RIn --exclude-dir=.git --exclude-dir="${OUT_DIR}" -E "-mllvm|-polly" . | tee debug/polly-flags-before.txt || true

            # Remove common Polly optimization flags from text build files.
            # This avoids GCC/Clang failures on runners without Polly-enabled LLVM.
            find . \
              -path "./.git" -prune -o \
              -path "./${OUT_DIR}" -prune -o \
              -type f \( -name "Makefile" -o -name "Kbuild" -o -name "*.mk" -o -name "*.conf" -o -name "*defconfig" \) \
              -print0 | xargs -0 perl -pi -e '
                s/\s*-mllvm\s+-polly(?:=[^\s]+)?//g;
                s/\s*-mllvm\s+-polly-[^\s]+//g;
                s/\s*-polly(?:-[^\s]+)?(?:=[^\s]+)?//g;
              '

            echo "[INFO] Polly flags after sanitization:"
            grep -RIn --exclude-dir=.git --exclude-dir="${OUT_DIR}" -E "-mllvm|-polly" . | tee debug/polly-flags-after.txt || true
          } 2>&1 | tee logs/sanitize-polly.log

      - name: Generate kernel config
        shell: bash
        run: |
          set -e
          set -o pipefail
          mkdir -p logs debug "${OUT_DIR}"
          {
            echo "[INFO] Generate .config from ${DEFCONFIG}"
            MAKE_ARGS=(
              O="${OUT_DIR}"
              ARCH=arm64
              LLVM=1
              LLVM_IAS=1
              CC=clang
              LD=ld.lld
              AR=llvm-ar
              NM=llvm-nm
              OBJCOPY=llvm-objcopy
              OBJDUMP=llvm-objdump
              STRIP=llvm-strip
              CROSS_COMPILE=aarch64-linux-gnu-
              CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            )
            make "${MAKE_ARGS[@]}" "${DEFCONFIG}"
            cp "${OUT_DIR}/.config" debug/config-after-defconfig.txt
          } 2>&1 | tee logs/generate-config.log

      - name: Verify SUSFS disabled before build
        if: ${{ github.event.inputs.disable_susfs == '1' }}
        shell: bash
        run: |
          set -e
          set -o pipefail
          mkdir -p logs debug
          {
            CONFIG_FILE="${OUT_DIR}/.config"
            if [ ! -f "$CONFIG_FILE" ]; then
              echo "[ERROR] ${CONFIG_FILE} not found. Run defconfig before this step."
              exit 1
            fi

            echo "[INFO] Verify SUSFS status in ${CONFIG_FILE}"
            grep -nE "CONFIG_KSU|CONFIG_KPM|CONFIG_KALLSYMS|SUSFS" "$CONFIG_FILE" | tee debug/ksu-config-before-build.txt || true

            if grep -q "^CONFIG_KSU_SUSFS=y" "$CONFIG_FILE"; then
              echo "[ERROR] CONFIG_KSU_SUSFS is still enabled"
              grep -n "CONFIG_KSU_SUSFS" "$CONFIG_FILE" || true
              exit 1
            fi

            if grep -q "^CONFIG_KSU_SUSFS_" "$CONFIG_FILE"; then
              echo "[ERROR] Some CONFIG_KSU_SUSFS_* options are still enabled:"
              grep -n "^CONFIG_KSU_SUSFS_" "$CONFIG_FILE"
              exit 1
            fi

            if grep -q "^# CONFIG_KSU_SUSFS is not set" "$CONFIG_FILE"; then
              echo "[OK] CONFIG_KSU_SUSFS is disabled"
            elif ! grep -q "CONFIG_KSU_SUSFS" "$CONFIG_FILE"; then
              echo "[OK] CONFIG_KSU_SUSFS absent from .config, treated as disabled"
            else
              echo "[ERROR] Unexpected CONFIG_KSU_SUSFS state"
              grep -n "CONFIG_KSU_SUSFS" "$CONFIG_FILE"
              exit 1
            fi
            echo "[OK] SUSFS disabled verification passed"
          } 2>&1 | tee logs/verify-susfs-disabled.log

      - name: Verify SukiSU manual hook before build
        shell: bash
        run: |
          set -e
          set -o pipefail
          mkdir -p logs debug
          {
            CONFIG_FILE="${OUT_DIR}/.config"
            if [ ! -f "$CONFIG_FILE" ]; then
              echo "[ERROR] ${CONFIG_FILE} not found"
              exit 1
            fi

            echo "[INFO] Verify SukiSU hook mode in ${CONFIG_FILE}"
            grep -nE "CONFIG_KSU|CONFIG_KPROBES|CONFIG_KSU_MANUAL_HOOK|CONFIG_KSU_TRACEPOINT_HOOK|CONFIG_KPM|CONFIG_KALLSYMS|SUSFS" "$CONFIG_FILE" \
              | tee debug/ksu-hook-config-before-build.txt || true

            if grep -q "^CONFIG_KSU_MANUAL_HOOK=y" "$CONFIG_FILE"; then
              echo "[OK] CONFIG_KSU_MANUAL_HOOK=y confirmed"
            else
              echo "[ERROR] CONFIG_KSU_MANUAL_HOOK=y not found"
              grep -nE "CONFIG_KSU_MANUAL_HOOK|CONFIG_KSU_TRACEPOINT_HOOK|CONFIG_KPROBES|CONFIG_KSU" "$CONFIG_FILE" || true
              exit 1
            fi

            if grep -q "^CONFIG_KSU_TRACEPOINT_HOOK=y" "$CONFIG_FILE"; then
              echo "[ERROR] CONFIG_KSU_TRACEPOINT_HOOK=y found, expected manual hook only"
              exit 1
            fi

            echo "[INFO] Verify manual hook source patches"
            grep -n "ksu_handle_execveat" fs/exec.c | tee debug/source-hook-exec.txt || true
            grep -n "ksu_handle_faccessat" fs/open.c | tee debug/source-hook-open.txt || true
            grep -n "ksu_handle_stat" fs/stat.c | tee debug/source-hook-stat.txt || true
            grep -n "ksu_handle_sys_reboot" kernel/reboot.c | tee debug/source-hook-reboot.txt || true

            if ! grep -q "ksu_handle_execveat" fs/exec.c; then
              echo "[ERROR] fs/exec.c manual hook was not found"
              exit 1
            fi
            if ! grep -q "ksu_handle_faccessat" fs/open.c; then
              echo "[ERROR] fs/open.c manual hook was not found"
              exit 1
            fi
            if ! grep -q "ksu_handle_stat" fs/stat.c; then
              echo "[ERROR] fs/stat.c manual hook was not found"
              exit 1
            fi

            echo "[OK] Manual hook config and source verification passed"
          } 2>&1 | tee logs/verify-manual-hook.log

      - name: Create debug file 1 - source tree and SukiSU state
        if: always()
        shell: bash
        run: |
          mkdir -p debug
          {
            echo "===== DEBUG 1: TREE AND SUKISU STATE ====="
            echo "Date: $(date -u)"
            echo "Commit: ${GITHUB_SHA:-unknown}"
            echo
            echo "===== SukiSU directories ====="
            find . -maxdepth 5 -type d \( -iname "kernelsu" -o -iname "KernelSU" \) -print 2>/dev/null || true
            echo
            echo "===== SukiSU Kconfig files ====="
            find . -maxdepth 6 -type f -name "Kconfig" | grep -Ei "ksu|kernelsu|KernelSU" || true
            echo
            echo "===== KSU_SUSFS in source ====="
            grep -R "KSU_SUSFS" -n drivers/kernelsu KernelSU kernel 2>/dev/null || true
          } > debug/01-tree-and-sukisu-state.txt

      - name: Create debug file 2 - Kconfig and .config state
        if: always()
        shell: bash
        run: |
          mkdir -p debug
          {
            echo "===== DEBUG 2: KCONFIG AND CONFIG STATE ====="
            echo "DEFCONFIG=${DEFCONFIG}"
            echo "OUT_DIR=${OUT_DIR}"
            echo
            echo "===== Defconfig path ====="
            cat debug/defconfig-path.txt 2>/dev/null || true
            echo
            echo "===== SUSFS Kconfig before ====="
            cat debug/susfs-kconfig-before.txt 2>/dev/null || true
            echo
            echo "===== SUSFS Kconfig after ====="
            cat debug/susfs-kconfig-after.txt 2>/dev/null || true
            echo
            echo "===== KSU config before build ====="
            cat debug/ksu-config-before-build.txt 2>/dev/null || true
            echo
            echo "===== KSU manual hook config before build ====="
            cat debug/ksu-hook-config-before-build.txt 2>/dev/null || true
            echo
            echo "===== Raw .config KSU/SUSFS lines ====="
            grep -nE "SUSFS|CONFIG_KSU|CONFIG_KPM|CONFIG_KALLSYMS|CONFIG_KPROBES" "${OUT_DIR}/.config" 2>/dev/null || true
          } > debug/02-kconfig-and-config-state.txt

      - name: Build kernel
        shell: bash
        run: |
          set -e
          set -o pipefail
          mkdir -p logs debug
          if [ "${{ github.event.inputs.jobs }}" = "auto" ]; then
            JOBS="$(nproc --all)"
          else
            JOBS="${{ github.event.inputs.jobs }}"
          fi

          MAKE_ARGS=(
            O="${OUT_DIR}"
            ARCH=arm64
            LLVM=1
            LLVM_IAS=1
            CC=clang
            LD=ld.lld
            AR=llvm-ar
            NM=llvm-nm
            OBJCOPY=llvm-objcopy
            OBJDUMP=llvm-objdump
            STRIP=llvm-strip
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          )

          echo "[INFO] Starting compilation with jobs=${JOBS}" | tee logs/build.log
          echo "[INFO] clang version:" | tee -a logs/build.log
          clang --version | tee -a logs/build.log

          echo "[INFO] Final SukiSU hook/SUSFS config before build:" | tee -a logs/build.log
          grep -nE "CONFIG_KSU|CONFIG_KSU_MANUAL_HOOK|CONFIG_KSU_TRACEPOINT_HOOK|CONFIG_KPROBES|CONFIG_KPM|CONFIG_KALLSYMS|SUSFS" "${OUT_DIR}/.config" \
            | tee -a logs/build.log || true

          if grep -q "^CONFIG_KSU_MANUAL_HOOK=y" "${OUT_DIR}/.config"; then
            echo "[OK] Build is using SukiSU manual hook: CONFIG_KSU_MANUAL_HOOK=y" | tee -a logs/build.log
          else
            echo "[ERROR] Build is NOT using SukiSU manual hook" | tee -a logs/build.log
            exit 1
          fi

          if grep -q "^CONFIG_KSU_SUSFS=y" "${OUT_DIR}/.config"; then
            echo "[ERROR] CONFIG_KSU_SUSFS is enabled before build" | tee -a logs/build.log
            exit 1
          fi
          if grep -q "^CONFIG_KSU_SUSFS_" "${OUT_DIR}/.config"; then
            echo "[ERROR] Some CONFIG_KSU_SUSFS_* options are enabled before build" | tee -a logs/build.log
            grep -n "^CONFIG_KSU_SUSFS_" "${OUT_DIR}/.config" | tee -a logs/build.log
            exit 1
          fi
          echo "[OK] SUSFS is disabled before build" | tee -a logs/build.log

          echo "[INFO] Manual hook source markers:" | tee -a logs/build.log
          grep -n "ksu_handle_execveat" fs/exec.c | tee -a logs/build.log || true
          grep -n "ksu_handle_faccessat" fs/open.c | tee -a logs/build.log || true
          grep -n "ksu_handle_stat" fs/stat.c | tee -a logs/build.log || true
          grep -n "ksu_handle_sys_reboot" kernel/reboot.c | tee -a logs/build.log || true

          make "${MAKE_ARGS[@]}" -j"${JOBS}" 2>&1 | tee -a logs/build.log

      - name: Create debug file 3 - errors and build summary
        if: always()
        shell: bash
        run: |
          mkdir -p debug logs
          {
            echo "===== DEBUG 3: ERRORS AND BUILD SUMMARY ====="
            echo "Date: $(date -u)"
            echo
            echo "===== Error-like lines from logs ====="
            grep -RniE "error:|undefined reference|implicit declaration|incompatible type|No rule to make target|fatal:|FAILED|Error [0-9]+|unrecognized command-line option" logs 2>/dev/null || true
            echo
            echo "===== Last 300 lines of build.log ====="
            tail -300 logs/build.log 2>/dev/null || true
            echo
            echo "===== Output artifacts found ====="
            find "${OUT_DIR}" arch/arm64/boot -maxdepth 5 -type f \( -name "Image" -o -name "Image.gz" -o -name "*.dtb" -o -name "*.dtbo" -o -name "*.ko" \) 2>/dev/null | sort | head -300 || true
          } > debug/03-errors-and-build-summary.txt

      - name: Upload debug logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sukisu-ultra-debug-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            logs/**
            debug/01-tree-and-sukisu-state.txt
            debug/02-kconfig-and-config-state.txt
            debug/03-errors-and-build-summary.txt
            debug/*.txt
            out/.config

      - name: Package kernel outputs
        if: success()
        shell: bash
        run: |
          set -e
          set -o pipefail
          mkdir -p artifacts
          find "${OUT_DIR}" arch/arm64/boot -maxdepth 5 -type f \( -name "Image" -o -name "Image.gz" -o -name "*.dtb" -o -name "*.dtbo" \) -exec cp -v {} artifacts/ \; 2>/dev/null || true
          ls -lah artifacts || true

      - name: Upload kernel outputs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sukisu-ultra-kernel-${{ github.run_number }}
          if-no-files-found: warn
          path: artifacts/**
