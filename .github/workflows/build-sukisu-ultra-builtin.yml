name: Build Lisa Kernel With SukiSU-Ultra Builtin Manual Hooks

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: "Defconfig name"
        required: true
        default: "lisa_defconfig"
      jobs:
        description: "Build jobs, auto = nproc"
        required: true
        default: "auto"
      release_tag:
        description: "GitHub Release tag name, empty = auto run number"
        required: false
        default: ""
      kallsyms_all:
        description: "Force CONFIG_KALLSYMS_ALL=y (set to 1 to enable)"
        required: false
        default: "0"
      disable_susfs:
        description: "Disable SUSFS in SukiSU-Ultra builtin branch (set to 1 to disable)"
        required: false
        default: "1"

permissions:
  contents: write

env:
  ARCH: arm64
  SUBARCH: arm64
  OUT_DIR: out
  DEFCONFIG: ${{ github.event.inputs.defconfig }}

jobs:
  build:
    name: Build SukiSU-Ultra builtin kernel
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Prepare build environment
        shell: bash
        run: |
          set -e
          set -o pipefail
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex git kmod libssl-dev \
            libelf-dev libncurses5-dev libncurses-dev lld llvm python3 zip \
            dwarves pahole jq
          mkdir -p logs debug "${OUT_DIR}"

      - name: Setup SukiSU-Ultra builtin
        shell: bash
        run: |
          set -e
          set -o pipefail
          mkdir -p logs debug
          {
            echo "[INFO] Setup SukiSU-Ultra builtin"
            curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s builtin
            echo "[INFO] SukiSU paths after setup:"
            find . -maxdepth 5 -type d \( -iname "kernelsu" -o -iname "KernelSU" \) -print || true
            find . -maxdepth 6 -type f -name "Kconfig" | grep -Ei "ksu|kernelsu|KernelSU" || true
          } 2>&1 | tee logs/setup-sukisu.log

      - name: Disable SukiSU-Ultra SUSFS default in Kconfig
        if: ${{ github.event.inputs.disable_susfs == '1' }}
        shell: bash
        run: |
          set -e
          set -o pipefail
          mkdir -p logs debug
          {
            echo "[INFO] Disable SUSFS default in SukiSU-Ultra Kconfig"

            KCONFIG_PATH=""
            for p in \
              "drivers/kernelsu/Kconfig" \
              "KernelSU/kernel/Kconfig" \
              "kernel/Kconfig"
            do
              if [ -f "$p" ] && grep -q "config KSU_SUSFS" "$p"; then
                KCONFIG_PATH="$p"
                break
              fi
            done

            if [ -z "$KCONFIG_PATH" ]; then
              echo "[ERROR] Cannot find Kconfig containing config KSU_SUSFS"
              find . -name "Kconfig" | sort | tee debug/kconfig-list.txt
              exit 1
            fi

            echo "[INFO] Kconfig path: ${KCONFIG_PATH}"
            echo "${KCONFIG_PATH}" > debug/susfs-kconfig-path.txt

            echo "[INFO] Before patch:"
            grep -A35 -n "^config KSU_SUSFS$" "${KCONFIG_PATH}" | tee debug/susfs-kconfig-before.txt || true

            BEFORE_HASH="$(sha256sum "${KCONFIG_PATH}" | awk '{print $1}')"

            # Patch only the parent config KSU_SUSFS block:
            #   config KSU_SUSFS ... default y  ->  default n
            # No python -c and no heredoc are used here, so there is no PYEOF or IndentationError issue.
            perl -0pi -e 's/(config KSU_SUSFS\b.*?\n[ \t]*default[ \t]+)y\b/${1}n/s' "${KCONFIG_PATH}"

            AFTER_HASH="$(sha256sum "${KCONFIG_PATH}" | awk '{print $1}')"

            echo "[INFO] After patch:"
            grep -A35 -n "^config KSU_SUSFS$" "${KCONFIG_PATH}" | tee debug/susfs-kconfig-after.txt || true

            if grep -A35 "^config KSU_SUSFS$" "${KCONFIG_PATH}" | grep -q "default[[:space:]]\+n"; then
              if [ "${BEFORE_HASH}" = "${AFTER_HASH}" ]; then
                echo "[OK] CONFIG_KSU_SUSFS already default n"
              else
                echo "[OK] Changed CONFIG_KSU_SUSFS default y -> default n in ${KCONFIG_PATH}"
              fi
            else
              echo "[ERROR] CONFIG_KSU_SUSFS default n not confirmed after patch"
              exit 2
            fi
          } 2>&1 | tee logs/disable-susfs-kconfig.log

      - name: Apply SukiSU-Ultra manual hooks
        shell: bash
        run: |
          set -e
          set -o pipefail
          mkdir -p logs debug
          {
            if [ ! -f "apply_sukisu_ultra_manual_hooks.py" ]; then
              echo "[ERROR] apply_sukisu_ultra_manual_hooks.py not found in repository root"
              exit 1
            fi
            export SUKISU_KALLSYMS_ALL="${{ github.event.inputs.kallsyms_all }}"
            python3 apply_sukisu_ultra_manual_hooks.py "${DEFCONFIG}"
          } 2>&1 | tee logs/apply-manual-hooks.log

      - name: Force disable SUSFS in defconfig
        if: ${{ github.event.inputs.disable_susfs == '1' }}
        shell: bash
        run: |
          set -e
          set -o pipefail
          mkdir -p logs debug
          {
            DEFCONFIG_PATH=""
            for p in \
              "arch/arm64/configs/${DEFCONFIG}" \
              "arch/arm64/configs/vendor/${DEFCONFIG}"
            do
              if [ -f "$p" ]; then
                DEFCONFIG_PATH="$p"
                break
              fi
            done

            if [ -z "$DEFCONFIG_PATH" ]; then
              echo "[ERROR] Defconfig not found: ${DEFCONFIG}"
              find arch/arm64/configs -name "*defconfig" | sort | tee debug/defconfig-list.txt || true
              exit 1
            fi

            echo "[INFO] Defconfig path: ${DEFCONFIG_PATH}"
            echo "${DEFCONFIG_PATH}" > debug/defconfig-path.txt
            cp "$DEFCONFIG_PATH" debug/defconfig-before-disable-susfs.txt

            sed -i '/^CONFIG_KSU_SUSFS=/d' "$DEFCONFIG_PATH"
            sed -i '/^# CONFIG_KSU_SUSFS is not set/d' "$DEFCONFIG_PATH"
            sed -i '/^CONFIG_KSU_SUSFS_/d' "$DEFCONFIG_PATH"
            sed -i '/^# CONFIG_KSU_SUSFS_.* is not set/d' "$DEFCONFIG_PATH"

            {
              echo ""
              echo "# SukiSU-Ultra: force disable SUSFS"
              echo "# CONFIG_KSU_SUSFS is not set"
            } >> "$DEFCONFIG_PATH"

            cp "$DEFCONFIG_PATH" debug/defconfig-after-disable-susfs.txt
            echo "[OK] Forced CONFIG_KSU_SUSFS=n in defconfig"
            tail -40 "$DEFCONFIG_PATH"
          } 2>&1 | tee logs/disable-susfs-defconfig.log

      - name: Generate kernel config
        shell: bash
        run: |
          set -e
          set -o pipefail
          mkdir -p logs debug "${OUT_DIR}"
          {
            echo "[INFO] Generate .config from ${DEFCONFIG}"
            make O="${OUT_DIR}" "${DEFCONFIG}"
            cp "${OUT_DIR}/.config" debug/config-after-defconfig.txt
          } 2>&1 | tee logs/generate-config.log

      - name: Verify SUSFS disabled before build
        if: ${{ github.event.inputs.disable_susfs == '1' }}
        shell: bash
        run: |
          set -e
          set -o pipefail
          mkdir -p logs debug
          {
            CONFIG_FILE="${OUT_DIR}/.config"
            if [ ! -f "$CONFIG_FILE" ]; then
              echo "[ERROR] ${CONFIG_FILE} not found. Run defconfig before this step."
              exit 1
            fi

            echo "[INFO] Verify SUSFS status in ${CONFIG_FILE}"
            grep -nE "CONFIG_KSU|CONFIG_KPM|CONFIG_KALLSYMS|SUSFS" "$CONFIG_FILE" | tee debug/ksu-config-before-build.txt || true

            if grep -q "^CONFIG_KSU_SUSFS=y" "$CONFIG_FILE"; then
              echo "[ERROR] CONFIG_KSU_SUSFS is still enabled"
              grep -n "CONFIG_KSU_SUSFS" "$CONFIG_FILE" || true
              exit 1
            fi

            if grep -q "^CONFIG_KSU_SUSFS_" "$CONFIG_FILE"; then
              echo "[ERROR] Some CONFIG_KSU_SUSFS_* options are still enabled:"
              grep -n "^CONFIG_KSU_SUSFS_" "$CONFIG_FILE"
              exit 1
            fi

            if grep -q "^# CONFIG_KSU_SUSFS is not set" "$CONFIG_FILE"; then
              echo "[OK] CONFIG_KSU_SUSFS is disabled"
            elif ! grep -q "CONFIG_KSU_SUSFS" "$CONFIG_FILE"; then
              echo "[OK] CONFIG_KSU_SUSFS absent from .config, treated as disabled"
            else
              echo "[ERROR] Unexpected CONFIG_KSU_SUSFS state"
              grep -n "CONFIG_KSU_SUSFS" "$CONFIG_FILE"
              exit 1
            fi
            echo "[OK] SUSFS disabled verification passed"
          } 2>&1 | tee logs/verify-susfs-disabled.log

      - name: Create debug file 1 - source tree and SukiSU state
        if: always()
        shell: bash
        run: |
          mkdir -p debug
          {
            echo "===== DEBUG 1: TREE AND SUKISU STATE ====="
            echo "Date: $(date -u)"
            echo "Commit: ${GITHUB_SHA:-unknown}"
            echo
            echo "===== SukiSU directories ====="
            find . -maxdepth 5 -type d \( -iname "kernelsu" -o -iname "KernelSU" \) -print 2>/dev/null || true
            echo
            echo "===== SukiSU Kconfig files ====="
            find . -maxdepth 6 -type f -name "Kconfig" | grep -Ei "ksu|kernelsu|KernelSU" || true
            echo
            echo "===== KSU_SUSFS in source ====="
            grep -R "KSU_SUSFS" -n drivers/kernelsu KernelSU kernel 2>/dev/null || true
          } > debug/01-tree-and-sukisu-state.txt

      - name: Create debug file 2 - Kconfig and .config state
        if: always()
        shell: bash
        run: |
          mkdir -p debug
          {
            echo "===== DEBUG 2: KCONFIG AND CONFIG STATE ====="
            echo "DEFCONFIG=${DEFCONFIG}"
            echo "OUT_DIR=${OUT_DIR}"
            echo
            echo "===== Defconfig path ====="
            cat debug/defconfig-path.txt 2>/dev/null || true
            echo
            echo "===== SUSFS Kconfig before ====="
            cat debug/susfs-kconfig-before.txt 2>/dev/null || true
            echo
            echo "===== SUSFS Kconfig after ====="
            cat debug/susfs-kconfig-after.txt 2>/dev/null || true
            echo
            echo "===== KSU config before build ====="
            cat debug/ksu-config-before-build.txt 2>/dev/null || true
            echo
            echo "===== Raw .config SUSFS lines ====="
            grep -nE "SUSFS|CONFIG_KSU|CONFIG_KPM|CONFIG_KALLSYMS" "${OUT_DIR}/.config" 2>/dev/null || true
          } > debug/02-kconfig-and-config-state.txt

      - name: Build kernel
        shell: bash
        run: |
          set -e
          set -o pipefail
          mkdir -p logs debug
          if [ "${{ github.event.inputs.jobs }}" = "auto" ]; then
            JOBS="$(nproc --all)"
          else
            JOBS="${{ github.event.inputs.jobs }}"
          fi
          echo "[INFO] Starting compilation with jobs=${JOBS}" | tee logs/build.log
          make O="${OUT_DIR}" -j"${JOBS}" 2>&1 | tee -a logs/build.log

      - name: Create debug file 3 - errors and build summary
        if: always()
        shell: bash
        run: |
          mkdir -p debug logs
          {
            echo "===== DEBUG 3: ERRORS AND BUILD SUMMARY ====="
            echo "Date: $(date -u)"
            echo
            echo "===== Error-like lines from logs ====="
            grep -RniE "error:|undefined reference|implicit declaration|incompatible type|No rule to make target|fatal:|FAILED|Error [0-9]+" logs 2>/dev/null || true
            echo
            echo "===== Last 300 lines of build.log ====="
            tail -300 logs/build.log 2>/dev/null || true
            echo
            echo "===== Output artifacts found ====="
            find "${OUT_DIR}" arch/arm64/boot -maxdepth 5 -type f \( -name "Image" -o -name "Image.gz" -o -name "*.dtb" -o -name "*.dtbo" -o -name "*.ko" \) 2>/dev/null | sort | head -300 || true
          } > debug/03-errors-and-build-summary.txt

      - name: Upload debug logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sukisu-ultra-debug-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            logs/**
            debug/01-tree-and-sukisu-state.txt
            debug/02-kconfig-and-config-state.txt
            debug/03-errors-and-build-summary.txt
            debug/*.txt
            out/.config

      - name: Package kernel outputs
        if: success()
        shell: bash
        run: |
          set -e
          set -o pipefail
          mkdir -p artifacts
          find "${OUT_DIR}" arch/arm64/boot -maxdepth 5 -type f \( -name "Image" -o -name "Image.gz" -o -name "*.dtb" -o -name "*.dtbo" \) -exec cp -v {} artifacts/ \; 2>/dev/null || true
          ls -lah artifacts || true

      - name: Upload kernel outputs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sukisu-ultra-kernel-${{ github.run_number }}
          if-no-files-found: warn
          path: artifacts/**
