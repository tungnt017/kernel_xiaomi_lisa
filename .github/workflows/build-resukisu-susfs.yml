name: Build ReSukiSU SUSFS Full Kernel

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: "Kernel defconfig"
        required: true
        default: "lisa_defconfig"
      susfs_repo:
        description: "SUSFS repo URL"
        required: true
        default: "https://gitlab.com/simonpunk/susfs4ksu.git"
      susfs_branch:
        description: "SUSFS branch matching kernel version"
        required: true
        default: "kernel-5.4"
      susfs_kernel_patch:
        description: "Optional SUSFS kernel patch path/name. Empty = auto select 5.4 patch"
        required: false
        default: ""
      resukisu_ref:
        description: "ReSukiSU commit/tag/branch to pin. Empty = setup.sh default/latest"
        required: false
        default: ""
      susfs_ref:
        description: "SUSFS commit/tag to pin after clone. Empty = branch latest"
        required: false
        default: ""
      jobs:
        description: "Parallel build jobs"
        required: true
        default: "$(nproc)"
      upload_full_out:
        description: "Upload out/ directory on failure for debugging"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  ARCH: arm64
  SUBARCH: arm64
  OUT_DIR: out
  DEFCONFIG: ${{ github.event.inputs.defconfig }}
  SUSFS_REPO: ${{ github.event.inputs.susfs_repo }}
  SUSFS_BRANCH: ${{ github.event.inputs.susfs_branch }}
  SUSFS_KERNEL_PATCH: ${{ github.event.inputs.susfs_kernel_patch }}
  RESUKISU_REF: ${{ github.event.inputs.resukisu_ref }}
  SUSFS_REF: ${{ github.event.inputs.susfs_ref }}
  ALLOW_SUSFS_KERNEL_REJECTS: "true"
  # Full mode should stay false. If true, script may continue past KSU patch failure,
  # but verify_real_symbols will still fail if real SUSFS symbols are missing.
  ALLOW_SUSFS_KSU_PATCH_REJECTS: "false"

jobs:
  build:
    name: Build lisa ReSukiSU + SUSFS full
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Prepare build dependencies
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex git git-lfs gnupg \
            libelf-dev libssl-dev lld llvm make openssl python3 python3-pip \
            rsync unzip wget zip zstd
          mkdir -p logs artifacts

      - name: Capture initial environment
        run: |
          set -e
          {
            echo "DATE_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "RUNNER_OS=${RUNNER_OS}"
            echo "ARCH=${ARCH}"
            echo "SUBARCH=${SUBARCH}"
            echo "OUT_DIR=${OUT_DIR}"
            echo "DEFCONFIG=${DEFCONFIG}"
            echo "SUSFS_REPO=${SUSFS_REPO}"
            echo "SUSFS_BRANCH=${SUSFS_BRANCH}"
            echo "SUSFS_KERNEL_PATCH=${SUSFS_KERNEL_PATCH}"
            echo "RESUKISU_REF=${RESUKISU_REF}"
            echo "SUSFS_REF=${SUSFS_REF}"
            echo "ALLOW_SUSFS_KERNEL_REJECTS=${ALLOW_SUSFS_KERNEL_REJECTS}"
            echo "ALLOW_SUSFS_KSU_PATCH_REJECTS=${ALLOW_SUSFS_KSU_PATCH_REJECTS}"
            git rev-parse HEAD || true
            git log -1 --oneline || true
          } | tee logs/build-env.log

      - name: Add pinned ReSukiSU source
        run: |
          set -e
          set -o pipefail
          mkdir -p logs

          if [ -n "${RESUKISU_REF}" ]; then
            echo "Using pinned ReSukiSU ref: ${RESUKISU_REF}"
            curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" \
              | bash -s "${RESUKISU_REF}" 2>&1 | tee logs/resukisu-setup.log
          else
            echo "Using ReSukiSU setup.sh default/latest"
            curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" \
              | bash 2>&1 | tee logs/resukisu-setup.log
          fi

          echo "ReSukiSU git info:" | tee logs/resukisu-commit.log
          if [ -d KernelSU/.git ]; then
            git -C KernelSU rev-parse HEAD | tee -a logs/resukisu-commit.log
            git -C KernelSU log -1 --oneline | tee -a logs/resukisu-commit.log
          elif [ -d drivers/kernelsu/.git ]; then
            git -C drivers/kernelsu rev-parse HEAD | tee -a logs/resukisu-commit.log
            git -C drivers/kernelsu log -1 --oneline | tee -a logs/resukisu-commit.log
          else
            echo "WARN: ReSukiSU git directory not found" | tee -a logs/resukisu-commit.log
            find . -maxdepth 3 -type d -name "*KernelSU*" -o -name "kernelsu" | tee -a logs/resukisu-commit.log || true
          fi

      - name: Apply ReSukiSU manual hooks
        run: |
          set -e
          set -o pipefail
          python3 .github/scripts/apply_resukisu_manual_hooks.py 2>&1 | tee logs/apply-resukisu-manual-hooks.log

      - name: Clone pinned SUSFS kernel-side patches
        run: |
          set -e
          set -o pipefail
          mkdir -p logs
          rm -rf susfs-src

          git clone --branch "${SUSFS_BRANCH}" "${SUSFS_REPO}" susfs-src 2>&1 | tee logs/susfs-clone.log

          if [ -n "${SUSFS_REF}" ]; then
            echo "Using pinned SUSFS ref: ${SUSFS_REF}"
            git -C susfs-src fetch --all --tags
            git -C susfs-src checkout "${SUSFS_REF}"
          else
            echo "Using latest SUSFS branch: ${SUSFS_BRANCH}"
          fi

          echo "SUSFS git info:" | tee logs/susfs-commit.log
          git -C susfs-src rev-parse HEAD | tee -a logs/susfs-commit.log
          git -C susfs-src log -1 --oneline | tee -a logs/susfs-commit.log

          echo "SUSFS kernel patch tree:" | tee logs/susfs-tree.log
          find susfs-src/kernel_patches -maxdepth 4 -type f | sort | tee -a logs/susfs-tree.log

      - name: Apply ReSukiSU SUSFS full implementation
        run: |
          set -e
          set -o pipefail
          python3 .github/scripts/apply_resukisu_susfs_full_impl.py 2>&1 | tee logs/apply-susfs.log

      - name: Fix optional ReSukiSU SUSFS dispatch commands
        if: always()
        run: |
          set -e
          set -o pipefail
          if [ -f .github/scripts/fix_resukisu_susfs_dispatch_optional_cmds.py ]; then
            python3 .github/scripts/fix_resukisu_susfs_dispatch_optional_cmds.py 2>&1 | tee logs/fix-resukisu-susfs-dispatch-optional-cmds.log
          else
            echo "skip: fix_resukisu_susfs_dispatch_optional_cmds.py not found" | tee logs/fix-resukisu-susfs-dispatch-optional-cmds.log
          fi

      - name: Fix ReSukiSU SUSFS magic define
        if: always()
        run: |
          set -e
          set -o pipefail
          if [ -f .github/scripts/fix_resukisu_susfs_magic.py ]; then
            python3 .github/scripts/fix_resukisu_susfs_magic.py 2>&1 | tee logs/fix-resukisu-susfs-magic.log
          else
            echo "skip: fix_resukisu_susfs_magic.py not found" | tee logs/fix-resukisu-susfs-magic.log
          fi

      - name: Collect SUSFS rejects and diff
        if: always()
        run: |
          set +e
          {
            echo "===== SUSFS REJECT FILE LIST ====="
            find . -name "*.rej" -print | sort
            echo
            echo "===== SUSFS REJECT CONTENTS ====="
            for f in $(find . -name "*.rej" -print | sort); do
              echo
              echo "## ============================================================"
              echo "FILE: ${f}"
              sed -n '1,220p' "${f}"
            done
            echo
            echo "===== GIT DIFF STAT ====="
            git diff --stat
            echo
            echo "===== GIT DIFF FULL ====="
            git diff -- . ':!susfs-src' ':!logs' ':!out'
          } | tee logs/susfs-rejects-and-diff.txt

      - name: Configure kernel
        run: |
          set -e
          set -o pipefail
          make O="${OUT_DIR}" ARCH="${ARCH}" "${DEFCONFIG}" 2>&1 | tee logs/configure.log

      - name: Build kernel
        run: |
          set -e
          set -o pipefail
          JOBS_INPUT='${{ github.event.inputs.jobs }}'
          if [ "${JOBS_INPUT}" = '$(nproc)' ] || [ -z "${JOBS_INPUT}" ]; then
            JOBS="$(nproc)"
          else
            JOBS="${JOBS_INPUT}"
          fi
          echo "Starting compilation with -j${JOBS}..."
          make -j"${JOBS}" O="${OUT_DIR}" ARCH="${ARCH}" \
            LLVM=1 LLVM_IAS=1 \
            2>&1 | tee logs/build.log

      - name: Collect build outputs
        if: always()
        run: |
          set +e
          mkdir -p artifacts
          {
            echo "===== OUTPUT FILES ====="
            find "${OUT_DIR}" -type f \( \
              -name 'Image' -o -name 'Image.gz' -o -name 'Image.gz-dtb' -o \
              -name '*.dtb' -o -name '*.dtbo' -o -name '*.ko' -o -name 'vmlinux' \
            \) -print | sort
            echo
            echo "===== COMMIT INFO ====="
            cat logs/resukisu-commit.log 2>/dev/null || true
            cat logs/susfs-commit.log 2>/dev/null || true
          } | tee logs/output-files.log

          cp "${OUT_DIR}/arch/arm64/boot/Image" artifacts/ 2>/dev/null || true
          cp "${OUT_DIR}/arch/arm64/boot/Image.gz" artifacts/ 2>/dev/null || true
          cp "${OUT_DIR}/arch/arm64/boot/Image.gz-dtb" artifacts/ 2>/dev/null || true
          find "${OUT_DIR}/arch/arm64/boot/dts" -type f \( -name '*.dtb' -o -name '*.dtbo' \) -exec cp -t artifacts {} + 2>/dev/null || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-resukisu-susfs-full-${{ github.run_number }}
          path: |
            logs/**
            **/*.rej
          if-no-files-found: warn

      - name: Upload kernel artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-artifacts-resukisu-susfs-full-${{ github.run_number }}
          path: artifacts/**
          if-no-files-found: warn

      - name: Upload full out directory on failure
        if: failure() && github.event.inputs.upload_full_out == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: out-debug-resukisu-susfs-full-${{ github.run_number }}
          path: out/**
          if-no-files-found: warn
