name: Experimental ReSukiSU SUSFS Build For Lisa

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: "Defconfig name"
        required: true
        default: "lisa_defconfig"
      jobs:
        description: "Build jobs"
        required: true
        default: "auto"
      release_tag:
        description: "GitHub Release tag name, empty = auto run number"
        required: false
        default: ""
      susfs_repo:
        description: "SUSFS kernel-side repo"
        required: true
        default: "https://gitlab.com/simonpunk/susfs4ksu.git"
      susfs_branch:
        description: "SUSFS branch/tag for kernel 5.4 experiment"
        required: true
        default: "kernel-5.4"
      susfs_kernel_patch:
        description: "Kernel patch file name inside kernel_patches, empty = auto find *5.4*.patch"
        required: false
        default: ""
      continue_on_susfs_patch_failure:
        description: "true = continue even if SUSFS patch has rejects; false = fail fast"
        required: true
        default: "false"

permissions:
  contents: write

jobs:
  build:
    name: Build ReSukiSU SUSFS experimental kernel
    runs-on: ubuntu-22.04

    env:
      ARCH: arm64
      SUBARCH: arm64
      OUT_DIR: out
      DEFCONFIG: ${{ github.event.inputs.defconfig }}
      SUSFS_REPO: ${{ github.event.inputs.susfs_repo }}
      SUSFS_BRANCH: ${{ github.event.inputs.susfs_branch }}
      SUSFS_KERNEL_PATCH: ${{ github.event.inputs.susfs_kernel_patch }}
      CONTINUE_ON_SUSFS_PATCH_FAILURE: ${{ github.event.inputs.continue_on_susfs_patch_failure }}

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          set -e
          sudo apt update
          sudo apt install -y \
            git curl wget zip unzip \
            build-essential bc bison flex \
            libssl-dev libelf-dev libyaml-dev \
            python3 python-is-python3 \
            clang lld llvm \
            gcc-aarch64-linux-gnu \
            cpio rsync file gzip patch

      - name: Prepare directories
        run: |
          mkdir -p logs artifacts/zips

      - name: Add ReSukiSU source
        run: |
          set -e
          set -o pipefail
          mkdir -p logs
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash 2>&1 | tee logs/resukisu-setup.log

      - name: Apply ReSukiSU manual hooks
        run: |
          set -e
          set -o pipefail
          mkdir -p logs
          python3 .github/scripts/apply_resukisu_manual_hooks.py "${DEFCONFIG}" 2>&1 | tee logs/apply-resukisu-manual-hooks.log

      - name: Clone SUSFS kernel-side patches
        run: |
          set -e
          set -o pipefail
          mkdir -p logs
          rm -rf susfs-src
          git clone --depth=1 --branch "${SUSFS_BRANCH}" "${SUSFS_REPO}" susfs-src 2>&1 | tee logs/susfs-clone.log
          echo "SUSFS tree:"
          find susfs-src/kernel_patches -maxdepth 3 -type f | sort | tee logs/susfs-tree.log

      - name: Apply SUSFS experimental patches
        run: |
          set -e
          set -o pipefail
          mkdir -p logs
          SUSFS_DIR="susfs-src" \
          SUSFS_KERNEL_PATCH="${SUSFS_KERNEL_PATCH}" \
          CONTINUE_ON_SUSFS_PATCH_FAILURE="${CONTINUE_ON_SUSFS_PATCH_FAILURE}" \
          python3 .github/scripts/apply_resukisu_susfs_experimental.py "${DEFCONFIG}" 2>&1 | tee logs/apply-susfs.log

      - name: Show ReSukiSU SUSFS config
        run: |
          set -e
          set -o pipefail
          mkdir -p logs
          {
            DEFCONFIG_PATH=""
            if [ -f "arch/arm64/configs/${DEFCONFIG}" ]; then
              DEFCONFIG_PATH="arch/arm64/configs/${DEFCONFIG}"
            elif [ -f "arch/arm64/configs/vendor/${DEFCONFIG}" ]; then
              DEFCONFIG_PATH="arch/arm64/configs/vendor/${DEFCONFIG}"
            else
              echo "ERROR: defconfig not found: ${DEFCONFIG}"
              find arch/arm64/configs -name "*defconfig" | sort
              exit 1
            fi
            echo "DEFCONFIG_PATH=${DEFCONFIG_PATH}"
            grep -n "CONFIG_KSU" "${DEFCONFIG_PATH}" || true
            grep -n "CONFIG_KALLSYMS" "${DEFCONFIG_PATH}" || true
            grep -n "CONFIG_KSU_SUSFS" "${DEFCONFIG_PATH}" || true
          } 2>&1 | tee logs/config.log

      - name: Build kernel using build.sh
        run: |
          set -e
          set -o pipefail
          mkdir -p logs
          chmod +x build.sh

          if [ "${{ github.event.inputs.jobs }}" = "auto" ]; then
            export JOBS="$(nproc --all)"
          else
            export JOBS="${{ github.event.inputs.jobs }}"
          fi

          export ARCH=arm64
          export SUBARCH=arm64
          export OUT_DIR="${OUT_DIR}"
          export DEFCONFIG="${DEFCONFIG}"

          {
            echo "ARCH=${ARCH}"
            echo "SUBARCH=${SUBARCH}"
            echo "OUT_DIR=${OUT_DIR}"
            echo "DEFCONFIG=${DEFCONFIG}"
            echo "JOBS=${JOBS}"
            echo "SUSFS_REPO=${SUSFS_REPO}"
            echo "SUSFS_BRANCH=${SUSFS_BRANCH}"
            echo "SUSFS_KERNEL_PATCH=${SUSFS_KERNEL_PATCH}"
            echo "GITHUB_SHA=${GITHUB_SHA}"
            echo "GITHUB_RUN_NUMBER=${GITHUB_RUN_NUMBER}"
          } | tee logs/build-env.log

          bash build.sh 2>&1 | tee logs/build.log

      - name: Collect flashable zip
        if: always()
        run: |
          set -e
          set -o pipefail
          mkdir -p artifacts/zips logs
          {
            echo "Searching for flashable zip from build.sh..."
            mapfile -t ZIP_FILES < <(
              find . -type f -name "*.zip" \
                ! -path "./.git/*" \
                ! -path "./artifacts/*" \
                ! -path "./susfs-src/*" \
                ! -path "./KernelSU-Next/*" \
                ! -path "./ReSukiSU/*" \
                | sort
            )
            if [ "${#ZIP_FILES[@]}" -eq 0 ]; then
              echo "WARNING: No zip found."
              find . -type f -name "*.zip" || true
            else
              echo "Found zip(s):"
              printf '%s\n' "${ZIP_FILES[@]}"
              for zipfile in "${ZIP_FILES[@]}"; do
                cp -v "${zipfile}" artifacts/zips/
              done
            fi
            echo "Artifacts ready:"
            find artifacts -type f -print || true
          } 2>&1 | tee logs/collect.log

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lisa-resukisu-susfs-experimental-logs-${{ github.run_number }}
          path: logs/**
          if-no-files-found: warn

      - name: Upload kernel artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lisa-kernel-resukisu-susfs-experimental-${{ github.run_number }}
          path: artifacts/**
          if-no-files-found: warn

      - name: Upload zip to GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          set -e
          set -o pipefail
          if [ -z "${INPUT_RELEASE_TAG}" ]; then
            RELEASE_TAG="resukisu-susfs-lisa-${{ github.run_number }}"
          else
            RELEASE_TAG="${INPUT_RELEASE_TAG}"
          fi
          RELEASE_NAME="Lisa Kernel ReSukiSU SUSFS Experimental - ${RELEASE_TAG}"
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Release exists"
          else
            gh release create "${RELEASE_TAG}" \
              --title "${RELEASE_NAME}" \
              --notes "Experimental ReSukiSU + SUSFS AnyKernel3 build for Xiaomi lisa. SUSFS patch may require manual backport if upstream patch hunks reject."
          fi
          ZIPS="$(find artifacts/zips -type f -name "*.zip" | sort)"
          if [ -z "${ZIPS}" ]; then
            echo "ERROR: no zip found to upload"
            exit 1
          fi
          gh release upload "${RELEASE_TAG}" ${ZIPS} --clobber
